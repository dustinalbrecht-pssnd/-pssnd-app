  <style>

:root{
  --mango:#F2A900;
  --mango-soft:#FFD36A;
  --coral:#FF7D5C;
  --coral-deep:#F25F44;
  --cream:#FFF9F4;
  --cream-2:#FFF3EB;
  --peach:#FFE0D1;
  --ink:#1E2228;
  --muted:#6E747C;
  --muted-2:#8C9188;
  --line:#F1E4DA;
  --card:#FFFFFF;
  --glass:rgba(255,255,255,.74);
  --glass-strong:rgba(255,255,255,.88);
  --shadow:0 24px 70px rgba(51,30,18,.10);
  --shadow-soft:0 10px 32px rgba(51,30,18,.06);
  --radius:28px;
  --radius-lg:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
body{
  background:
    radial-gradient(circle at 92% 4%, rgba(255,125,92,.18), transparent 23%),
    radial-gradient(circle at 12% 85%, rgba(242,169,0,.14), transparent 28%),
    linear-gradient(180deg, #FFF9F4 0%, #FFF6F0 100%);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{
  width:min(100%,460px);
  margin:0 auto;
  min-height:100svh;
  background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.82));
  backdrop-filter:blur(18px);
  position:relative;
  padding-bottom:92px;
  box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 30px 90px rgba(40,24,15,.08);
}
.app-header{
  position:sticky;top:0;z-index:30;
  height:78px;padding:env(safe-area-inset-top) 18px 0;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  background:linear-gradient(to bottom, rgba(255,249,244,.96), rgba(255,249,244,.84), rgba(255,249,244,0));
  backdrop-filter:blur(16px);
}
.brand-logo{height:34px;width:auto;justify-self:center;mix-blend-mode:multiply}
.icon-button{
  width:40px;height:40px;border:1px solid rgba(255,255,255,.65);border-radius:14px;
  background:var(--glass);color:var(--ink);font-size:24px;display:grid;place-items:center;
  box-shadow:var(--shadow-soft)
}
.icon-button.hidden{visibility:hidden}
main{padding:8px 18px 28px}
.screen{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}
.hero-space{padding-top:4vh}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:#C9553B;background:rgba(255,255,255,.8);border:1px solid #F3DED1;
  padding:8px 11px;border-radius:999px;margin-bottom:14px
}
h1{font-size:clamp(34px,9vw,45px);line-height:1.01;letter-spacing:-.06em;margin:0 0 14px}
h2{font-size:29px;line-height:1.06;letter-spacing:-.045em;margin:0 0 12px}
h3{font-size:21px;letter-spacing:-.03em;margin:0 0 8px}
p{margin:0;color:var(--muted);line-height:1.58}
.hero-card{
  height:205px;margin:28px 0 24px;border-radius:34px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFE1A0 0%, var(--mango) 38%, var(--coral) 100%);
  box-shadow:var(--shadow)
}
.hero-card::before,.hero-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
.hero-card::before{width:180px;height:180px;right:-30px;top:-56px}
.hero-card::after{width:120px;height:120px;left:18px;bottom:-32px}
.hero-icon{
  position:absolute;left:24px;top:24px;width:80px;height:80px;border-radius:26px;background:rgba(255,255,255,.96);
  box-shadow:0 14px 30px rgba(63,34,20,.12);display:grid;place-items:center;transform:rotate(-7deg)
}
.hero-icon img{width:61px;height:auto;mix-blend-mode:multiply}
.hero-path{position:absolute;left:102px;right:28px;top:117px;height:6px;border-radius:999px;background:rgba(255,255,255,.96);transform:rotate(-8deg)}
.hero-path::after{content:"";position:absolute;right:-4px;top:-7px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.16)}
.btn{
  width:100%;border:0;border-radius:20px;padding:17px 18px;font-weight:850;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-primary{background:linear-gradient(135deg,var(--mango),var(--coral));color:#2A180F;box-shadow:0 15px 30px rgba(255,125,92,.18)}
.btn-secondary{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.7);color:var(--ink);box-shadow:var(--shadow-soft)}
.btn-ghost{background:transparent;color:var(--muted);padding:12px}
.actions{display:grid;grid-template-columns:.82fr 1.18fr;gap:10px;margin-top:24px}
.actions.one{grid-template-columns:1fr}
.progress-wrap{margin-bottom:26px}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--muted);font-weight:800}
.progress{height:6px;background:rgba(238,229,221,.9);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--mango),var(--coral));border-radius:999px;transition:width .25s ease}
.choices{display:grid;gap:10px;margin-top:24px}
.choice{
  border:1px solid rgba(255,255,255,.8);background:var(--glass);backdrop-filter:blur(10px);
  border-radius:22px;padding:16px 16px;display:flex;align-items:center;gap:13px;text-align:left;color:var(--ink);font-weight:750;line-height:1.35;
  box-shadow:var(--shadow-soft)
}
.choice .emoji{font-size:22px;width:30px;text-align:center}
.choice.selected{
  border-color:#F1C0AB;
  background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,244,237,.92));
  box-shadow:0 12px 26px rgba(255,125,92,.10)
}
.grid-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{
  min-height:116px;border:1px solid rgba(255,255,255,.8);border-radius:24px;background:var(--glass);
  backdrop-filter:blur(10px);padding:16px 14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);
  box-shadow:var(--shadow-soft)
}
.tile .tile-icon{font-size:23px}
.tile strong{font-size:14px;line-height:1.3}
.tile.selected{border-color:#F1B49A;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,243,236,.96))}
.note{margin-top:18px;padding:16px 16px;border-radius:20px;background:linear-gradient(180deg,#FFF6EF,#FFF2EA);border:1px solid #F5DED2;color:#5E443E;line-height:1.52;box-shadow:var(--shadow-soft)}
.textbox,.card,.profile-block,.chance-card,.stat,.match-card,.swipe-card{
  background:var(--glass-strong);
  border:1px solid rgba(255,255,255,.74);
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(14px);
}
.textbox{margin-top:16px;border-radius:26px;padding:17px}
textarea{width:100%;min-height:145px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:16px;line-height:1.52}
textarea::placeholder{color:#AAA6A2}
.mic-card{
  margin-top:12px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.74);border-radius:24px;padding:14px;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px)
}
.mic-button{
  width:54px;height:54px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--mango),var(--coral));
  display:grid;place-items:center;font-size:22px;flex:none;color:#23150E;box-shadow:0 10px 26px rgba(255,125,92,.16)
}
.mic-button.recording{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(255,125,92,.12)}}
.mic-copy strong{display:block;font-size:15px;margin-bottom:3px}
.small{font-size:13px;color:var(--muted)}
audio{width:100%;margin-top:10px}
.chips,.badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.chip,.badge{
  padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid #F3E2D8;color:#604039;font-size:13px;font-weight:760;line-height:1.35
}
.chip.selectable{cursor:pointer}
.chip.off{opacity:.42;text-decoration:line-through}
.card{margin-top:18px;border-radius:26px;padding:18px}
.card.soft{background:linear-gradient(180deg,rgba(255,247,240,.92),rgba(255,244,236,.88))}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.value{font-weight:850;color:var(--ink)}
.field{margin-top:18px}
.field label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;margin-bottom:10px}
.field input[type="range"]{width:100%;accent-color:var(--coral)}
.segmented{display:flex;gap:8px;flex-wrap:wrap}
.seg{
  border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.78);border-radius:999px;padding:10px 12px;font-weight:760;font-size:13px;color:var(--ink)
}
.seg.selected{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,241,232,.96));border-color:#F1BEA7}
.profile-block{margin-top:13px;padding:16px;border-radius:23px}
.profile-block b{display:block;font-size:14px;margin-bottom:7px}
.profile-block p{font-size:14px;color:var(--ink)}
.match-list{display:grid;gap:14px;margin-top:20px}
.match-card{border-radius:29px;padding:18px}
.fit{
  display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;
  background:linear-gradient(135deg,rgba(242,169,0,.18),rgba(255,125,92,.18));color:#63372F;font-size:13px;font-weight:850
}
.subtitle{font-size:14px;color:var(--muted)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.info{padding:12px;border-radius:18px;background:linear-gradient(180deg,#FFFDFB,#FFF7F1);border:1px solid #F6E7DD}
.info b{display:block;font-size:11px;color:#665954;margin-bottom:4px}
.info span{font-size:14px;font-weight:780}
.reasons{display:grid;gap:8px;margin-top:15px}
.reason{
  padding:11px 12px;border-radius:16px;border:1px solid #F2E6DD;font-size:13px;line-height:1.42;background:rgba(255,255,255,.76)
}
.reason.good::before{content:"✓ ";font-weight:900;color:#C9642E}
.reason.warn::before{content:"⚠️ "}
.match-actions{display:grid;grid-template-columns:.84fr 1.16fr;gap:9px;margin-top:16px}
.match-actions .btn{padding:14px}
.bottom-nav{
  position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  background:rgba(255,249,244,.92);border-top:1px solid rgba(255,255,255,.65);backdrop-filter:blur(22px)
}
.bottom-nav.hidden{display:none}
.bottom-nav button{
  border:0;background:transparent;color:var(--muted);border-radius:16px;padding:8px 3px;display:flex;flex-direction:column;gap:3px;align-items:center
}
.bottom-nav button span{font-size:18px}
.bottom-nav button small{font-size:10px}
.bottom-nav button.active{background:rgba(255,241,232,.95);color:#D45138;font-weight:850}
.bottom-nav .nav-main{
  transform:translateY(-8px);background:linear-gradient(135deg,var(--mango),var(--coral));color:#26170f;
  box-shadow:0 12px 24px rgba(255,125,92,.16)
}
.bottom-nav .nav-main.active{background:linear-gradient(135deg,var(--mango),var(--coral));color:#26170f}
.home-hero{padding:12px 0 4px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{border-radius:24px;padding:16px}
.stat .num{font-size:28px;font-weight:900;letter-spacing:-.04em}
.stat .label{font-size:12px;color:var(--muted);margin-top:3px}
.checkin{display:flex;gap:8px;margin-top:13px}
.mood-btn{
  flex:1;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.85);border-radius:16px;padding:12px 5px;font-size:21px;box-shadow:var(--shadow-soft)
}
.mood-btn.selected{border-color:var(--coral);background:#FFF1E9}
.trend{display:flex;align-items:end;gap:7px;height:70px;margin-top:14px;padding:0 4px}
.bar{flex:1;background:linear-gradient(to top,var(--mango),var(--coral));border-radius:8px 8px 3px 3px;min-height:12px;opacity:.76}
.chance-card{padding:16px;border-radius:24px;margin-top:10px}
.chat{display:grid;gap:10px;margin-top:16px}
.bubble{max-width:86%;padding:13px 14px;border-radius:20px;line-height:1.45;font-size:14px;box-shadow:var(--shadow-soft)}
.bubble.bot{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.7)}
.bubble.user{justify-self:end;background:linear-gradient(135deg,rgba(255,243,232,.98),rgba(255,235,226,.96));border:1px solid #F1D5C7}
.chat-row{display:flex;gap:8px;margin-top:14px}
.chat-row input{flex:1;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.84);border-radius:18px;padding:14px;outline:none;box-shadow:var(--shadow-soft)}
.chat-row button{width:48px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--mango),var(--coral));font-weight:900}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.toast{
  position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%) translateY(18px);opacity:0;transition:.2s;
  background:#20252B;color:white;border-radius:999px;padding:11px 15px;font-size:13px;pointer-events:none;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* V0.2 modern additions */
button:disabled{opacity:.42;cursor:not-allowed}
.version-pill{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.84);border:1px solid #F1E3D8;color:var(--muted);font-size:11px;font-weight:800
}
.selection-count{
  display:inline-flex;padding:8px 11px;border-radius:999px;background:#FFF1EA;color:#944C3C;font-size:12px;font-weight:800;margin-top:14px
}
.match-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.match-toolbar .small{font-weight:700}
.deck-wrap{position:relative;min-height:520px;margin-top:18px}
.deck-shadow{
  position:absolute;left:10px;right:10px;top:16px;height:482px;border-radius:32px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.7);opacity:.7;transform:scale(.965);box-shadow:var(--shadow-soft)
}
.swipe-card{
  position:relative;z-index:2;border-radius:32px;padding:20px;touch-action:pan-y;user-select:none;
  transition:transform .22s ease,opacity .22s ease
}
.swipe-card.dragging{transition:none}
.swipe-stamp{
  position:absolute;top:28px;padding:8px 13px;border:3px solid;border-radius:12px;font-weight:950;
  letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none
}
.swipe-stamp.nope{left:22px;color:#E45C49;border-color:#E45C49;transform:rotate(-10deg)}
.swipe-stamp.like{right:22px;color:#D7831A;border-color:#D7831A;transform:rotate(10deg)}
.swipe-actions{display:grid;grid-template-columns:1fr .9fr 1fr;gap:10px;margin-top:14px}
.round-action{
  border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.82);border-radius:19px;padding:14px 10px;font-weight:850;color:var(--ink);
  box-shadow:var(--shadow-soft)
}
.round-action.like{background:linear-gradient(135deg,var(--mango),var(--coral));border:0;color:#2b180e}
.match-mini-reasons{display:grid;gap:8px;margin-top:16px}
.match-mini-reasons div{font-size:13px;line-height:1.42;padding:10px 11px;border-radius:15px;background:rgba(255,250,246,.95);border:1px solid #F4E7DE}
.match-mini-reasons .warning{background:#FFF4EF}
.score-breakdown{display:grid;gap:12px;margin-top:18px}
.score-line{display:grid;grid-template-columns:105px 1fr 34px;gap:9px;align-items:center;font-size:12px}
.score-line b{font-size:12px}
.score-track{height:7px;background:#EFE9E3;border-radius:999px;overflow:hidden}
.score-track span{display:block;height:100%;background:linear-gradient(90deg,var(--mango),var(--coral));border-radius:999px}
.sheet-backdrop{position:fixed;z-index:80;inset:0;background:rgba(24,20,17,.28);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:min(100%,460px);background:linear-gradient(180deg,#FFF8F3,#FFF3EC);border-radius:30px 30px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -16px 50px rgba(30,20,14,.16)
}
.sheet h3{font-size:24px;margin-bottom:7px}
.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
.feedback-btn{
  border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.86);border-radius:17px;padding:13px 10px;font-size:13px;font-weight:750;color:var(--ink)
}
.feedback-skip{margin-top:10px}
.match-empty-icon{font-size:42px;margin-bottom:12px}
.voice-status{
  display:flex;align-items:center;gap:8px;margin-top:11px;padding:10px 12px;border-radius:15px;background:#FFF6EF;font-size:12px;color:#6A5149
}
.record-timer{font-variant-numeric:tabular-nums;font-weight:850;color:var(--coral-deep)}
.profile-health{display:flex;align-items:center;gap:12px;margin-top:15px}
.ring{
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:900;
  background:conic-gradient(var(--coral) var(--pct),#EFE7E0 0);position:relative
}
.ring::before{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}
.ring span{position:relative;z-index:1;font-size:13px}
.top-match-card{
  margin-top:14px;padding:16px;border-radius:24px;background:linear-gradient(135deg,#FFF7EF,#FFF0E8);
  border:1px solid #F4DBCC;box-shadow:var(--shadow-soft)
}
.inline-link{border:0;background:transparent;color:#C7543D;font-weight:800;padding:0;text-decoration:none}
.coach-context{
  margin-top:14px;padding:13px 14px;border-radius:18px;background:linear-gradient(180deg,#FFF6EF,#FFF1E8);
  border:1px solid #F4DCCE;font-size:12px;color:#634B43;line-height:1.48
}
.privacy-note{
  display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:13px 14px;border-radius:18px;
  background:rgba(255,255,255,.84);border:1px solid #F1E4D8;font-size:12px;color:var(--muted);line-height:1.45
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function loadState(){
  try{
    const parsed = JSON.parse(localStorage.getItem("pssnd_state") || "null");
    const merged = parsed ? {...clone(initialState), ...parsed} : clone(initialState);
    merged.version = APP_VERSION;
    merged.problems = Array.isArray(merged.problems)?merged.problems:[];
    merged.wishes = Array.isArray(merged.wishes)?merged.wishes:[];
    merged.skills = Array.isArray(merged.skills)?merged.skills:[];
    merged.interested = Array.isArray(merged.interested)?merged.interested:[];
    merged.skipped = Array.isArray(merged.skipped)?merged.skipped:[];
    merged.checkins = Array.isArray(merged.checkins)?merged.checkins:[];
    merged.chat = Array.isArray(merged.chat)&&merged.chat.length?merged.chat:clone(initialState.chat);
    merged.rejectionFeedback = merged.rejectionFeedback || {};
    return merged;
  }catch(e){ return clone(initialState); }
}
function saveState(){ localStorage.setItem("pssnd_state", JSON.stringify(state)); }
function resetState(){
  if(confirm("PSSND wirklich zurücksetzen? Deine lokal gespeicherten Angaben werden gelöscht.")){
    stopRecording(true);
    localStorage.removeItem("pssnd_state");
    state=clone(initialState);
    route("welcome");
  }
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1900);
}
function route(name){

function setOnboarding(step){

function toggleIn(arr,val){
  const i=arr.indexOf(val); i>=0?arr.splice(i,1):arr.push(val); saveState(); render();

function escapeHTML(s=""){

}
function avg(arr){return arr.length?arr.reduce((s,x)=>s+x.value,0)/arr.length:0}

function inferSkills(){
  const t=(state.experience+" "+state.recognizedText).toLowerCase();
  const skills=[];
  const add=(text,short,tags=[])=>{if(!skills.some(s=>s.short===short))skills.push({text,short,tags,active:true})};
  if(/lager|kommission|waren|versand|logistik/.test(t))add("Du kennst Abläufe aus der Praxis – nicht nur aus der Theorie.","Praxisabläufe",["lager","waren","versand"]);
  if(/stapler|gabelstapler/.test(t))add("Du gehst routiniert mit Verantwortung und Arbeitsmitteln um.","Verantwortung",["stapler","lager"]);
  if(/kasse|verkauf|kunden|service|einzelhandel/.test(t))add("Du kannst mit Menschen umgehen – auch wenn es mal stressig wird.","Menschenumgang",["kunden","service"]);
  if(/organis|plan|koord|überblick|ueberblick/.test(t))add("Du behältst den Überblick, wenn mehrere Dinge gleichzeitig laufen.","Überblick",["organisation"]);
  if(/team|kolleg/.test(t))add("Du weißt, wann du selbst anpacken und wann du dich mit anderen abstimmen musst.","Teamarbeit",["team"]);
  if(/chef|leitung|verantwort|einarbeit/.test(t))add("Andere verlassen sich auf dich, wenn Verantwortung übernommen werden muss.","Verlässlichkeit",["team","organisation"]);
  if(/telefon|mail|büro|buero|verwaltung/.test(t))add("Du kannst Informationen sortieren und verständlich weitergeben.","Kommunikation",["telefon","organisation"]);
  if(/maschine|produktion|montage|fertigung/.test(t))add("Du arbeitest praktisch, konzentriert und nah am echten Ergebnis.","Praktisch arbeiten",["produktion"]);
  if(/\d+\s*(jahr|jahre)/.test(t))add("Du bringst echte Erfahrung mit – nicht nur Theorie.","Erfahrung",[]);
  if(state.wishes.includes("entwicklung"))add("Du willst nicht nur wechseln – du willst dich weiterentwickeln.","Entwicklungswille",["organisation"]);
  if(state.problems.includes("stress"))add("Du weißt inzwischen ziemlich genau, welche Arbeitsweise langfristig besser zu dir passt.","Klarheit über Bedingungen",[]);
  [
    ["Andere können sich darauf verlassen, dass du Dinge zu Ende bringst.","Verlässlichkeit",["team"]],
    ["Du kennst deinen Arbeitsalltag aus der Praxis und weißt, worauf es ankommt.","Praxiserfahrung",["lager"]],
    ["Du kannst klar benennen, was dein nächster Job besser machen soll.","Klarheit",[]]
  ].forEach(f=>{if(skills.length<5)add(...f)});
  state.skills=skills.slice(0,8);saveState();
}
function activeSkills(){return state.skills.filter(s=>s.active!==false)}
function deriveFields(){
  const tags=new Set(activeSkills().flatMap(s=>s.tags||[])), f=[];
  if(tags.has("lager")||tags.has("waren"))f.push("Lager & Logistik","Warenannahme");
  if(tags.has("produktion"))f.push("Produktionslogistik");
  if(tags.has("organisation"))f.push("Koordination");
  if(tags.has("telefon")||tags.has("kunden"))f.push("Service / Disposition");
  if(state.wishes.includes("neu"))f.push("Quereinstieg");
  if(!f.length)f.push("Quereinstieg","Logistik","Service");
  state.fields=[...new Set(f)].slice(0,5);saveState();
}
function skillTags(){return new Set(activeSkills().flatMap(s=>s.tags||[]))}
function profileCompleteness(){
  let p=20;
  if(state.mood)p+=8;
  if(state.problems.length)p+=10;
  if(state.wishes.length)p+=15;
  if(state.experience.trim().length>15)p+=18;
  if(activeSkills().length>=3)p+=14;
  if(state.salary)p+=8;
  if(state.distance)p+=7;
  return Math.min(100,p);
}

/* Matching V0.2: transparent weighted fit, not a claim of objective suitability. */
function scoreJob(job){
  const reasons=[],warns=[],breakdown={};
  let total=0;
  // Salary: 22
  const mid=(job.salaryMin+job.salaryMax)/2;
  let sal=job.salaryMax>=state.salary?22:mid>=state.salary*.9?14:6;
  total+=sal; breakdown.Gehalt=Math.round(sal/22*100);
  sal===22?reasons.push("Gehalt erreicht deinen Wunsch"):warns.push("Gehalt liegt unter deinem Wunsch");

  // Distance: 18
  let dist=0;
  if(job.distance<=state.distance)dist=18;
  else dist=Math.max(0,18-(job.distance-state.distance)*1.2);
  total+=dist;breakdown.Entfernung=Math.round(dist/18*100);
  dist>=16?reasons.push("Arbeitsweg liegt in deiner Grenze"):warns.push("Arbeitsweg ist weiter als gewünscht");

  // Nights: 16
  let night=12;
  if(state.night==="Nein")night=job.night?0:16;
  else if(state.night==="Ja")night=job.night?16:10;
  total+=night;breakdown.Schichten=Math.round(night/16*100);
  if(state.night==="Nein"&&!job.night)reasons.push("Keine Nachtschicht");
  if(state.night==="Nein"&&job.night)warns.push("Nachtschicht gehört dazu");

  // Weekend: 8
  let week=6;
  if(state.weekends==="Möglichst frei")week=job.weekend?2:8;
  if(state.weekends==="Gelegentlich okay")week=job.weekend?6:8;
  total+=week;breakdown.Wochenende=Math.round(week/8*100);
  if(state.weekends==="Möglichst frei"&&!job.weekend)reasons.push("Wochenenden sind frei");
  if(state.weekends==="Möglichst frei"&&job.weekend)warns.push("Gelegentliche Wochenendarbeit");

  // Work wishes: 14
  let wishes=7;
  if(state.wishes.includes("entwicklung")&&job.growth)wishes+=3;
  if(state.wishes.includes("stress")&&job.stress==="niedrig")wishes+=3;
  if(state.wishes.includes("zeiten")&&!job.night)wishes+=1;
  wishes=Math.min(14,wishes);
  total+=wishes;breakdown.Wünsche=Math.round(wishes/14*100);
  if(state.wishes.includes("entwicklung")&&job.growth)reasons.push("Entwicklungsmöglichkeiten vorhanden");
  if(state.wishes.includes("stress")&&job.stress==="niedrig")reasons.push("Ruhigeres Arbeitsumfeld");

  // Transferable skills: 22
  const tags=skillTags(), overlap=job.tags.filter(t=>tags.has(t)).length;
  let skills=8;
  if(overlap===1)skills=14;
  if(overlap===2)skills=18;
  if(overlap>=3)skills=22;
  if(state.wishes.includes("neu")&&overlap===0)skills=11;
  total+=skills;breakdown.Erfahrung=Math.round(skills/22*100);
  overlap?reasons.push("Deine bisherigen Erfahrungen lassen sich gut übertragen"):reasons.push("Quereinstieg ist grundsätzlich denkbar");

  // learn from explicit rejection reasons
  const feedback=Object.values(state.rejectionFeedback||{});
  if(feedback.includes("zu_weit")&&job.distance>state.distance)total-=4;
  if(feedback.includes("schicht")&&job.night)total-=5;
  if(feedback.includes("gehalt")&&job.salaryMax<state.salary)total-=4;

  const score=Math.max(32,Math.min(98,Math.round(total)));
  return {score,breakdown,reasons:[...new Set(reasons)].slice(0,4),warns:[...new Set(warns)].slice(0,2)};
}

function setupSwipe(card,id){
  if(!card)return;
  let startX=0,currentX=0,dragging=false;
  const nope=$("#nopeStamp"),like=$("#likeStamp");
  const down=e=>{dragging=true;startX=e.clientX??e.touches?.[0]?.clientX??0;currentX=0;card.classList.add("dragging")};
  const move=e=>{
    if(!dragging)return;
    const x=e.clientX??e.touches?.[0]?.clientX??startX;
    currentX=x-startX;
    card.style.transform=`translateX(${currentX}px) rotate(${currentX/22}deg)`;
    const op=Math.min(1,Math.abs(currentX)/90);
    if(currentX<0){nope.style.opacity=op;like.style.opacity=0}else{like.style.opacity=op;nope.style.opacity=0}
  };
  const up=()=>{
    if(!dragging)return;dragging=false;card.classList.remove("dragging");
    if(currentX>95){card.style.transform="translateX(520px) rotate(18deg)";card.style.opacity="0";setTimeout(()=>acceptJob(id),180)}
    else if(currentX<-95){card.style.transform="translateX(-520px) rotate(-18deg)";card.style.opacity="0";setTimeout(()=>showFeedbackSheet(id),180)}
    else{card.style.transform="";nope.style.opacity=0;like.style.opacity=0}
  };
  card.addEventListener("pointerdown",down);window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:false});
}

function bestMimeType(){
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  return types.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
}
async function toggleRecording(){
  if(mediaRecorder?.state==="recording"){stopRecording(false);return}
  try{
    if(!window.isSecureContext)toast("Öffne PSSND über deine HTTPS-Adresse.");
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];recSeconds=0;
    const mime=bestMimeType();
    mediaRecorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);
    mediaRecorder.ondataavailable=e=>{if(e.data?.size)audioChunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      clearInterval(recTimer);
      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||mime||"audio/mp4"});
      if(lastAudioURL)URL.revokeObjectURL(lastAudioURL);
      lastAudioURL=URL.createObjectURL(blob);
      state.recorded=true;saveState();
      $("#audioWrap")&&( $("#audioWrap").innerHTML=`<audio controls src="${lastAudioURL}"></audio>` );
      $("#micBtn")?.classList.remove("recording");
      if($("#micBtn"))$("#micBtn").textContent="🎙️";
      if($("#micTitle"))$("#micTitle").textContent="Aufnahme gespeichert";
      if($("#micText"))$("#micText").textContent="Du kannst sie anhören oder neu aufnehmen.";
      if($("#recordTimer"))$("#recordTimer").textContent="";
      mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;
      try{recognition?.stop()}catch(e){}
    };
    mediaRecorder.start(250);
    $("#micBtn")?.classList.add("recording");if($("#micBtn"))$("#micBtn").textContent="■";
    if($("#micTitle"))$("#micTitle").textContent="Ich höre zu …";
    if($("#micText"))$("#micText").textContent="Tippe erneut, wenn du fertig bist.";
    recTimer=setInterval(()=>{recSeconds++;if($("#recordTimer"))$("#recordTimer").textContent=`${String(Math.floor(recSeconds/60)).padStart(2,"0")}:${String(recSeconds%60).padStart(2,"0")}`},1000);
    startSpeechRecognition();
  }catch(e){
    if($("#micTitle"))$("#micTitle").textContent="Mikrofon nicht freigegeben";
    if($("#micText"))$("#micText").textContent="Erlaube Safari den Mikrofonzugriff oder nutze das Textfeld.";
  }
}
function stopRecording(silent=false){
  clearInterval(recTimer);
  if(mediaRecorder?.state==="recording")try{mediaRecorder.stop()}catch(e){}
  mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;
  try{recognition?.stop()}catch(e){}
  if(silent){mediaRecorder=null;audioChunks=[]}
}
function startSpeechRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  try{
    recognition=new SR();recognition.lang="de-DE";recognition.interimResults=false;recognition.continuous=false;
    recognition.onresult=e=>{
      const tx=[...e.results].map(r=>r[0]?.transcript||"").join(" ").trim();
      if(tx){state.recognizedText=(state.recognizedText+" "+tx).trim();state.experience=(state.experience+" "+tx).trim();saveState();if($("#experience"))$("#experience").value=state.experience}
    };
    recognition.start();
  }catch(e){}
}

window.addEventListener("beforeunload",()=>stopRecording(true));
render();

</script>
