  <style>

:root{
  --mango:#F2A900;
  --mango-soft:#FFD36A;
  --coral:#FF7D5C;
  --coral-deep:#F25F44;
  --cream:#FFF9F4;
  --cream-2:#FFF3EB;
  --peach:#FFE0D1;
  --ink:#1E2228;
  --muted:#6E747C;
  --muted-2:#8C9188;
  --line:#F1E4DA;
  --card:#FFFFFF;
  --glass:rgba(255,255,255,.74);
  --glass-strong:rgba(255,255,255,.88);
  --shadow:0 24px 70px rgba(51,30,18,.10);
  --shadow-soft:0 10px 32px rgba(51,30,18,.06);
  --radius:28px;
  --radius-lg:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
body{
  background:
    radial-gradient(circle at 92% 4%, rgba(255,125,92,.18), transparent 23%),
    radial-gradient(circle at 12% 85%, rgba(242,169,0,.14), transparent 28%),
    linear-gradient(180deg, #FFF9F4 0%, #FFF6F0 100%);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{
  width:min(100%,460px);
  margin:0 auto;
  min-height:100svh;
  background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.82));
  backdrop-filter:blur(18px);
  position:relative;
  padding-bottom:92px;
  box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 30px 90px rgba(40,24,15,.08);
}
.app-header{
  position:sticky;top:0;z-index:30;
  height:78px;padding:env(safe-area-inset-top) 18px 0;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  background:linear-gradient(to bottom, rgba(255,249,244,.96), rgba(255,249,244,.84), rgba(255,249,244,0));
  backdrop-filter:blur(16px);
}
.brand-logo{height:34px;width:auto;justify-self:center;mix-blend-mode:multiply}
.icon-button{
  width:40px;height:40px;border:1px solid rgba(255,255,255,.65);border-radius:14px;
  background:var(--glass);color:var(--ink);font-size:24px;display:grid;place-items:center;
  box-shadow:var(--shadow-soft)
}
.icon-button.hidden{visibility:hidden}
main{padding:8px 18px 28px}
.screen{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}
.hero-space{padding-top:4vh}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:#C9553B;background:rgba(255,255,255,.8);border:1px solid #F3DED1;
  padding:8px 11px;border-radius:999px;margin-bottom:14px
}
h1{font-size:clamp(34px,9vw,45px);line-height:1.01;letter-spacing:-.06em;margin:0 0 14px}
h2{font-size:29px;line-height:1.06;letter-spacing:-.045em;margin:0 0 12px}
h3{font-size:21px;letter-spacing:-.03em;margin:0 0 8px}
p{margin:0;color:var(--muted);line-height:1.58}
.hero-card{
  height:205px;margin:28px 0 24px;border-radius:34px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFE1A0 0%, var(--mango) 38%, var(--coral) 100%);
  box-shadow:var(--shadow)
}
.hero-card::before,.hero-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
.hero-card::before{width:180px;height:180px;right:-30px;top:-56px}
.hero-card::after{width:120px;height:120px;left:18px;bottom:-32px}
.hero-icon{
  position:absolute;left:24px;top:24px;width:80px;height:80px;border-radius:26px;background:rgba(255,255,255,.96);
  box-shadow:0 14px 30px rgba(63,34,20,.12);display:grid;place-items:center;transform:rotate(-7deg)
}
.hero-icon img{width:61px;height:auto;mix-blend-mode:multiply}
.hero-path{position:absolute;left:102px;right:28px;top:117px;height:6px;border-radius:999px;background:rgba(255,255,255,.96);transform:rotate(-8deg)}
.hero-path::after{content:"";position:absolute;right:-4px;top:-7px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.16)}
.btn{
  width:100%;border:0;border-radius:20px;padding:17px 18px;font-weight:850;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-primary{background:linear-gradient(135deg,var(--mango),var(--coral));color:#2A180F;box-shadow:0 15px 30px rgba(255,125,92,.18)}
.btn-secondary{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.7);color:var(--ink);box-shadow:var(--shadow-soft)}
.btn-ghost{background:transparent;color:var(--muted);padding:12px}
.actions{display:grid;grid-template-columns:.82fr 1.18fr;gap:10px;margin-top:24px}
.actions.one{grid-template-columns:1fr}
.progress-wrap{margin-bottom:26px}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;color:var(--muted);font-weight:800}
.progress{height:6px;background:rgba(238,229,221,.9);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--mango),var(--coral));border-radius:999px;transition:width .25s ease}
.choices{display:grid;gap:10px;margin-top:24px}
.choice{
  border:1px solid rgba(255,255,255,.8);background:var(--glass);backdrop-filter:blur(10px);
  border-radius:22px;padding:16px 16px;display:flex;align-items:center;gap:13px;text-align:left;color:var(--ink);font-weight:750;line-height:1.35;
  box-shadow:var(--shadow-soft)
}
.choice .emoji{font-size:22px;width:30px;text-align:center}
.choice.selected{
  border-color:#F1C0AB;
  background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,244,237,.92));
  box-shadow:0 12px 26px rgba(255,125,92,.10)
}
.grid-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{
  min-height:116px;border:1px solid rgba(255,255,255,.8);border-radius:24px;background:var(--glass);
  backdrop-filter:blur(10px);padding:16px 14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);
  box-shadow:var(--shadow-soft)
}
.tile .tile-icon{font-size:23px}
.tile strong{font-size:14px;line-height:1.3}
.tile.selected{border-color:#F1B49A;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,243,236,.96))}
.note{margin-top:18px;padding:16px 16px;border-radius:20px;background:linear-gradient(180deg,#FFF6EF,#FFF2EA);border:1px solid #F5DED2;color:#5E443E;line-height:1.52;box-shadow:var(--shadow-soft)}
.textbox,.card,.profile-block,.chance-card,.stat,.match-card,.swipe-card{
  background:var(--glass-strong);
  border:1px solid rgba(255,255,255,.74);
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(14px);
}
.textbox{margin-top:16px;border-radius:26px;padding:17px}
textarea{width:100%;min-height:145px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:16px;line-height:1.52}
textarea::placeholder{color:#AAA6A2}
.mic-card{
  margin-top:12px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.74);border-radius:24px;padding:14px;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px)
}
.mic-button{
  width:54px;height:54px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--mango),var(--coral));
  display:grid;place-items:center;font-size:22px;flex:none;color:#23150E;box-shadow:0 10px 26px rgba(255,125,92,.16)
}
.mic-button.recording{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(255,125,92,.12)}}
.mic-copy strong{display:block;font-size:15px;margin-bottom:3px}
.small{font-size:13px;color:var(--muted)}
audio{width:100%;margin-top:10px}
.chips,.badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.chip,.badge{
  padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid #F3E2D8;color:#604039;font-size:13px;font-weight:760;line-height:1.35
}
.chip.selectable{cursor:pointer}
.chip.off{opacity:.42;text-decoration:line-through}
.card{margin-top:18px;border-radius:26px;padding:18px}
.card.soft{background:linear-gradient(180deg,rgba(255,247,240,.92),rgba(255,244,236,.88))}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.value{font-weight:850;color:var(--ink)}
.field{margin-top:18px}
.field label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;margin-bottom:10px}
.field input[type="range"]{width:100%;accent-color:var(--coral)}
.segmented{display:flex;gap:8px;flex-wrap:wrap}
.seg{
  border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.78);border-radius:999px;padding:10px 12px;font-weight:760;font-size:13px;color:var(--ink)
}
.seg.selected{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,241,232,.96));border-color:#F1BEA7}
.profile-block{margin-top:13px;padding:16px;border-radius:23px}
.profile-block b{display:block;font-size:14px;margin-bottom:7px}
.profile-block p{font-size:14px;color:var(--ink)}
.match-list{display:grid;gap:14px;margin-top:20px}
.match-card{border-radius:29px;padding:18px}
.fit{
  display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;
  background:linear-gradient(135deg,rgba(242,169,0,.18),rgba(255,125,92,.18));color:#63372F;font-size:13px;font-weight:850
}
.subtitle{font-size:14px;color:var(--muted)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.info{padding:12px;border-radius:18px;background:linear-gradient(180deg,#FFFDFB,#FFF7F1);border:1px solid #F6E7DD}
.info b{display:block;font-size:11px;color:#665954;margin-bottom:4px}
.info span{font-size:14px;font-weight:780}
.reasons{display:grid;gap:8px;margin-top:15px}
.reason{
  padding:11px 12px;border-radius:16px;border:1px solid #F2E6DD;font-size:13px;line-height:1.42;background:rgba(255,255,255,.76)
}
.reason.good::before{content:"✓ ";font-weight:900;color:#C9642E}
.reason.warn::before{content:"⚠️ "}
.match-actions{display:grid;grid-template-columns:.84fr 1.16fr;gap:9px;margin-top:16px}
.match-actions .btn{padding:14px}
.bottom-nav{
  position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  background:rgba(255,249,244,.92);border-top:1px solid rgba(255,255,255,.65);backdrop-filter:blur(22px)
}
.bottom-nav.hidden{display:none}
.bottom-nav button{
  border:0;background:transparent;color:var(--muted);border-radius:16px;padding:8px 3px;display:flex;flex-direction:column;gap:3px;align-items:center
}
.bottom-nav button span{font-size:18px}
.bottom-nav button small{font-size:10px}
.bottom-nav button.active{background:rgba(255,241,232,.95);color:#D45138;font-weight:850}
.bottom-nav .nav-main{
  transform:translateY(-8px);background:linear-gradient(135deg,var(--mango),var(--coral));color:#26170f;
  box-shadow:0 12px 24px rgba(255,125,92,.16)
}
.bottom-nav .nav-main.active{background:linear-gradient(135deg,var(--mango),var(--coral));color:#26170f}
.home-hero{padding:12px 0 4px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{border-radius:24px;padding:16px}
.stat .num{font-size:28px;font-weight:900;letter-spacing:-.04em}
.stat .label{font-size:12px;color:var(--muted);margin-top:3px}
.checkin{display:flex;gap:8px;margin-top:13px}
.mood-btn{
  flex:1;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.85);border-radius:16px;padding:12px 5px;font-size:21px;box-shadow:var(--shadow-soft)
}
.mood-btn.selected{border-color:var(--coral);background:#FFF1E9}
.trend{display:flex;align-items:end;gap:7px;height:70px;margin-top:14px;padding:0 4px}
.bar{flex:1;background:linear-gradient(to top,var(--mango),var(--coral));border-radius:8px 8px 3px 3px;min-height:12px;opacity:.76}
.chance-card{padding:16px;border-radius:24px;margin-top:10px}
.chat{display:grid;gap:10px;margin-top:16px}
.bubble{max-width:86%;padding:13px 14px;border-radius:20px;line-height:1.45;font-size:14px;box-shadow:var(--shadow-soft)}
.bubble.bot{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.7)}

/* ===== YVIA V0.7 — Apple-inspired minimal system ===== */
:root{

}
body{

  font-size:49px!important;line-height:.94!important;

}

.swipe-actions{

  height:58px!important;border-radius:18px!important;

.round-action:active{transform:scale(.94)}
#detailsBtn,.round-action.like{
  background:#111214!important;color:#fff!important;border:0!important
}
.swipe-stamp{
  z-index:6;background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

/* Profile */
.profile-hero-v5{background:transparent!important;border:0!important;box-shadow:none!important}
.profile-photo{box-shadow:0 14px 36px rgba(30,24,18,.08)}
.profile-block,.card{

/* ================================
   YVIA V0.9 — refinement pass
   ================================ */
:root{
  --v9-bg:#FCFAF8;
  --v9-card:rgba(255,255,255,.86);
  --v9-ink:#121827;
  --v9-muted:#7C8798;
  --v9-line:rgba(18,24,39,.07);
  --v9-coral:#FF705F;
  --v9-pink:#F15B9A;
  --v9-mango:#F5B43B;
  --v9-blue:#4E7DFF;
  --v9-purple:#9B5CFF;
}
body{
  background:
    radial-gradient(circle at 88% 0%,rgba(255,112,95,.12),transparent 27%),
    radial-gradient(circle at 2% 30%,rgba(103,135,255,.07),transparent 24%),
    var(--v9-bg);
}
main{padding:14px 20px 118px}
.screen{animation:v9In .34s cubic-bezier(.2,.8,.2,1)}
@keyframes v9In{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.screen-kicker{
  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
  color:#9CA3AF;
  margin-bottom:12px
}

/* Login / first impression */
.yvia-welcome{padding-top:7vh}
.welcome-brand-lockup{gap:13px}
.welcome-logo-orb{
  width:54px;height:54px;border-radius:20px;
  background:rgba(255,255,255,.74);
  box-shadow:0 16px 44px rgba(255,112,95,.12)
}
.welcome-wordmark{font-size:29px;letter-spacing:.16em}
.welcome-copy{margin-top:50px}
.welcome-copy h1{
  font-size:54px;
  line-height:.94;
  letter-spacing:-.07em;
  font-weight:770
}
.welcome-copy p{font-size:16px;line-height:1.52;max-width:350px}
.welcome-art{
  height:220px;
  margin:24px 0 12px;
  filter:saturate(.92)
}
.auth-primary,.auth-apple{
  min-height:58px;
  border-radius:20px;
  font-size:14px
}
.auth-primary{
  background:linear-gradient(110deg,#FF7C64,#F45F8F);
  box-shadow:0 16px 36px rgba(244,95,143,.18)
}
.auth-apple{
  background:rgba(255,255,255,.9);
  border:1px solid var(--v9-line)
}

/* Stimmung */
.mood-v8{padding-top:12px}
.screen-title-row h1{
  font-size:52px;
  line-height:.93;
  letter-spacing:-.07em
}
.screen-title-row p{font-size:15px;line-height:1.5;max-width:340px}
.mood-grid{
  gap:11px;
  margin-top:30px
}
.mood-tile{
  min-height:118px;
  padding:17px;
  border-radius:24px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:0 12px 36px rgba(30,35,45,.045);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:transform .16s ease,box-shadow .16s ease
}
.mood-tile:active{transform:scale(.975)}
.mood-tile.featured{
  background:linear-gradient(140deg,#FF8A69,#F45D92);
  color:white;
  box-shadow:0 16px 34px rgba(244,93,146,.18)
}
.mood-tile b{font-size:15px;line-height:1.25}
.free-talk-v8{
  margin-top:18px;
  min-height:58px;
  border-radius:22px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--v9-line);
  box-shadow:0 10px 28px rgba(29,35,44,.04)
}

/* Mein Job */
.job-v9{padding-top:12px}
.job-hero-v9{
  display:grid;
  grid-template-columns:1fr 90px;
  gap:16px;
  align-items:start
}
.job-hero-v9 h1{
  font-size:46px;
  line-height:.96;
  letter-spacing:-.066em;
  margin:0 0 12px
}
.job-hero-v9 p{font-size:14px;line-height:1.48;margin:0}
.score-orb-v9{
  width:88px;height:88px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.95),rgba(255,255,255,.54) 35%,transparent 36%),
    linear-gradient(145deg,#FFE0B9,#FFD3DA 50%,#D8D1FF);
  box-shadow:0 16px 36px rgba(255,112,95,.11);
  border:1px solid rgba(255,255,255,.85)
}
.score-orb-v9 span{font-size:25px;font-weight:800;letter-spacing:-.04em}
.score-orb-v9 small{font-size:9px;color:#7C8798;margin-top:1px}

.metric-grid-v9{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:26px
}
.metric-grid-v9 article{
  padding:15px 12px 13px;
  border-radius:22px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--v9-line);
  box-shadow:0 10px 28px rgba(28,34,44,.035)
}
.metric-grid-v9 .metric-symbol{
  display:block;font-size:18px;margin-bottom:9px
}
.metric-grid-v9 strong{display:block;font-size:25px;letter-spacing:-.04em}
.metric-grid-v9 small{display:block;font-size:9px;color:#8A93A2;margin-top:2px}
.metric-grid-v9 i{
  display:block;height:5px;background:#EEF0F4;border-radius:999px;margin-top:11px;overflow:hidden
}
.metric-grid-v9 i b{
  display:block;height:100%;border-radius:inherit;
  background:linear-gradient(90deg,#FF9D72,#F26995)
}
.metric-grid-v9 article:nth-child(2) i b{background:linear-gradient(90deg,#5E8DFF,#7B66FF)}
.metric-grid-v9 article:nth-child(3) i b{background:linear-gradient(90deg,#9E6BFF,#D35DEB)}

.check-launcher-v9{
  width:100%;
  margin-top:13px;
  border:1px solid var(--v9-line);
  background:rgba(255,255,255,.88);
  border-radius:23px;
  padding:16px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  box-shadow:0 10px 28px rgba(28,34,44,.035)
}
.check-launcher-v9 small{
  display:block;font-size:9px;letter-spacing:.08em;color:#9AA1AD;font-weight:800;margin-bottom:3px
}
.check-launcher-v9 b{display:block;font-size:15px}
.check-launcher-v9 span{display:block;font-size:10px;color:#8B94A2;margin-top:2px}
.check-launcher-v9 em{
  width:34px;height:34px;border-radius:13px;display:grid;place-items:center;
  background:#F5F3F1;font-style:normal;font-size:20px;color:#596273
}
.check-launcher-v9.open em{background:#151A23;color:white}

.quick-check-v9{
  margin-top:9px;
  padding:15px 16px 16px;
  border-radius:23px;
  background:rgba(255,255,255,.92);
  border:1px solid var(--v9-line)
}
.quick-row-v9{
  padding:12px 0;
  border-bottom:1px solid var(--v9-line)
}
.quick-row-v9:last-of-type{border-bottom:0}
.quick-row-v9 label{display:block;font-size:11px;font-weight:700;margin-bottom:8px}
.quick-row-v9>div{display:flex;gap:6px}
.quick-row-v9 button{
  flex:1;min-height:40px;border:0;border-radius:13px;background:#F5F4F2;
  color:#697284;font-size:17px;font-weight:700
}
.quick-row-v9 button.word{font-size:10px}
.quick-row-v9 button.selected{background:#151A23;color:white}
.reason-wrap-v9{padding-top:12px}
.reason-wrap-v9>small{font-size:9px;color:#9AA1AD}
.reason-wrap-v9>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reason-wrap-v9 button{
  border:0;background:#F5F4F2;border-radius:999px;padding:8px 10px;font-size:9px;font-weight:700;color:#6F7886
}
.reason-wrap-v9 button.selected{background:#FFF0EB;color:#D45F49}
.save-check-v9{
  width:100%;margin-top:13px;border:0;border-radius:16px;padding:13px;
  background:#151A23;color:#fff;font-weight:750
}

.insight-v9{
  margin-top:13px;
  border-radius:25px;
  padding:20px;
  background:#151A23;
  color:white;
  box-shadow:0 18px 46px rgba(21,26,35,.10)
}
.insight-label-v9{font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.55);font-weight:800}
.insight-label-v9 span{color:#FFAD6A}
.insight-v9 h2{font-size:25px;line-height:1.08;margin:12px 0 8px;letter-spacing:-.04em}
.insight-v9 p{font-size:12px;line-height:1.5;color:rgba(255,255,255,.68)}

.trend-v9{
  margin-top:13px;
  border-radius:24px;
  background:rgba(255,255,255,.88);
  border:1px solid var(--v9-line);
  padding:16px
}
.trend-head-v9{display:flex;align-items:center;justify-content:space-between}
.trend-head-v9 small{font-size:9px;letter-spacing:.1em;color:#9AA1AD;font-weight:800}
.trend-head-v9 h3{font-size:16px;margin-top:3px}
.trend-head-v9 button{border:0;background:transparent;color:#8A93A2;font-size:10px}
.trend-v9 .trend-svg{height:125px;margin-top:8px}

.tomorrow-v9{
  display:grid;grid-template-columns:38px 1fr 30px;gap:10px;align-items:center;
  margin-top:13px;padding:16px;border-radius:24px;
  background:linear-gradient(135deg,#FFF0E8,#FFF8F4);
  border:1px solid rgba(255,112,95,.08)
}
.tip-bulb{
  width:36px;height:36px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#FFC35D,#FF8D6F);color:white
}
.tomorrow-v9 small{font-size:9px;letter-spacing:.08em;color:#A28174;font-weight:800}
.tomorrow-v9 p{font-size:11px;line-height:1.4;margin-top:3px;color:#655B57}
.tomorrow-v9 button{border:0;background:transparent;font-size:18px;color:#B56E59}

/* Matches */
.matches-v5{padding-top:12px}
.matches-v5>h1{
  font-size:45px!important;
  line-height:.96!important;
  letter-spacing:-.066em!important
}
.matches-v5>p{font-size:14px!important;line-height:1.48!important}
.match-toolbar{margin-top:22px}
.deck-wrap{margin-top:17px!important}
.swipe-card{
  border-radius:30px!important;
  border:1px solid var(--v9-line)!important;
  box-shadow:0 22px 58px rgba(34,39,50,.08)!important
}
.job-photo{height:300px!important}
.photo-score{
  top:15px!important;left:15px!important;

.photo-title{
  padding:25px 18px 17px!important
}

.match-body{padding:17px 18px 20px!important}
.match-pill-row{gap:7px!important}
.match-pill{

}
.swipe-actions{
  margin-top:11px!important;
  grid-template-columns:58px 1fr 58px!important
}
#detailsBtn{
  border-radius:18px!important;

}
.round-action.like{

/* Navigation */
.v8-nav,.v6-nav{
  width:min(calc(100% - 32px),428px);
  background:rgba(255,255,255,.88)!important;
  border:1px solid rgba(255,255,255,.9)!important;
  backdrop-filter:blur(26px) saturate(170%);

  box-shadow:0 14px 40px rgba(30,35,45,.08)!important

.v8-nav button.active,.v6-nav button.active{

  background:transparent!important

.v8-nav button.active span,.v6-nav button.active span{transform:translateY(-1px)}


/* =========================================================
   YVIA V1.0 — dark focus / one task per screen
   ========================================================= */
:root{
  --v10-bg:#070A10;
  --v10-surface:#0F141E;
  --v10-surface2:#141B27;
  --v10-card:rgba(20,27,39,.88);
  --v10-line:rgba(255,255,255,.075);
  --v10-text:#F7F8FA;
  --v10-muted:#919AA8;
  --v10-coral:#FF755F;
  --v10-pink:#F45F98;
  --v10-mango:#F4B33F;
  --v10-blue:#5982FF;
  --v10-purple:#A066FF;
}

html,body{
  background:var(--v10-bg)!important;
  color:var(--v10-text)!important;
}
body{
  background:
    radial-gradient(circle at 90% 0%,rgba(244,95,152,.12),transparent 27%),
    radial-gradient(circle at 0% 45%,rgba(89,130,255,.07),transparent 24%),
    var(--v10-bg)!important;

#app{background:transparent!important}
main{background:transparent!important}
p,.small{color:var(--v10-muted)!important}
h1,h2,h3,strong,b{color:var(--v10-text)}
.eyebrow,.screen-kicker{color:#7F8998!important}

.v6-header{
  background:rgba(7,10,16,.78)!important;
  border:0!important;
  backdrop-filter:blur(24px) saturate(145%);

}
.yvia-header-brand span,.welcome-wordmark{color:#fff!important}
.header-avatar{background:#171D28!important;color:white!important}
.icon-button{color:white!important}

body.no-scroll-app{
  height:100dvh;
  overflow:hidden;
}

  height:100dvh;
  overflow:hidden;
}
body.no-scroll-app main{

  overflow:hidden;
}

  background:rgba(14,19,28,.90)!important;
  border:1px solid var(--v10-line)!important;
  box-shadow:0 18px 48px rgba(0,0,0,.35)!important;

.v6-nav button.active{

.global-chat-fab{

  right:max(20px,calc((100vw - 460px)/2 + 20px));
  bottom:88px;
  z-index:65;
  height:48px;
  padding:0 15px 0 12px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  display:flex;
  gap:8px;
  align-items:center;
  background:linear-gradient(135deg,rgba(255,117,95,.96),rgba(244,95,152,.96));
  color:white;
  box-shadow:0 14px 34px rgba(244,95,152,.28);
  font-size:12px;
  font-weight:800

.global-chat-fab span{font-size:16px}
.global-chat-fab.hidden{display:none}

.global-chat-sheet{
  position:fixed;
  inset:0;

function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function loadState(){
  try{
    const parsed = JSON.parse(localStorage.getItem("yvia_state_v8") || "null");
    const merged = parsed ? {...clone(initialState), ...parsed} : clone(initialState);
    merged.version = APP_VERSION;
    merged.problems = Array.isArray(merged.problems)?merged.problems:[];
    merged.wishes = Array.isArray(merged.wishes)?merged.wishes:[];
    merged.skills = Array.isArray(merged.skills)?merged.skills:[];
    merged.interested = Array.isArray(merged.interested)?merged.interested:[];
    merged.skipped = Array.isArray(merged.skipped)?merged.skipped:[];
    merged.checkins = Array.isArray(merged.checkins)?merged.checkins:[];
    merged.profilePhoto = merged.profilePhoto || "";
    merged.wellbeing = Array.isArray(merged.wellbeing)?merged.wellbeing:[];
    merged.friendHistory = Array.isArray(merged.friendHistory)?merged.friendHistory:[];
    merged.friendFlow = merged.friendFlow || null;
    merged.dailyDraft = merged.dailyDraft || {};
    merged.quickCheckOpen = !!merged.quickCheckOpen;
    merged.profileTab = merged.profileTab || "about";
    merged.globalChatOpen = false;
    merged.globalChatHistory = Array.isArray(merged.globalChatHistory)?merged.globalChatHistory:[];
    if(["coach","chances"].includes(merged.route)) merged.route="home";
    merged.chat = Array.isArray(merged.chat)&&merged.chat.length?merged.chat:clone(initialState.chat);
    merged.rejectionFeedback = merged.rejectionFeedback || {};
    return merged;
  }catch(e){ return clone(initialState); }
}
function saveState(){ localStorage.setItem("yvia_state_v8", JSON.stringify(state)); }
function resetState(){
  if(confirm("YVIA wirklich zurücksetzen? Deine lokal gespeicherten Angaben werden gelöscht.")){
    stopRecording(true);
    localStorage.removeItem("yvia_state_v8");
    state=clone(initialState);
    route("welcome");
  }
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1900);
}
function route(name){
  state.route=name; saveState(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function setOnboarding(step){
  state.route="onboarding"; state.onboardingStep=step; saveState(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function toggleIn(arr,val){
  const i=arr.indexOf(val); i>=0?arr.splice(i,1):arr.push(val); saveState(); render();
}
function escapeHTML(s=""){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function avg(arr){return arr.length?arr.reduce((s,x)=>s+x.value,0)/arr.length:0}
function money(v){return Number(v).toLocaleString("de-DE")+" €"}

function headerControls(){
  const nav=$("#bottomNav"), back=$("#backBtn"), profileBtn=$("#profileHeaderBtn"), chatFab=$("#globalChatFab");
  const coreRoutes=["home","analysis","matches"];
  const mainApp=state.profileReady && !["welcome","onboarding"].includes(state.route);

  document.body.classList.toggle("no-scroll-app",mainApp);

  nav.classList.toggle("hidden",!coreRoutes.includes(state.route));
  back.classList.toggle("hidden",state.route==="welcome"||state.route==="onboarding"||coreRoutes.includes(state.route));

  back.onclick=()=>{
    if(state.route==="onboarding"){
      state.onboardingStep<=1?route("welcome"):setOnboarding(state.onboardingStep-1);
    } else if(state.route==="matchDetail") route("matches");
    else route("home");
  };

  if(profileBtn){
    const hideProfile=state.route==="welcome"||state.route==="onboarding";
    profileBtn.classList.toggle("hidden",hideProfile);
    profileBtn.innerHTML=state.profilePhoto?`<img src="${state.profilePhoto}" alt="">`:"👤";
    profileBtn.onclick=()=>route("profile");
  }

  if(chatFab){
    chatFab.classList.toggle("hidden",!mainApp);
    chatFab.onclick=()=>openGlobalChat();
  }

  $$("#bottomNav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===state.route);
    b.onclick=()=>route(b.dataset.tab);
  });
}

function chatContextText(){
  if(state.route==="matches"){

    return top?`Du schaust gerade Matches an. Dein stärkstes Demo-Match: ${top.title} (${top.score} %).`:"Du schaust gerade deine Matches an.";
  }
  if(state.route==="analysis"){

    return latest?`Dein letzter Check: Zufriedenheit ${latest.satisfaction}/5, Stress ${latest.stress}/5, Energie ${latest.energy}/5.`:"Du bist gerade bei „Mein Job“. Noch kein aktueller Check gespeichert.";
  }
  if(state.route==="profile")return "Du bist gerade in deinem Profil. Wir können Stärken, Wünsche oder Rahmenbedingungen besprechen.";
  return "Du bist bei Stimmung. Sag mir einfach, was bei der Arbeit gerade los ist.";

function globalChatReply(msg){
  const m=msg.toLowerCase();
  const latest=wellbeingLatest();
  const repeats=(state.friendHistory||[]);

  if(/chef|leitung|vorgesetz|kontroll|mikromanag/.test(m)){
    const a=adviceFor("boss",/kontroll|mikro/.test(m)?"control":/lob|anerkenn|wertschätz/.test(m)?"recognition":/unfair|respekt/.test(m)?"unfair":"unclear");
    return `${a.opening} ${a.action} ${a.script}`;
  }
  if(/überforder|ueberforder|zu viel|stress|schaff/.test(m)){
    const a=adviceFor("overload",/priori|alles wichtig/.test(m)?"priority":/unterbrech/.test(m)?"interruptions":"toomuch");
    return `${a.opening} ${a.action} ${a.script}`;
  }
  if(/künd|kuend|wechsel|weg hier|raus/.test(m)){
    const longTerm=repeats.filter(x=>x.topic==="leave").length>=2 || (latest && latest.satisfaction<=2);
    const a=adviceFor("leave",longTerm?"weeks":"today");
    return `${a.opening} ${a.reality} ${a.action}`;
  }
  if(/gehalt|geld|verdien|lohn/.test(m)){
    const a=adviceFor("money",/mehr.*aufgab|verantwort/.test(m)?"morework":"unsure");
    return `${a.opening} ${a.action} ${a.script}`;
  }
  if(/kolleg|team|streit|konflikt/.test(m)){
    const a=adviceFor("team",/arbeit.*mir|alles.*ich|hängen/.test(m)?"dumping":/respekt/.test(m)?"respect":"conflict");
    return `${a.opening} ${a.action} ${a.script}`;
  }
  if(/keine motivation|kein bock|keine lust|lustlos/.test(m)){
    const a=adviceFor("motivation",/wochen|monaten|lange/.test(m)?"weeks":"days");
    return `${a.opening} ${a.reality} ${a.action}`;
  }
  if(/match|job|stelle|beruf/.test(m))return localCoachReply(msg);

  return "Okay. Erzähl mir den konkreten Moment, der dich gerade beschäftigt. Nicht die ganze Geschichte – nur: Was ist passiert, wer war beteiligt und was hat dich daran am meisten genervt? Dann sage ich dir nicht irgendeinen Standardsatz, sondern was ich an deiner Stelle als Nächstes tun würde.";
}

function renderGlobalChat(){
  const sheet=$("#globalChatSheet");
  if(!sheet)return;

  sheet.classList.toggle("hidden",!state.globalChatOpen);
  sheet.setAttribute("aria-hidden",state.globalChatOpen?"false":"true");
  if(!state.globalChatOpen)return;

  $("#globalChatContext").textContent=chatContextText();

  const history=(state.globalChatHistory||[]).slice(-8);
  $("#globalChatMessages").innerHTML=history.length
    ? history.map(x=>`<div class="gmsg ${x.role}">${escapeHTML(x.text)}</div>`).join("")
    : `<div class="gmsg assistant">Was ist los? Sag's genauso, wie du es einem guten Freund erzählen würdest.</div>`;

  const quick=state.route==="matches"
    ? ["Warum passt das zu mir?","Ist der Wechsel sinnvoll?","Was übersehe ich?"]
    : state.route==="analysis"
      ? ["Was bedeutet mein Stress?","Was soll ich morgen anders machen?","Ist das nur eine Phase?"]
      : ["Mein Chef nervt","Ich bin überfordert","Ich will eigentlich weg"];

  $("#globalChatQuick").innerHTML=quick.map(q=>`<button data-global-quick="${escapeHTML(q)}">${escapeHTML(q)}</button>`).join("");

  $("#closeGlobalChat").onclick=closeGlobalChat;
  $("#globalChatBackdrop").onclick=closeGlobalChat;
  $("#globalChatSend").onclick=sendGlobalChat;
  $("#globalChatInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendGlobalChat()}};
  $$("[data-global-quick]").forEach(b=>b.onclick=()=>{
    $("#globalChatInput").value=b.dataset.globalQuick;
    sendGlobalChat();
  });

  requestAnimationFrame(()=>{
    const box=$("#globalChatMessages");
    if(box)box.scrollTop=box.scrollHeight;
    $("#globalChatInput")?.focus();
  });
}

function openGlobalChat(prefill=""){
  state.globalChatOpen=true;
  saveState();
  renderGlobalChat();
  if(prefill){
    setTimeout(()=>{const i=$("#globalChatInput");if(i){i.value=prefill;i.focus()}},50);
  }
}
function closeGlobalChat(){
  state.globalChatOpen=false;
  saveState();
  renderGlobalChat();
}
function sendGlobalChat(){
  const input=$("#globalChatInput");
  const msg=input?.value.trim();
  if(!msg)return;
  state.globalChatHistory=state.globalChatHistory||[];
  state.globalChatHistory.push({role:"user",text:msg});
  const reply=globalChatReply(msg);
  state.globalChatHistory.push({role:"assistant",text:reply});
  state.globalChatHistory=state.globalChatHistory.slice(-16);
  input.value="";
  saveState();
  renderGlobalChat();
}

function inferSkills(){
  const t=(state.experience+" "+state.recognizedText).toLowerCase();
  const skills=[];
  const add=(text,short,tags=[])=>{if(!skills.some(s=>s.short===short))skills.push({text,short,tags,active:true})};
  if(/lager|kommission|waren|versand|logistik/.test(t))add("Du kennst Abläufe aus der Praxis – nicht nur aus der Theorie.","Praxisabläufe",["lager","waren","versand"]);
  if(/stapler|gabelstapler/.test(t))add("Du gehst routiniert mit Verantwortung und Arbeitsmitteln um.","Verantwortung",["stapler","lager"]);
  if(/kasse|verkauf|kunden|service|einzelhandel/.test(t))add("Du kannst mit Menschen umgehen – auch wenn es mal stressig wird.","Menschenumgang",["kunden","service"]);
  if(/organis|plan|koord|überblick|ueberblick/.test(t))add("Du behältst den Überblick, wenn mehrere Dinge gleichzeitig laufen.","Überblick",["organisation"]);
  if(/team|kolleg/.test(t))add("Du weißt, wann du selbst anpacken und wann du dich mit anderen abstimmen musst.","Teamarbeit",["team"]);
  if(/chef|leitung|verantwort|einarbeit/.test(t))add("Andere verlassen sich auf dich, wenn Verantwortung übernommen werden muss.","Verlässlichkeit",["team","organisation"]);
  if(/telefon|mail|büro|buero|verwaltung/.test(t))add("Du kannst Informationen sortieren und verständlich weitergeben.","Kommunikation",["telefon","organisation"]);
  if(/maschine|produktion|montage|fertigung/.test(t))add("Du arbeitest praktisch, konzentriert und nah am echten Ergebnis.","Praktisch arbeiten",["produktion"]);
  if(/\d+\s*(jahr|jahre)/.test(t))add("Du bringst echte Erfahrung mit – nicht nur Theorie.","Erfahrung",[]);
  if(state.wishes.includes("entwicklung"))add("Du willst nicht nur wechseln – du willst dich weiterentwickeln.","Entwicklungswille",["organisation"]);
  if(state.problems.includes("stress"))add("Du weißt inzwischen ziemlich genau, welche Arbeitsweise langfristig besser zu dir passt.","Klarheit über Bedingungen",[]);
  [
    ["Andere können sich darauf verlassen, dass du Dinge zu Ende bringst.","Verlässlichkeit",["team"]],
    ["Du kennst deinen Arbeitsalltag aus der Praxis und weißt, worauf es ankommt.","Praxiserfahrung",["lager"]],
    ["Du kannst klar benennen, was dein nächster Job besser machen soll.","Klarheit",[]]
  ].forEach(f=>{if(skills.length<5)add(...f)});
  state.skills=skills.slice(0,8);saveState();
}
function activeSkills(){return state.skills.filter(s=>s.active!==false)}
function deriveFields(){
  const tags=new Set(activeSkills().flatMap(s=>s.tags||[])), f=[];
  if(tags.has("lager")||tags.has("waren"))f.push("Lager & Logistik","Warenannahme");
  if(tags.has("produktion"))f.push("Produktionslogistik");
  if(tags.has("organisation"))f.push("Koordination");
  if(tags.has("telefon")||tags.has("kunden"))f.push("Service / Disposition");
  if(state.wishes.includes("neu"))f.push("Quereinstieg");
  if(!f.length)f.push("Quereinstieg","Logistik","Service");
  state.fields=[...new Set(f)].slice(0,5);saveState();
}
function skillTags(){return new Set(activeSkills().flatMap(s=>s.tags||[]))}
function profileCompleteness(){
  let p=20;
  if(state.mood)p+=8;
  if(state.problems.length)p+=10;
  if(state.wishes.length)p+=15;
  if(state.experience.trim().length>15)p+=18;
  if(activeSkills().length>=3)p+=14;
  if(state.salary)p+=8;
  if(state.distance)p+=7;
  return Math.min(100,p);
}

/* Matching V0.2: transparent weighted fit, not a claim of objective suitability. */
function scoreJob(job){
  const reasons=[],warns=[],breakdown={};
  let total=0;
  // Salary: 22
  const mid=(job.salaryMin+job.salaryMax)/2;
  let sal=job.salaryMax>=state.salary?22:mid>=state.salary*.9?14:6;
  total+=sal; breakdown.Gehalt=Math.round(sal/22*100);
  sal===22?reasons.push("Gehalt erreicht deinen Wunsch"):warns.push("Gehalt liegt unter deinem Wunsch");

  // Distance: 18
  let dist=0;
  if(job.distance<=state.distance)dist=18;
  else dist=Math.max(0,18-(job.distance-state.distance)*1.2);
  total+=dist;breakdown.Entfernung=Math.round(dist/18*100);
  dist>=16?reasons.push("Arbeitsweg liegt in deiner Grenze"):warns.push("Arbeitsweg ist weiter als gewünscht");

  // Nights: 16
  let night=12;
  if(state.night==="Nein")night=job.night?0:16;
  else if(state.night==="Ja")night=job.night?16:10;
  total+=night;breakdown.Schichten=Math.round(night/16*100);
  if(state.night==="Nein"&&!job.night)reasons.push("Keine Nachtschicht");
  if(state.night==="Nein"&&job.night)warns.push("Nachtschicht gehört dazu");

  // Weekend: 8
  let week=6;
  if(state.weekends==="Möglichst frei")week=job.weekend?2:8;
  if(state.weekends==="Gelegentlich okay")week=job.weekend?6:8;
  total+=week;breakdown.Wochenende=Math.round(week/8*100);
  if(state.weekends==="Möglichst frei"&&!job.weekend)reasons.push("Wochenenden sind frei");
  if(state.weekends==="Möglichst frei"&&job.weekend)warns.push("Gelegentliche Wochenendarbeit");

  // Work wishes: 14
  let wishes=7;
  if(state.wishes.includes("entwicklung")&&job.growth)wishes+=3;
  if(state.wishes.includes("stress")&&job.stress==="niedrig")wishes+=3;
  if(state.wishes.includes("zeiten")&&!job.night)wishes+=1;
  wishes=Math.min(14,wishes);
  total+=wishes;breakdown.Wünsche=Math.round(wishes/14*100);
  if(state.wishes.includes("entwicklung")&&job.growth)reasons.push("Entwicklungsmöglichkeiten vorhanden");
  if(state.wishes.includes("stress")&&job.stress==="niedrig")reasons.push("Ruhigeres Arbeitsumfeld");

  // Transferable skills: 22
  const tags=skillTags(), overlap=job.tags.filter(t=>tags.has(t)).length;
  let skills=8;
  if(overlap===1)skills=14;
  if(overlap===2)skills=18;
  if(overlap>=3)skills=22;
  if(state.wishes.includes("neu")&&overlap===0)skills=11;
  total+=skills;breakdown.Erfahrung=Math.round(skills/22*100);
  overlap?reasons.push("Deine bisherigen Erfahrungen lassen sich gut übertragen"):reasons.push("Quereinstieg ist grundsätzlich denkbar");

  // learn from explicit rejection reasons
  const feedback=Object.values(state.rejectionFeedback||{});
  if(feedback.includes("zu_weit")&&job.distance>state.distance)total-=4;
  if(feedback.includes("schicht")&&job.night)total-=5;
  if(feedback.includes("gehalt")&&job.salaryMax<state.salary)total-=4;

  const score=Math.max(32,Math.min(98,Math.round(total)));
  return {score,breakdown,reasons:[...new Set(reasons)].slice(0,4),warns:[...new Set(warns)].slice(0,2)};
}

function setupSwipe(card,id){
  if(!card)return;
  let pointerId=null,startX=0,startY=0,lastX=0,lastT=0;
  let currentX=0,currentY=0,velocityX=0,dragging=false,raf=0;

  const nope=$("#nopeStamp"),like=$("#likeStamp");
  const deck=card.closest(".deck-wrap");
  const shadow=deck?.querySelector(".deck-shadow");

  const paint=()=>{
    raf=0;
    const rot=Math.max(-7,Math.min(7,currentX/30));
    const progress=Math.min(1,Math.abs(currentX)/150);
    card.style.transform=`translate3d(${currentX}px,${currentY*.12}px,0) rotate(${rot}deg)`;
    card.style.boxShadow=`0 ${22+progress*10}px ${54+progress*16}px rgba(32,25,20,${0.07+progress*.025})`;

    const opacity=Math.min(1,Math.abs(currentX)/110);
    if(currentX<0){
      if(nope)nope.style.opacity=opacity;
      if(like)like.style.opacity=0;
    }else{
      if(like)like.style.opacity=opacity;
      if(nope)nope.style.opacity=0;
    }

    if(shadow){
      const scale=.965+Math.min(.028,Math.abs(currentX)/6500);
      const y=18-Math.min(8,Math.abs(currentX)/24);
      shadow.style.transform=`translate3d(0,${y}px,0) scale(${scale})`;
      shadow.style.opacity=String(.7+Math.min(.18,Math.abs(currentX)/650));
    }
  };

  const schedule=()=>{if(!raf)raf=requestAnimationFrame(paint)};

  const down=e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    pointerId=e.pointerId;
    card.setPointerCapture?.(pointerId);
    dragging=true;
    startX=e.clientX;startY=e.clientY;
    lastX=e.clientX;lastT=performance.now();
    currentX=0;currentY=0;velocityX=0;
    card.classList.add("dragging");
    card.style.transition="none";
  };

  const move=e=>{
    if(!dragging||e.pointerId!==pointerId)return;
    const now=performance.now();
    currentX=e.clientX-startX;
    currentY=e.clientY-startY;
    const dt=Math.max(8,now-lastT);
    velocityX=(e.clientX-lastX)/dt;
    lastX=e.clientX;lastT=now;
    schedule();
  };

  const reset=()=>{
    card.style.transition="transform .46s cubic-bezier(.2,.85,.2,1), opacity .28s ease, box-shadow .35s ease";
    card.style.transform="translate3d(0,0,0) rotate(0deg)";
    card.style.boxShadow="";
    if(nope)nope.style.opacity=0;
    if(like)like.style.opacity=0;
    if(shadow){
      shadow.style.transition="transform .46s cubic-bezier(.2,.85,.2,1), opacity .35s ease";
      shadow.style.transform="";
      shadow.style.opacity="";
    }
  };

  const fly=direction=>{
    const width=Math.max(window.innerWidth,430);
    const duration=.30;
    card.style.transition=`transform ${duration}s cubic-bezier(.18,.78,.23,1),opacity ${duration*.8}s ease`;
    card.style.transform=`translate3d(${direction*width*1.3}px,${currentY*.18}px,0) rotate(${direction*10}deg)`;
    card.style.opacity="0";
    if(shadow){
      shadow.style.transition=`transform ${duration}s cubic-bezier(.18,.78,.23,1),opacity ${duration}s ease`;
      shadow.style.transform="translate3d(0,0,0) scale(1)";
      shadow.style.opacity="1";
    }
    setTimeout(()=>direction>0?acceptJob(id):showFeedbackSheet(id),duration*1000-15);
  };

  const up=e=>{
    if(!dragging||(e.pointerId!==undefined&&e.pointerId!==pointerId))return;
    dragging=false;
    card.classList.remove("dragging");
    try{card.releasePointerCapture?.(pointerId)}catch(_){}
    pointerId=null;

    const distance=Math.abs(currentX);
    const fast=Math.abs(velocityX)>.55&&distance>35;
    if(distance>105||fast) fly(currentX>=0?1:-1);
    else reset();
  };

  card.addEventListener("pointerdown",down);
  card.addEventListener("pointermove",move);
  card.addEventListener("pointerup",up);
  card.addEventListener("pointercancel",up);
}

function wellbeingLatest(){
  return state.wellbeing?.length?state.wellbeing[state.wellbeing.length-1]:null;
}
function wellbeingScore(x){
  if(!x)return null;
  const positives=[x.satisfaction,x.energy,x.team,x.leadership,x.development,x.appreciation,x.worklife]
    .filter(v=>v!==undefined&&v!==null&&v!=="").map(Number).filter(Number.isFinite);
  const all=[...positives];
  if(x.stress!==undefined&&x.stress!==null&&x.stress!==""){
    const s=Number(x.stress);if(Number.isFinite(s))all.push(6-s);
  }
  if(!all.length)return null;
  return Math.round((all.reduce((a,b)=>a+b,0)/all.length)/5*100);
}
function wellbeingSeries(){
  const rich=(state.wellbeing||[]).map(x=>({date:x.date,score:x.score??wellbeingScore(x)})).filter(x=>Number.isFinite(x.score));
  if(rich.length)return rich.slice(-8);
  return (state.checkins||[]).slice(-8).map(x=>({date:x.date,score:Math.round((Number(x.value)||3)/5*100)}));
}
function levelWord(v,invert=false){
  if(v==null)return "Noch offen";
  const n=Number(v);
  if(invert)return n<=2?"niedrig":n===3?"mittel":"hoch";
  return n<=2?"niedrig":n===3?"mittel":"hoch";
}
function trendChartSVG(){
  const data=wellbeingSeries();
  if(data.length<2)return `<div class="chart-empty"><div><strong>Noch kein Verlauf</strong><br>Nach zwei Check-ins entsteht hier deine persönliche Kurve.</div></div>`;
  const w=330,h=145,pad=18;
  const xs=data.map((_,i)=>pad+(w-pad*2)*(i/(data.length-1)));
  const ys=data.map(d=>h-pad-(h-pad*2)*(d.score/100));
  const pts=xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const area=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;
  const circles=xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4.2" fill="#FF7D5C" stroke="#fff" stroke-width="2.5"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="trend-svg" role="img" aria-label="Verlauf Work Score">
    <defs><linearGradient id="lineG" x1="0" x2="1"><stop stop-color="#F2A900"/><stop offset="1" stop-color="#FF7D5C"/></linearGradient>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFB23A" stop-opacity=".22"/><stop offset="1" stop-color="#FF7D5C" stop-opacity=".02"/></linearGradient></defs>
    <line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="#EFE6DF"/>
    <line x1="${pad}" x2="${w-pad}" y1="${pad}" y2="${pad}" stroke="#F5EEE9"/>
    <polygon points="${area}" fill="url(#areaG)"/>
    <polyline points="${pts}" fill="none" stroke="url(#lineG)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}
  </svg>`;
}
function metricCard(title,icon,value,invert=false){
  const v=value==null?null:Number(value);
  const pct=v==null?0:(invert?(6-v):v)/5*100;
  return `<div class="metric-card">
    <div class="metric-card-head"><b>${title}</b><span>${icon}</span></div>
    <div class="metric-value">${v==null?"–":`${v}/5`}</div>
    <div class="metric-bar"><i style="width:${pct}%"></i></div>
  </div>`;
}
function resizeProfileImage(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=reject;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const max=480, scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg",.78));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function friendTextReply(msg){

  if(/motivation|kein bock|keine lust|lustlos/.test(m))return adviceFor("motivation",/wochen|lange|monaten/.test(m)?"weeks":"days");
  if(/gehalt|geld|verdien|lohn/.test(m))return adviceFor("money",/mehr aufgaben|verantwort/.test(m)?"morework":"unsure");
  if(/kolleg|team|streit|konflikt/.test(m))return adviceFor("team",/arbeit.*mir|alles.*ich/.test(m)?"dumping":"conflict");

function pulseInsight(){
  const data=(state.wellbeing||[]).slice(-6);
  if(!data.length)return {title:"Noch kein Muster.",text:"Drei kurze Taps reichen für deinen ersten Arbeitstag. Danach beginnt YVIA, schlechte Tage von echten Mustern zu unterscheiden."};
  const avgOf=k=>{const vals=data.map(x=>Number(x[k])).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};
  const sat=avgOf("satisfaction"),stress=avgOf("stress"),energy=avgOf("energy"),reasons={};
  data.forEach(x=>{if(x.reason)reasons[x.reason]=(reasons[x.reason]||0)+1});
  const topReason=Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0];
  const names={boss:"Führung",team:"Team",amount:"Arbeitsmenge",tasks:"Aufgaben",time:"Arbeitszeit",money:"Geld"};
  if(stress>=4&&sat>=3.5)return {title:"Du magst die Arbeit – aber sie kostet gerade viel.",text:"Das sieht eher nach Belastung als nach dem falschen Beruf aus. "+(topReason?`${names[topReason[0]]} taucht dabei am häufigsten auf.`:"")};
  if(stress>=4&&sat<3)return {title:"Das ist gerade mehr als nur ein anstrengender Tag.",text:"Hoher Stress und niedrige Zufriedenheit kommen bei dir zusammen. "+(topReason?`${names[topReason[0]]} ist aktuell dein häufigster Auslöser.`:"YVIA schaut jetzt besonders darauf, ob sich das wiederholt.")};
  if(sat<=2.5&&stress<3.5)return {title:"Du wirkst nicht vor allem überlastet – eher unzufrieden.",text:"Das ist ein wichtiger Unterschied. Hier lohnt sich eher die Frage nach Aufgaben, Entwicklung und Passung als nur nach weniger Stress."};
  if(energy!==null&&energy<=2.5)return {title:"Deine Energie fällt stärker auf als dein Stress.",text:"Wenn du nach Arbeit regelmäßig leer bist, sollte YVIA darauf schauen, was dir im Alltag Energie zieht."};
  if(sat>=4&&stress<=3)return {title:"Im Moment passt vieles ziemlich gut.",text:"YVIA muss dir keinen Wechsel einreden. Genau solche Phasen gehören genauso in dein Bild wie schlechte Wochen."};
  return {title:"Da ist kein einzelnes großes Problem – eher ein Mix.",text:topReason?`${names[topReason[0]]} fällt in deinen letzten Check-ins am häufigsten auf. YVIA beobachtet, ob daraus ein Muster wird.`:"Noch ein paar kurze Check-ins machen das Bild klarer."};
}

      <button class="profile-photo-v10" id="profilePhotoBtn">${state.profilePhoto?`<img src="${state.profilePhoto}" alt="">`:"👤"}</button>
      <div class="profile-name-v10">
        <small>DEIN YVIA PROFIL</small>
        <h1>${escapeHTML(profileDisplayName())}</h1>
        <p>${pc}% Profil · ${ws!=null?`Work Score ${ws}`:"Work Score offen"}</p>
      </div>
      <button class="profile-edit-name-v10" id="editNameV10">···</button>
      <input id="profilePhotoInput" type="file" accept="image/*">
    </div>

    <div class="profile-tabs-v10">
      <button class="${state.profileTab==="about"?"active":""}" data-profile-tab="about">Über mich</button>
      <button class="${state.profileTab==="values"?"active":""}" data-profile-tab="values">Was zählt</button>
      <button class="${state.profileTab==="frame"?"active":""}" data-profile-tab="frame">Rahmen</button>
    </div>

    ${panel}

    <div class="profile-footer-v10">
      <button id="profileAnalysisBtn">Mein Job ansehen</button>
      <button id="profileResetBtn">Testdaten zurücksetzen</button>
    </div>

    <div class="name-sheet-v10 hidden" id="nameSheetV10">
      <div>
        <small>WIE SOLL YVIA DICH NENNEN?</small>
        <input id="profileNameInput" maxlength="24" value="${escapeHTML(state.profileName)}" placeholder="Dein Name">
        <button id="saveProfileName">Speichern</button>
      </div>
    </div>
  </section>`;

  $$("[data-profile-tab]").forEach(b=>b.onclick=()=>{state.profileTab=b.dataset.profileTab;saveState();render()});
  $("#profilePhotoBtn").onclick=()=>$("#profilePhotoInput").click();
  $("#profilePhotoInput").onchange=async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{state.profilePhoto=await resizeProfileImage(file);saveState();toast("Profilbild gespeichert");render()}
    catch(err){toast("Profilbild konnte nicht geladen werden")}
  };

  $("#editNameV10").onclick=()=>$("#nameSheetV10").classList.remove("hidden");
  $("#saveProfileName").onclick=()=>{
    state.profileName=$("#profileNameInput").value.trim();
    saveState();toast("Name gespeichert");render();
  };

  $$("[data-profile-edit]").forEach(b=>b.onclick=()=>{
    const what=b.dataset.profileEdit;
    if(what==="skills")setOnboarding(5);
    else if(what==="values")setOnboarding(3);
    else setOnboarding(6);
  });

  $("#profileAnalysisBtn").onclick=()=>route("analysis");
  $("#profileResetBtn").onclick=resetState;
}

function bestMimeType(){
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  return types.find(t=>MediaRecorder.isTypeSupported?.(t))||"";
}
async function toggleRecording(){
  if(mediaRecorder?.state==="recording"){stopRecording(false);return}
  try{
    if(!window.isSecureContext)toast("Öffne YVIA über deine HTTPS-Adresse.");
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];recSeconds=0;
    const mime=bestMimeType();
    mediaRecorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);
    mediaRecorder.ondataavailable=e=>{if(e.data?.size)audioChunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      clearInterval(recTimer);
      const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||mime||"audio/mp4"});
      if(lastAudioURL)URL.revokeObjectURL(lastAudioURL);
      lastAudioURL=URL.createObjectURL(blob);
      state.recorded=true;saveState();
      $("#audioWrap")&&( $("#audioWrap").innerHTML=`<audio controls src="${lastAudioURL}"></audio>` );
      $("#micBtn")?.classList.remove("recording");
      if($("#micBtn"))$("#micBtn").textContent="🎙️";
      if($("#micTitle"))$("#micTitle").textContent="Aufnahme gespeichert";
      if($("#micText"))$("#micText").textContent="Du kannst sie anhören oder neu aufnehmen.";
      if($("#recordTimer"))$("#recordTimer").textContent="";
      mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;
      try{recognition?.stop()}catch(e){}
    };
    mediaRecorder.start(250);
    $("#micBtn")?.classList.add("recording");if($("#micBtn"))$("#micBtn").textContent="■";
    if($("#micTitle"))$("#micTitle").textContent="Ich höre zu …";
    if($("#micText"))$("#micText").textContent="Tippe erneut, wenn du fertig bist.";
    recTimer=setInterval(()=>{recSeconds++;if($("#recordTimer"))$("#recordTimer").textContent=`${String(Math.floor(recSeconds/60)).padStart(2,"0")}:${String(recSeconds%60).padStart(2,"0")}`},1000);
    startSpeechRecognition();
  }catch(e){
    if($("#micTitle"))$("#micTitle").textContent="Mikrofon nicht freigegeben";
    if($("#micText"))$("#micText").textContent="Erlaube Safari den Mikrofonzugriff oder nutze das Textfeld.";
  }
}
function stopRecording(silent=false){
  clearInterval(recTimer);
  if(mediaRecorder?.state==="recording")try{mediaRecorder.stop()}catch(e){}
  mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;
  try{recognition?.stop()}catch(e){}
  if(silent){mediaRecorder=null;audioChunks=[]}
}
function startSpeechRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  try{
    recognition=new SR();recognition.lang="de-DE";recognition.interimResults=false;recognition.continuous=false;
    recognition.onresult=e=>{
      const tx=[...e.results].map(r=>r[0]?.transcript||"").join(" ").trim();
      if(tx){state.recognizedText=(state.recognizedText+" "+tx).trim();state.experience=(state.experience+" "+tx).trim();saveState();if($("#experience"))$("#experience").value=state.experience}
    };
    recognition.start();
  }catch(e){}
}

window.addEventListener("beforeunload",()=>stopRecording(true));
render();

</script>
</body>
</html>
