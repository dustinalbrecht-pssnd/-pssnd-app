<title>YVIA V1.6.1</title>
<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.topbar{height:70px;padding:calc(10px + env(safe-area-inset-top,0px)) 15px 8px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end}
.brand{display:flex;align-items:center;gap:8px}.mark{width:30px;height:30px;position:relative}.mark:before,.mark:after{content:"";position:absolute;width:18px;height:26px;bottom:1px;border-radius:18px 18px 14px 14px;transform-origin:bottom center}.mark:before{left:2px;transform:rotate(-37deg);background:linear-gradient(#ffb55d,#ff7158)}.mark:after{right:2px;transform:rotate(37deg);background:linear-gradient(#ffd07b,#f35b93)}.brand b{font-size:18px;letter-spacing:.08em}

.gauge-card{display:grid;grid-template-columns:125px 1fr;gap:10px;align-items:center;background:#101722;border:1px solid var(--line);border-radius:19px;padding:10px}.gauge{height:88px}.gauge-copy small{font-size:7px;color:#808a99}.gauge-copy strong{display:block;font-size:24px;margin:2px 0}.gauge-copy p{font-size:8px;line-height:1.35;color:#8c96a5;margin:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric{background:#111722;border:1px solid var(--line);border-radius:15px;padding:9px}.metric span{font-size:14px}.metric strong{display:block;font-size:18px;margin:2px 0}.metric small{font-size:6px;color:#7f8998}.metric i{display:block;height:4px;background:#252c37;border-radius:99px;margin-top:6px;overflow:hidden}.metric i b{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--pink))}.metric:nth-child(2) i b{background:linear-gradient(90deg,var(--blue),var(--purple))}.metric:nth-child(3) i b{background:linear-gradient(90deg,var(--gold),var(--coral))}

/* Matches */
.matches{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}.match-head{display:flex;justify-content:space-between;align-items:start}.head-actions{display:flex;gap:5px}.head-actions button{height:33px;border:1px solid var(--line);border-radius:12px;background:#111722;color:#9aa4b2;padding:0 9px;font-size:7px;font-weight:850}.deck{position:relative;min-height:0;margin-top:8px}.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#111722;border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.35);touch-action:pan-y;will-change:transform}.card.back{transform:translateY(8px) scale(.965);opacity:.72}.jobpic{height:56%;background-size:cover;background-position:center;position:relative}.jobpic:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,9,13,.9),rgba(7,9,13,.12) 60%,transparent)}.score{position:absolute;z-index:2;top:12px;left:12px;padding:7px 9px;border-radius:999px;background:rgba(8,12,17,.72);border:1px solid rgba(255,255,255,.12);font-size:8px;font-weight:850}.jobtitle{position:absolute;z-index:2;left:13px;right:13px;bottom:11px}.jobtitle h2{font-size:21px;line-height:1.02;margin:0 0 3px}.jobtitle p{font-size:8px;color:#d0d5dc;margin:0}.jobbody{height:44%;padding:9px 12px;display:flex;flex-direction:column}.facts{display:flex;gap:5px;flex-wrap:wrap}.facts span{padding:6px 8px;border-radius:999px;background:#171e29;color:#b4bcc7;font-size:6px}.why{display:grid;gap:3px;margin-top:7px;overflow:hidden}.why div{font-size:7px;color:#a4adb9}.why b{color:#ff916f;margin-right:5px}.more{margin-top:auto;height:33px;border:1px solid var(--line);border-radius:12px;background:#161d28;color:white;font-size:8px;font-weight:850}.swipebar{display:grid;grid-template-columns:50px 1fr 50px;gap:8px;align-items:center;margin-top:7px}.swipebar button{height:46px;border-radius:16px}.pass{border:1px solid var(--line);background:#111722;color:white}.like{border:0;background:linear-gradient(135deg,var(--coral),var(--pink));color:white}.swipebar span{text-align:center;font-size:6px;color:#677180}

/* Sheets */

/* ===== YVIA V1.4 ===== */

function analysisSamples(){

   return {satisfaction:q.sat,stress:q.stress,energy:q.energy,ts:x.ts,type:"moment",note:x.note||"",cat:x.cat||q.cat,kind:x.kind};
 });
 return [...a,...b].sort((x,y)=>x.ts-y.ts)
}
function metric(k){
 const a=analysisSamples().slice(-20).map(x=>+x[k]).filter(Number.isFinite);
 return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*20):60
}
function totalScore(){return Math.round((metric("satisfaction")+(100-metric("stress"))+metric("energy"))/3)}
function smoothPath(points){
 if(points.length<2)return "";
 let d=`M ${points[0][0]} ${points[0][1]}`;
 for(let i=0;i<points.length-1;i++){
   const p0=points[i-1]||points[i],p1=points[i],p2=points[i+1],p3=points[i+2]||p2;
   const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
   const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
   d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`
 }
 return d
}
function chartSVG(){

 }

 const iw=w-left-right,ih=h-top-bottom;

 ]);

   const y=top+i*ih/4;
   return `<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="rgba(255,255,255,.055)" stroke-width="1"/>
   <text x="${left-8}" y="${y+3}" text-anchor="end" fill="#6f7988" font-size="8">${v}</text>`
 }).join("");
 const indices=[0,Math.floor((a.length-1)/2),a.length-1].filter((v,i,arr)=>arr.indexOf(v)===i);
 const xLabels=indices.map(i=>{
   const x=left+i*iw/Math.max(1,a.length-1);
   const date=new Date(a[i].ts||Date.now());
   const label=date.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
   return `<text x="${x}" y="${h-9}" text-anchor="${i===0?"start":i===a.length-1?"end":"middle"}" fill="#6f7988" font-size="8">${label}</text>`
 }).join("");

const PATTERN_DEFS=[
 ["Führung",/chef|chefin|führung|leitung|vorgesetz|kontroll|mikro/],
 ["Arbeitsmenge",/stress|zu viel|überforder|arbeitsmenge|priorität|schaff/],
 ["Team",/team|kolleg|streit|konflikt|ausgeschlossen/],
 ["Arbeitszeit",/arbeitszeit|schicht|wochenend|früh|spät|zeit/],
 ["Geld",/geld|gehalt|lohn|bezahlung|verdien/],
 ["Aufgaben",/aufgabe|motivation|langweil|unterforder|sinn/],
 ["Anerkennung",/lob|anerkenn|wertschätz|gesehen/]
];
function classifySample(sample){
 const text=((sample.note||"")+" "+(sample.cat||"")).toLowerCase();
 return PATTERN_DEFS.filter(([,re])=>re.test(text)).map(([name])=>name)
}
function intelligentPatterns(){
 const samples=analysisSamples().map(x=>({...x,cats:classifySample(x)}));
 if(samples.length<2)return [];
 const avg=(arr,k)=>arr.length?arr.reduce((a,b)=>a+(+b[k]||0),0)/arr.length:0;
 const overall={sat:avg(samples,"satisfaction")*20,stress:avg(samples,"stress")*20,energy:avg(samples,"energy")*20};
 const out=[];
 for(const [name] of PATTERN_DEFS){
   const hit=samples.filter(x=>x.cats.includes(name));
   if(hit.length<2)continue;
   const other=samples.filter(x=>!x.cats.includes(name));
   const sat=avg(hit,"satisfaction")*20,stress=avg(hit,"stress")*20,energy=avg(hit,"energy")*20;
   const baseSat=other.length?avg(other,"satisfaction")*20:overall.sat;
   const baseStress=other.length?avg(other,"stress")*20:overall.stress;
   const baseEnergy=other.length?avg(other,"energy")*20:overall.energy;
   out.push({
     name,count:hit.length,
     sat:Math.round(sat),stress:Math.round(stress),energy:Math.round(energy),
     dSat:Math.round(sat-baseSat),dStress:Math.round(stress-baseStress),dEnergy:Math.round(energy-baseEnergy)
   })
 }
 return out.sort((a,b)=>(Math.abs(b.dStress)+Math.abs(b.dSat)+Math.abs(b.dEnergy))-(Math.abs(a.dStress)+Math.abs(a.dSat)+Math.abs(a.dEnergy)))
}
function bestPattern(){

function naturalPatternInsight(){
 const p=bestPattern();
 if(!p)return {
   title:"Noch kein echtes Muster – und das ist okay.",
   text:"YVIA braucht ein paar unterschiedliche Tage oder Situationen, bevor es sinnvoll wäre, dir etwas einzureden.",
   next:"Speichere einfach weiter echte Momente. Keine Extra-Arbeit."
 };
 let facts=[];
 if(p.dStress>=12)facts.push(`dein Stress ${p.dStress} Punkte höher`);
 if(p.dSat<=-12)facts.push(`deine Zufriedenheit ${Math.abs(p.dSat)} Punkte niedriger`);
 if(p.dEnergy<=-12)facts.push(`deine Energie ${Math.abs(p.dEnergy)} Punkte niedriger`);
 const fact=facts.length?facts.join(" und "):`dieses Thema deutlich häufiger in belastenden Einträgen`;
 let title, next;
 if(p.name==="Führung"){
   title="Das sieht eher nach Führung als nach dem falschen Beruf aus.";
   next="Beobachte noch 1–2 konkrete Führungssituationen. Wenn das Muster bleibt, lohnt sich zuerst ein Gespräch oder ein Arbeitgebervergleich – nicht automatisch ein Berufswechsel."
 }else if(p.name==="Arbeitsmenge"){
   title="Die Menge scheint dich stärker zu belasten als die Arbeit selbst.";
   next="Achte darauf, ob dein Stress sinkt, sobald Prioritäten klar sind oder Aufgaben wegfallen. Das wäre ein starkes Signal gegen einen kompletten Berufswechsel."
 }else if(p.name==="Team"){
   title="Dein Umfeld scheint einen großen Anteil an deiner Stimmung zu haben.";
   next="Wenn die Tätigkeit selbst okay ist, könnte ein anderes Team oder ein anderer Arbeitgeber schon viel verändern."
 }else if(p.name==="Arbeitszeit"){
   title="Deine Arbeitsbedingungen wirken auffälliger als der Jobinhalt.";
   next="Vergleiche Matches gezielt nach Arbeitszeit und Schichtmodell, bevor du die Tätigkeit selbst infrage stellst."
 }else if(p.name==="Aufgaben"){
   title="Bestimmte Aufgaben ziehen dir offenbar regelmäßig Energie.";
   next="Versuch herauszufinden, welche Aufgaben du behalten würdest und welche du im nächsten Job vermeiden willst."
 }else{
   title=`${p.name} ist gerade dein deutlichster Einflussfaktor.`;
   next="Das ist noch kein Urteil – aber genau dort würde ich zuerst ansetzen."
 }
 return {
   title,
   text:`Bei ${p.count} Einträgen rund um „${p.name}“ ist ${fact} als an deinen übrigen Tagen.`,
   next
 }
}

   text=`Deine Zufriedenheit liegt bei ${sat} %, gleichzeitig ist dein Stress mit ${stress} % deutlich erhöht. Das spricht eher für Belastung oder Rahmenbedingungen als automatisch für den falschen Beruf.`;

   next="Nutze gute Tage bewusst: Sie zeigen dir, was du in Zukunft unbedingt behalten solltest."
 }else{

 }

 return {title,text,next}
}

const changeQs=[
 {f:"satisfaction",text:"Ich bin mit meiner Arbeit insgesamt zufrieden.",positive:true},
 {f:"satisfaction",text:"Meine Aufgaben fühlen sich sinnvoll und passend an.",positive:true},
 {f:"stress",text:"Ich fühle mich bei der Arbeit häufig angespannt oder überfordert.",positive:false},

];
function calcTestDetails(answers){
 const g={satisfaction:[],stress:[],energy:[],other:[]};
 answers.forEach((v,i)=>{const q=changeQs[i],pct=(v-1)/4*100;g[q.f].push(q.positive?pct:100-pct)});
 const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):50;
 const satisfaction=avg(g.satisfaction),stressWell=avg(g.stress),energy=avg(g.energy),other=avg(g.other),stress=100-stressWell;
 return {satisfaction,stress,energy,other,score:Math.round((satisfaction+stressWell+energy+other)/4)}
}
function testAssessment(d){

 return ["Dein Ergebnis spricht dafür, etwas ernsthaft zu verändern.","Das muss nicht morgen die Kündigung sein. Aber nur durchhalten wäre bei diesem Gesamtbild keine gute Strategie."]
}

function swipe(c,id){
 if(!c)return;
 let pid=null,sx=0,sy=0,cx=0,cy=0,lastX=0,lastT=0,vx=0,drag=false,axis=null,raf=0;
 const back=c.parentElement?.querySelector(".card.back");
 const yes=document.createElement("div"),no=document.createElement("div");
 yes.className="swipe-stamp-v14 like-stamp-v14";yes.textContent="MERKEN";
 no.className="swipe-stamp-v14 pass-stamp-v14";no.textContent="WEITER";
 c.append(yes,no);

 function draw(){
   raf=0;
   const px=Math.min(1,Math.abs(cx)/150);
   const easedX=cx*(.88+.12*px);
   const rot=Math.max(-7.5,Math.min(7.5,easedX/36));
   c.style.transform=`translate3d(${easedX}px,${cy*.055}px,0) rotate(${rot}deg) scale(${1-px*.012})`;
   yes.style.opacity=cx>0?String(px):"0";no.style.opacity=cx<0?String(px):"0";
   if(back){
     const scale=.958+.040*px;
     back.style.transform=`translate3d(0,${10-9*px}px,0) scale(${scale})`;
     back.style.opacity=String(.67+.31*px);
     back.style.filter=`brightness(${.88+.12*px})`
   }
 }
 c.onpointerdown=e=>{
   if(e.target.closest("button"))return;
   if(e.pointerType==="mouse"&&e.button!==0)return;
   pid=e.pointerId;drag=true;axis=null;sx=e.clientX;sy=e.clientY;lastX=e.clientX;lastT=performance.now();cx=cy=vx=0;
   c.setPointerCapture?.(pid);c.style.transition="none";
   if(back){back.style.transition="none";back.style.filter="brightness(.88)"}
 };
 c.onpointermove=e=>{
   if(!drag||e.pointerId!==pid)return;
   const dx=e.clientX-sx,dy=e.clientY-sy;
   if(!axis&&Math.hypot(dx,dy)>8)axis=Math.abs(dx)>=Math.abs(dy)*.75?"x":"y";
   if(axis==="y"){return}
   const now=performance.now();cx=dx;cy=dy;vx=(e.clientX-lastX)/Math.max(8,now-lastT);lastX=e.clientX;lastT=now;
   if(!raf)raf=requestAnimationFrame(draw)
 };
 function resetCard(){
   c.style.transition="transform .58s cubic-bezier(.16,.90,.18,1),opacity .2s";
   c.style.transform="translate3d(0,0,0) rotate(0deg) scale(1)";
   yes.style.opacity=no.style.opacity="0";
   if(back){
     back.style.transition="transform .58s cubic-bezier(.16,.90,.18,1),opacity .35s,filter .35s";
     back.style.transform="translate3d(0,8px,0) scale(.965)";back.style.opacity=".72";back.style.filter="brightness(.88)"
   }
 }
 function finish(){
   if(!drag)return;drag=false;
   try{c.releasePointerCapture?.(pid)}catch(_){}
   if(axis==="y"){resetCard();return}
   const projected=cx+vx*95;
   const go=Math.abs(projected)>105;
   if(!go){resetCard();return}
   const dir=Math.sign(projected)||1;
   const speed=Math.max(.65,Math.abs(vx));
   const duration=Math.max(175,Math.min(285,265-speed*70));
   const target=dir*Math.max(window.innerWidth,470)*1.45;
   c.style.transition=`transform ${duration}ms cubic-bezier(.14,.75,.16,1),opacity ${Math.min(220,duration)}ms ease`;
   c.style.transform=`translate3d(${target}px,${cy*.08}px,0) rotate(${dir*10}deg) scale(.985)`;
   c.style.opacity="0";
   if(back){
     back.style.transition=`transform ${duration+30}ms cubic-bezier(.14,.80,.16,1),opacity ${duration}ms,filter ${duration}ms`;
     back.style.transform="translate3d(0,0,0) scale(1)";back.style.opacity="1";back.style.filter="brightness(1)"
   }
   if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
   setTimeout(()=>{
     if(dir>0){if(!s.liked.includes(id))s.liked.push(id)}
     else{if(!s.passed.includes(id))s.passed.push(id)}
     save();render()
   },duration-8)
 }
 c.onpointerup=finish;c.onpointercancel=finish
}

function friendReply(t){
 const raw=t,tlo=t.toLowerCase(),n=s.name?`${s.name}, `:"";
 const p=bestPattern(),o=overallNarrative();
 const patternTail=p&&p.count>=2?` Bei dir fällt übrigens gerade besonders „${p.name}“ auf.`:"";

 if(/chef|chefin|leitung|führung|kontroll/.test(tlo)){
   if(p?.name==="Führung"&&p.dStress>=10)return `${n}uff 😕 das ist bei dir inzwischen kein Einzelmoment mehr. Bei Führungsthemen liegt dein Stress etwa ${p.dStress} Punkte höher als sonst. Ich würde zuerst genau dort ansetzen – nicht gleich deinen ganzen Beruf infrage stellen.`;
   return `${n}uff 😕 verstehe ich. Sag mir nur kurz: Was hat dein Chef konkret gemacht? Dann gebe ich dir einen Satz, den du morgen wirklich verwenden kannst.`;
 }
 if(/überforder|ueberforder|zu viel|stress/.test(tlo)){
   return `${n}das klingt gerade echt voll. Du musst nicht alles retten. Morgen würde ich nur fragen: „Was hat heute wirklich Priorität – und was darf warten?“${patternTail}`;
 }
 if(/künd|kuend|weg|wechsel/.test(tlo)){
   return `${n}ich würde heute nichts überstürzen. Dein Gesamtbild sagt gerade eher: ${o.title.toLowerCase()} Erst den Auslöser verstehen, dann entscheiden.`;
 }
 if(/geld|gehalt|lohn|verdien/.test(tlo))return `${n}ja, das kann richtig frustrieren 😕. Nimm drei Dinge, die du heute zusätzlich leistest – genau damit würde ich ins Gespräch gehen.`;
 if(/kolleg|team|streit/.test(tlo)){
   if(p?.name==="Team")return `${n}das wirkt bei dir tatsächlich wiederkehrend. An Team-Tagen verändert sich dein Stress/Zufriedenheit deutlich. Ich würde prüfen: Ist die Arbeit okay und nur das Umfeld falsch?`;
   return `${n}boah, sowas hängt nach. War das ein einmaliger Moment oder passiert das öfter?`;
 }
 if(/motivation|kein bock|keine lust/.test(tlo))return `${n}ich würde dich gerade nicht zu mehr Motivation zwingen. Schau morgen nur: Was zieht dir Energie – und was geht überraschend leicht? Mehr brauchst du erstmal nicht.`;
 if(/match|stelle|job/.test(tlo)){const j=filteredJobs()[0]||liked()[0];return j?`${n}ehrlich? ${j.title} sieht gut aus – aber nur, wenn es dein echtes Problem löst. Der ${j.score}%-Score allein beeindruckt mich nicht.`:`${n}lass uns deine gemerkten Jobs anschauen. Ich würde nach Alltag gehen, nicht nur nach Score.`}
 return `${n}ich hör dich ❤️. Erzähl mir nur den einen Moment, der dir gerade am meisten im Kopf hängt – nicht die ganze Geschichte.`;
}

async function makeDocThumb(file){
 if(!file.type.startsWith("image/"))return "";
 try{const url=URL.createObjectURL(file),img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});const c=document.createElement("canvas"),side=Math.min(img.naturalWidth,img.naturalHeight);c.width=c.height=120;c.getContext("2d").drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,120,120);URL.revokeObjectURL(url);return c.toDataURL("image/jpeg",.72)}catch(e){return ""}
}
function bindDocuments(){
 $("#cvBtn")?.addEventListener("click",()=>$("#cvInput").click());$("#docBtn")?.addEventListener("click",()=>$("#docInput").click());
 $("#cvInput")?.addEventListener("change",async e=>addDocs([...e.target.files],"Lebenslauf"));$("#docInput")?.addEventListener("change",async e=>addDocs([...e.target.files],"Dokument"));
 $$("[data-del-doc]").forEach(b=>b.onclick=()=>{s.documents.splice(+b.dataset.delDoc,1);save();render()})
}
async function addDocs(files,kind){for(const f of files)s.documents.push({name:f.name,kind,thumb:await makeDocThumb(f)});s.documents=s.documents.slice(-25);save();toast("Unterlage hinzugefügt");render()}
function savedProfileHTML(){
 return `<div class="profile-page-v14"><div class="profile-page-head-v14"><span>♡</span><div><small>GEMERKTE JOBS</small><h3>Deine Favoriten.</h3><p>Hier landet alles, was du nach rechts gewischt oder gespeichert hast.</p></div></div><div class="savedgrid">${liked().length?liked().map(j=>`<button class="sj" data-openjob="${j.id}"><div class="pic" style="background-image:url('${j.image}')"></div><div class="txt"><b>${esc(j.title)}</b><small>${j.company} · ${j.score}%</small></div></button>`).join(""):`<div class="empty-v14">Noch keine Jobs gemerkt.</div>`}</div></div>`
}

/* FOTO EDITOR */
let photoTemp=null;
function openPhotoEditor(file){
 let url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{
   let crop=230,minScale=Math.max(crop/img.naturalWidth,crop/img.naturalHeight);
   photoTemp={url,img,minScale,zoom:1,x:0,y:0};
   renderPhotoEditor();openModal()
 };
 img.src=url
}
function renderPhotoEditor(){
 let p=photoTemp,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale;
 $("#genericSheet").innerHTML=`<div class="grab"></div><h2>Profilbild anpassen</h2><p>Zoomen und mit dem Finger verschieben.</p><div class="photo-editor"><div class="cropbox" id="cropBox"><img id="cropImg" src="${p.url}" style="width:${w}px;height:${h}px;transform:translate(calc(-50% + ${p.x}px),calc(-50% + ${p.y}px))"></div><div class="zoomrow"><span>kleiner</span><input id="zoom" type="range" min="1" max="3" step=".01" value="${p.zoom}"><span>größer</span></div><div class="sheet-actions"><button class="secondary" id="photoCancel">Abbrechen</button><button class="primary" id="photoSave">Speichern</button></div></div>`;
 let box=$("#cropBox"),drag=false,sx=0,sy=0,ox=0,oy=0;
 box.onpointerdown=e=>{drag=true;box.setPointerCapture?.(e.pointerId);sx=e.clientX;sy=e.clientY;ox=p.x;oy=p.y};
 box.onpointermove=e=>{if(!drag)return;p.x=ox+(e.clientX-sx);p.y=oy+(e.clientY-sy);clampPhoto();renderPhotoPos()};
 box.onpointerup=()=>drag=false;box.onpointercancel=()=>drag=false;
 $("#zoom").oninput=e=>{p.zoom=+e.target.value;clampPhoto();renderPhotoPos()};
 $("#photoCancel").onclick=()=>{URL.revokeObjectURL(p.url);photoTemp=null;closeModal()};
 $("#photoSave").onclick=saveCroppedPhoto
}
function clampPhoto(){
 let p=photoTemp,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale,c=230;
 let maxX=Math.max(0,(w-c)/2),maxY=Math.max(0,(h-c)/2);p.x=Math.max(-maxX,Math.min(maxX,p.x));p.y=Math.max(-maxY,Math.min(maxY,p.y))
}
function renderPhotoPos(){let p=photoTemp,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale,im=$("#cropImg");im.style.width=w+"px";im.style.height=h+"px";im.style.transform=`translate(calc(-50% + ${p.x}px),calc(-50% + ${p.y}px))`}
function saveCroppedPhoto(){
 let p=photoTemp,crop=230,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale;
 let left=(w-crop)/2-p.x,top=(h-crop)/2-p.y;
 let sx=left/scale,sy=top/scale,sw=crop/scale,sh=crop/scale;
 let c=document.createElement("canvas");c.width=c.height=480;c.getContext("2d").drawImage(p.img,sx,sy,sw,sh,0,0,480,480);
 s.photo=c.toDataURL("image/jpeg",.86);save();URL.revokeObjectURL(p.url);photoTemp=null;closeModal();toast("Profilbild gespeichert");render()
}

/* MODAL */
function openModal(){$("#genericModal").classList.remove("hidden")}
function closeModal(){$("#genericModal").classList.add("hidden")}
$("#genericBackdrop").onclick=closeModal;

try{
  render();
}catch(err){
  console.error("YVIA startup error:",err);
  const main=document.querySelector("#main");
  if(main){
    main.style.height="100dvh";
    main.style.padding="40px 20px";
    main.style.overflow="auto";
    main.innerHTML=`<div style="max-width:360px;margin:80px auto;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
      <div style="font-size:28px;font-weight:800;margin-bottom:10px">YVIA konnte nicht starten.</div>
      <div style="color:#9099a7;font-size:13px;line-height:1.5">Bitte lade die Seite einmal neu. Falls das bleibt, ist ein technischer Fehler aufgetreten.</div>
    </div>`;
  }
}
