margin-top:7px}.toggle-row button{border:1px solid var(--line);border-radius:11px;background:#151c27;color:#9ca5b1;padding:7px 8px;font-size:6px}.toggle-row button.on{background:#252f3d;color:white}.select-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.select-grid button{height:38px;border:1px solid var(--line);border-radius:12px;background:#151c27;color:#9ca5b1;font-size:6px}.select-grid button.on{background:#252f3d;color:white}.savedgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.sj{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#111722;text-align:left;color:white;padding:0}.sj .pic{height:64px;background-size:cover;background-position:center}.sj .txt{padding:6px}.sj b{font-size:7px}.sj small{display:block;font-size:6px;color:#7d8796;margin-top:2px}

function metric(k){let a=s.entries.slice(-10).map(x=>+x[k]).filter(Number.isFinite);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*20):60}
function totalScore(){return Math.round((metric("satisfaction")+(100-metric("stress"))+metric("energy"))/3)}
function smoothPath(points){
 if(points.length<2)return "";
 let d=`M ${points[0][0]} ${points[0][1]}`;
 for(let i=0;i<points.length-1;i++){
   let p0=points[i-1]||points[i],p1=points[i],p2=points[i+1],p3=points[i+2]||p2;
   let cp1x=p1[0]+(p2[0]-p0[0])/6,cp1y=p1[1]+(p2[1]-p0[1])/6;
   let cp2x=p2[0]-(p3[0]-p1[0])/6,cp2y=p2[1]-(p3[1]-p1[1])/6;
   d+=` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
 }
 return d;
}
function chartSVG(){
 let a=s.entries.slice(-8);if(a.length<2)a=[{satisfaction:3,energy:3},{satisfaction:3,energy:3}];
 let w=320,h=100,p=8,pts=k=>a.map((x,i)=>[p+i*(w-p*2)/(a.length-1),h-p-((+x[k]-1)/4)*(h-p*2)]);
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
 <defs><linearGradient id="lc" x1="0" x2="1"><stop stop-color="#ff8a62"/><stop offset="1" stop-color="#f45f97"/></linearGradient><linearGradient id="le" x1="0" x2="1"><stop stop-color="#6488ff"/><stop offset="1" stop-color="#a16cff"/></linearGradient></defs>
 <path d="${smoothPath(pts("satisfaction"))}" fill="none" stroke="url(#lc)" stroke-width="3.2" stroke-linecap="round"/>
 <path d="${smoothPath(pts("energy"))}" fill="none" stroke="url(#le)" stroke-width="2.2" opacity=".78" stroke-linecap="round"/>
 </svg>`
}
function gaugeSVG(score){
 let pct=Math.max(0,Math.min(100,score)),dash=157.1,off=dash*(1-pct/100);
 return `<svg viewBox="0 0 120 70" width="100%" height="100%">
 <defs><linearGradient id="gg" x1="0" x2="1"><stop stop-color="#ffb548"/><stop offset=".55" stop-color="#ff755d"/><stop offset="1" stop-color="#f45f97"/></linearGradient></defs>
 <path d="M15 60 A45 45 0 0 1 105 60" fill="none" stroke="#202733" stroke-width="10" stroke-linecap="round"/>
 <path d="M15 60 A45 45 0 0 1 105 60" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round" pathLength="157.1" stroke-dasharray="157.1" stroke-dashoffset="${off.toFixed(1)}"/>
 </svg>`
}

function filteredJobs(){return jobs.filter(j=>!s.passed.includes(j.id)&&!s.liked.includes(j.id)&&(!s.filters.salary||j.salary>=s.filters.salary)&&j.distance<=s.filters.distance&&(!s.filters.models.length||s.filters.models.includes(j.model))&&(!s.filters.hours.length||s.filters.hours.includes(j.hours)))}

 $("#filterBtn").onclick=openFilters;$("#savedBtn").onclick=()=>{s.profileTab="saved";route("profile")};
 $("#pass")?.addEventListener("click",()=>{s.passed.push(j.id);save();render()});$("#like")?.addEventListener("click",()=>{s.liked.push(j.id);save();toast("Job gemerkt");render()});$("#resetJobs")?.addEventListener("click",()=>{s.passed=[];s.liked=[];s.filters={salary:0,distance:100,models:[],hours:[]};save();render()});$$("[data-info]").forEach(b=>b.onclick=()=>openJob(b.dataset.info));if(j)swipe($("#front"),j.id)

function jobCard(j,back){return `<article class="card ${back?"back":""}" ${back?"":"id='front'"}><div class="jobpic" style="background-image:url('${j.image}')"><span class="score">✦ ${j.score}% Match</span><div class="jobtitle"><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p></div></div><div class="jobbody"><div class="facts"><span>${j.model}</span><span>${j.hours}</span><span>ab ${euro(j.salary)}</span></div><div class="why">${j.reasons.map(x=>`<div><b>✓</b>${esc(x)}</div>`).join("")}</div><button class="more" data-info="${j.id}">Mehr Infos</button></div></article>`}
function swipe(c,id){let sx=0,sy=0,cx=0,cy=0,drag=false,pid;c.onpointerdown=e=>{pid=e.pointerId;c.setPointerCapture?.(pid);sx=e.clientX;sy=e.clientY;drag=true;c.style.transition="none"};c.onpointermove=e=>{if(!drag||e.pointerId!==pid)return;cx=e.clientX-sx;cy=e.clientY-sy;c.style.transform=`translate3d(${cx}px,${cy*.1}px,0) rotate(${Math.max(-7,Math.min(7,cx/30))}deg)`};c.onpointerup=()=>{if(!drag)return;drag=false;if(Math.abs(cx)>90){let d=cx>0?1:-1;c.style.transition=".3s";c.style.transform=`translate3d(${d*window.innerWidth*1.3}px,0,0) rotate(${d*10}deg)`;setTimeout(()=>{if(d>0)s.liked.push(id);else s.passed.push(id);save();render()},260)}else{c.style.transition=".42s cubic-bezier(.2,.85,.2,1)";c.style.transform="translate3d(0,0,0)"}}}
function openFilters(){

 openModal();$("#fSalary").oninput=e=>{s.filters.salary=+e.target.value;$("#fsal").textContent=s.filters.salary?euro(s.filters.salary):"egal"};$("#fDistance").oninput=e=>{s.filters.distance=+e.target.value;$("#fdist").textContent=s.filters.distance+" km"};$$("[data-fm]").forEach(b=>b.onclick=()=>{let x=b.dataset.fm;s.filters.models=s.filters.models.includes(x)?s.filters.models.filter(v=>v!==x):[...s.filters.models,x];renderFilterOnly()});$$("[data-fh]").forEach(b=>b.onclick=()=>{let x=b.dataset.fh;s.filters.hours=s.filters.hours.includes(x)?s.filters.hours.filter(v=>v!==x):[...s.filters.hours,x];renderFilterOnly()});$("#resetFilter").onclick=()=>{s.filters={salary:0,distance:100,models:[],hours:[]};save();openFilters()};$("#applyFilter").onclick=()=>{save();closeModal();render()}
}

function openJob(id){let j=jobs.find(x=>x.id===id);if(!j)return;$("#genericSheet").innerHTML=`<div class="grab"></div><div class="kicker">${j.score}% Match</div><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p><div class="detail-img" style="background-image:url('${j.image}')"></div><div class="detail-grid"><div><small>GEHALT</small><b>ab ${euro(j.salary)}</b></div><div><small>MODELL</small><b>${j.model}</b></div><div><small>ARBEITSZEIT</small><b>${j.hours}</b></div><div><small>VERTRAG</small><b>${j.contract}</b></div></div><div class="detail-block"><b>Warum es zu dir passen könnte</b><p>${j.reasons.map(x=>"• "+x).join("<br>")}</p></div><div class="detail-block"><b>Worum es geht</b><p>${esc(j.about)}</p></div><div class="sheet-actions"><button class="secondary" id="detailBack">Zurück</button><button class="primary" id="detailLike">${s.liked.includes(j.id)?"Gespeichert ✓":"♥ Merken"}</button></div>`;openModal();$("#detailBack").onclick=closeModal;$("#detailLike").onclick=()=>{if(!s.liked.includes(j.id))s.liked.push(j.id);save();closeModal();toast("Job gemerkt");render()}}

function friendReply(t){
 t=t.toLowerCase();let n=s.name?`${s.name}, `:"";
 if(/chef|chefin|leitung|kontroll/.test(t))return `${n}uff 😕 das würde mich auch nerven. Sag mir kurz, was genau passiert ist – dann basteln wir dir einen Satz, den du morgen wirklich sagen kannst.`;
 if(/überforder|ueberforder|zu viel|stress/.test(t))return `${n}das klingt gerade echt viel. Du musst heute nicht alles retten. Morgen: „Was hat wirklich Priorität – und was darf warten?“ ❤️`;
 if(/künd|kuend|weg|wechsel/.test(t))return `${n}ich würde heute noch nicht kündigen. Erst ehrlich trennen: Willst du aus dem Beruf raus – oder nur aus dieser Situation?`;
 if(/geld|gehalt|lohn|verdien/.test(t))return `${n}ja, das kann richtig frustrieren 😕. Schreib dir drei Dinge auf, die du heute zusätzlich leistest. Genau damit würde ich ins Gespräch gehen.`;
 if(/kolleg|team|streit/.test(t))return `${n}boah, sowas hängt nach. War das heute einmalig – oder passiert das immer wieder?`;
 if(/motivation|kein bock|keine lust/.test(t))return `${n}ich glaub, du musst dich gerade nicht „mehr motivieren“. Schau morgen nur: Was zieht dir Energie – und was fühlt sich überraschend okay an?`;
 if(/match|stelle|job/.test(t)){let j=filteredJobs()[0]||liked()[0];return j?`${n}ehrlich? ${j.title} sieht gut aus – aber nur, wenn es etwas löst, das dich heute wirklich nervt. Der Score allein reicht mir nicht.`:`${n}lass uns deine gemerkten Jobs anschauen. Ich würde nach Alltag gehen, nicht nur nach Score.`}
 return `${n}erzähl mir den einen Moment, der dir gerade im Kopf hängt. Kurz reicht. Ich hör zu ❤️`;
}
function chat(m){m.innerHTML=`<section class="screen chat-screen"><div><div class="kicker">Chat</div><h1 class="title" style="font-size:32px">Sag's mir einfach.</h1><p class="sub">Kurz, ehrlich, wie bei jemandem, dem du vertraust.</p></div><div class="messages" id="msgs">${s.chat.map(x=>`<div class="msg ${x.role}">${esc(x.text)}</div>`).join("")}</div><div><div class="suggest">${["Mein Chef nervt","Ich kann gerade nicht mehr","Soll ich wechseln?","Sag ehrlich: Passt der Job?"].map(x=>`<button data-s="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="compose"><textarea id="ci" placeholder="Was ist los?"></textarea><button id="send">↑</button></div></div></section>`;let box=$("#msgs");requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);function send(){let i=$("#ci"),t=i.value.trim();if(!t)return;s.chat.push({role:"user",text:t},{role:"bot",text:friendReply(t)});s.chat=s.chat.slice(-30);save();render()}$("#send").onclick=send;$("#ci").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$$("[data-s]").forEach(b=>b.onclick=()=>{$("#ci").value=b.dataset.s;send()})}

/* PROFIL */
const baseSkills=["Organisation","Überblick","Kommunikation","Verlässlich","Problemlösung","Kreativ","Empathisch","Strukturiert","Praktisch","Eigenständig"];
function profile(m){
 let p=s.profileTab,panel=p==="strengths"?`<div class="pcard"><h3>Was kannst du wirklich gut?</h3><p>Wähle aus oder ergänze eigene Stärken. Eigene Einträge bleiben dauerhaft im Profil.</p><div class="chips">${[...new Set([...baseSkills,...s.skills])].map(x=>`<button class="chip ${s.skills.includes(x)?"on":""}" data-skill="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="addrow"><input id="newSkill" placeholder="Eigene Stärke, z. B. ruhig unter Druck"><button id="addSkill">+</button></div></div>`:
 p==="frame"?frameHTML():
 p==="saved"?`<div class="pcard"><h3>Gemerkt</h3><p>${liked().length} gespeicherte Matches.</p><div class="savedgrid">${liked().length?liked().map(j=>`<button class="sj" data-openjob="${j.id}"><div class="pic" style="background-image:url('${j.image}')"></div><div class="txt"><b>${esc(j.title)}</b><small>${j.company} · ${j.score}%</small></div></button>`).join(""):`<p>Noch nichts gespeichert.</p>`}</div></div>`:
 `<div class="pcard"><h3>Dein YVIA-Profil</h3><p>${s.skills.slice(0,4).join(" · ")}</p><div class="prow"><span>Zufriedenheit</span><b>${metric("satisfaction")}%</b></div><div class="prow"><span>Stress</span><b>${metric("stress")}%</b></div><div class="prow"><span>Energie</span><b>${metric("energy")}%</b></div></div>`;
 m.innerHTML=`<section class="screen profile"><div class="profhero"><button class="profphoto" id="photoBtn">${s.photo?`<img src="${s.photo}">`:"👤"}</button><div><small>DEIN YVIA PROFIL</small><h1>${esc(s.name)}</h1><p>Stärken, Rahmen und gemerkte Jobs.</p></div><input type="file" id="photoInput" accept="image/*"></div><div class="ptabs">${[["me","Ich"],["strengths","Stärken"],["frame","Mein Rahmen"],["saved","Gemerkt"]].map(([k,l])=>`<button class="${p===k?"active":""}" data-pt="${k}">${l}</button>`).join("")}</div><div class="ppanel">${panel}</div></section>`;
 $$("[data-pt]").forEach(b=>b.onclick=()=>{s.profileTab=b.dataset.pt;save();render()});
 $("#photoBtn").onclick=()=>$("#photoInput").click();$("#photoInput").onchange=e=>{let f=e.target.files?.[0];if(f)openPhotoEditor(f)};
 $$("[data-skill]").forEach(b=>b.onclick=()=>{let x=b.dataset.skill;s.skills=s.skills.includes(x)?s.skills.filter(v=>v!==x):[...s.skills,x];save();render()});
 $("#addSkill")?.addEventListener("click",()=>{let v=$("#newSkill").value.trim();if(v&&!s.skills.includes(v)){s.skills.push(v);save();toast("Stärke hinzugefügt");render()}});
 bindFrame();$$("[data-openjob]").forEach(b=>b.onclick=()=>openJob(b.dataset.openjob))
}
function frameHTML(){return `<div class="pcard"><h3>Dein Rahmen</h3><p>Je klarer deine Grenzen, desto weniger unpassende Matches.</p>
 <div class="prow"><span>Mindestgehalt</span><b id="salOut">${euro(s.salary)}</b></div><input class="range" id="salRange" type="range" min="1800" max="7000" step="100" value="${s.salary}">
 <div class="prow"><span>Max. Entfernung</span><b id="distOut">${s.distance} km</b></div><input class="range" id="distRange" type="range" min="5" max="100" step="5" value="${s.distance}">
 <div class="prow"><span>Wochenstunden</span><b id="hoursOut">${s.weeklyHours} Std.</b></div><input class="range" id="hoursRange" type="range" min="15" max="45" step="1" value="${s.weeklyHours}">
 <div class="prow"><span>Arbeitsmodell</span><b></b></div><div class="toggle-row">${["Vor Ort","Hybrid","Homeoffice"].map(x=>`<button class="${s.workModels.includes(x)?"on":""}" data-wm="${x}">${x}</button>`).join("")}</div>
 <div class="prow"><span>Arbeitszeit</span><b></b></div><div class="toggle-row">${["Vollzeit","Teilzeit"].map(x=>`<button class="${s.workTimes.includes(x)?"on":""}" data-wt="${x}">${x}</button>`).join("")}</div>
 <div class="prow"><span>Schichten</span><b></b></div><div class="toggle-row">${["Tagschicht","Frühschicht","Spätschicht","Nachtschicht"].map(x=>`<button class="${s.shifts.includes(x)?"on":""}" data-sh="${x}">${x}</button>`).join("")}</div>
 <div class="prow"><span>Vertrag</span><b></b></div><div class="toggle-row">${["Unbefristet","Befristet okay"].map(x=>`<button class="${s.contract.includes(x)?"on":""}" data-co="${x}">${x}</button>`).join("")}</div>
 <div class="prow"><span>Wochenende</span><b>${s.weekend?"okay":"nein"}</b></div><div class="toggle-row"><button class="${s.weekend?"on":""}" id="weekBtn">${s.weekend?"Wochenende möglich":"Keine Wochenendarbeit"}</button></div>
 <div class="prow"><span>Start</span><b>${s.start}</b></div><div class="select-grid">${["Sofort","1 Monat","3 Monate","Flexibel"].map(x=>`<button class="${s.start===x?"on":""}" data-start="${x}">${x}</button>`).join("")}</div>
 </div>`}
function bindFrame(){
 $("#salRange")?.addEventListener("input",e=>{s.salary=+e.target.value;$("#salOut").textContent=euro(s.salary);save()});
 $("#distRange")?.addEventListener("input",e=>{s.distance=+e.target.value;$("#distOut").textContent=s.distance+" km";save()});
 $("#hoursRange")?.addEventListener("input",e=>{s.weeklyHours=+e.target.value;$("#hoursOut").textContent=s.weeklyHours+" Std.";save()});
 $$("[data-wm]").forEach(b=>b.onclick=()=>{let x=b.dataset.wm;s.workModels=s.workModels.includes(x)?s.workModels.filter(v=>v!==x):[...s.workModels,x];save();render()});
 $$("[data-wt]").forEach(b=>b.onclick=()=>{let x=b.dataset.wt;s.workTimes=s.workTimes.includes(x)?s.workTimes.filter(v=>v!==x):[...s.workTimes,x];save();render()});
 $$("[data-sh]").forEach(b=>b.onclick=()=>{let x=b.dataset.sh;s.shifts=s.shifts.includes(x)?s.shifts.filter(v=>v!==x):[...s.shifts,x];save();render()});
 $$("[data-co]").forEach(b=>b.onclick=()=>{let x=b.dataset.co;s.contract=s.contract.includes(x)?s.contract.filter(v=>v!==x):[...s.contract,x];save();render()});
 $("#weekBtn")?.addEventListener("click",()=>{s.weekend=!s.weekend;save();render()});
 $$("[data-start]").forEach(b=>b.onclick=()=>{s.start=b.dataset.start;save();render()})
}

/* FOTO EDITOR */
let photoTemp=null;
function openPhotoEditor(file){
 let url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{
   let crop=230,minScale=Math.max(crop/img.naturalWidth,crop/img.naturalHeight);
   photoTemp={url,img,minScale,zoom:1,x:0,y:0};
   renderPhotoEditor();openModal()
 };
 img.src=url
}
function renderPhotoEditor(){
 let p=photoTemp,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale;
 $("#genericSheet").innerHTML=`<div class="grab"></div><h2>Profilbild anpassen</h2><p>Zoomen und mit dem Finger verschieben.</p><div class="photo-editor"><div class="cropbox" id="cropBox"><img id="cropImg" src="${p.url}" style="width:${w}px;height:${h}px;transform:translate(calc(-50% + ${p.x}px),calc(-50% + ${p.y}px))"></div><div class="zoomrow"><span>kleiner</span><input id="zoom" type="range" min="1" max="3" step=".01" value="${p.zoom}"><span>größer</span></div><div class="sheet-actions"><button class="secondary" id="photoCancel">Abbrechen</button><button class="primary" id="photoSave">Speichern</button></div></div>`;
 let box=$("#cropBox"),drag=false,sx=0,sy=0,ox=0,oy=0;
 box.onpointerdown=e=>{drag=true;box.setPointerCapture?.(e.pointerId);sx=e.clientX;sy=e.clientY;ox=p.x;oy=p.y};
 box.onpointermove=e=>{if(!drag)return;p.x=ox+(e.clientX-sx);p.y=oy+(e.clientY-sy);clampPhoto();renderPhotoPos()};
 box.onpointerup=()=>drag=false;box.onpointercancel=()=>drag=false;
 $("#zoom").oninput=e=>{p.zoom=+e.target.value;clampPhoto();renderPhotoPos()};
 $("#photoCancel").onclick=()=>{URL.revokeObjectURL(p.url);photoTemp=null;closeModal()};
 $("#photoSave").onclick=saveCroppedPhoto
}
function clampPhoto(){
 let p=photoTemp,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale,c=230;
 let maxX=Math.max(0,(w-c)/2),maxY=Math.max(0,(h-c)/2);p.x=Math.max(-maxX,Math.min(maxX,p.x));p.y=Math.max(-maxY,Math.min(maxY,p.y))
}
function renderPhotoPos(){let p=photoTemp,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale,im=$("#cropImg");im.style.width=w+"px";im.style.height=h+"px";im.style.transform=`translate(calc(-50% + ${p.x}px),calc(-50% + ${p.y}px))`}
function saveCroppedPhoto(){
 let p=photoTemp,crop=230,scale=p.minScale*p.zoom,w=p.img.naturalWidth*scale,h=p.img.naturalHeight*scale;
 let left=(w-crop)/2-p.x,top=(h-crop)/2-p.y;
 let sx=left/scale,sy=top/scale,sw=crop/scale,sh=crop/scale;
 let c=document.createElement("canvas");c.width=c.height=480;c.getContext("2d").drawImage(p.img,sx,sy,sw,sh,0,0,480,480);
 s.photo=c.toDataURL("image/jpeg",.86);save();URL.revokeObjectURL(p.url);photoTemp=null;closeModal();toast("Profilbild gespeichert");render()
}

/* MODAL */
function openModal(){$("#genericModal").classList.remove("hidden")}
function closeModal(){$("#genericModal").classList.add("hidden")}
$("#genericBackdrop").onclick=closeModal;

render();
</script>
