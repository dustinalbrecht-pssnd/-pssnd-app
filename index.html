<head>

<title>YVIA V1.2</title>
<style>
:root{
  --bg:#07090d;--surface:#10151e;--surface2:#151c27;--line:rgba(255,255,255,.075);
  --text:#f8f8fa;--muted:#8c96a5;--coral:#ff755c;--pink:#f45f97;--orange:#ff9367;
  --gold:#f5b548;--blue:#6488ff;--purple:#a26cff;--green:#67d6a4;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05070a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{min-height:100dvh;background:radial-gradient(circle at 105% -5%,rgba(255,117,92,.14),transparent 26%),var(--bg);overscroll-behavior:none}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{width:min(100%,480px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#090c11,#07090d)}
.topbar{height:68px;padding:calc(10px + env(safe-area-inset-top,0px)) 17px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}.mark{width:31px;height:31px;position:relative}.mark:before,.mark:after{content:"";position:absolute;width:19px;height:27px;bottom:1px;border-radius:18px 18px 14px 14px;transform-origin:bottom center}.mark:before{left:2px;transform:rotate(-37deg);background:linear-gradient(#ffb55d,#ff7158)}.mark:after{right:2px;transform:rotate(37deg);background:linear-gradient(#ffd07b,#f35b93)}.brand b{font-size:19px;letter-spacing:.08em}
.avatar{width:39px;height:39px;border-radius:14px;border:1px solid var(--line);background:#121823;color:white;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
main{height:calc(100dvh - 68px);padding:5px 15px calc(91px + var(--safe));overflow:hidden}
.screen{height:100%;min-height:0;animation:in .25s ease}@keyframes in{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:10px;color:var(--orange);font-weight:850;letter-spacing:.11em;text-transform:uppercase}
.title{font-size:37px;line-height:.98;letter-spacing:-.055em;margin:6px 0 7px}.sub{font-size:11px;line-height:1.4;color:var(--muted);margin:0}
.nav{position:absolute;z-index:40;left:12px;right:12px;bottom:calc(10px + var(--safe));height:67px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(13,17,24,.94);border:1px solid var(--line);border-radius:23px;backdrop-filter:blur(22px);box-shadow:0 18px 45px rgba(0,0,0,.35)}
.nav button{border:0;border-radius:17px;background:transparent;color:#747e8c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav span{font-size:17px}.nav small{font-size:9px;font-weight:800}.nav button.active{background:rgba(255,255,255,.06);color:white}.nav button.active span{color:var(--orange)}
.moment-fab{position:absolute;z-index:55;right:18px;bottom:calc(85px + var(--safe));height:48px;padding:0 14px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--coral),var(--pink));color:white;box-shadow:0 14px 32px rgba(244,95,151,.24);display:flex;align-items:center;gap:8px;font-size:11px;font-weight:850}.moment-fab span{font-size:17px}

/* Login */
.login{display:flex;flex-direction:column;justify-content:space-between;height:auto!important;min-height:calc(100dvh - 28px);padding:calc(10px + env(safe-area-inset-top,0px)) 3px calc(12px + env(safe-area-inset-bottom,0px))}
.login-brand{display:flex;gap:12px;align-items:center}.login-brand .mark{width:43px;height:43px}.login-brand .mark:before,.login-brand .mark:after{width:26px;height:38px}.login-brand b{font-size:28px}
.login-copy{margin-top:5vh}.login-copy h1{font-size:48px;line-height:.94;letter-spacing:-.07em;margin:0 0 14px}.login-copy p{font-size:14px;line-height:1.48;color:#929baa;max-width:365px}
.orb{width:180px;height:180px;border-radius:50%;margin:16px auto 10px;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.45),transparent 18%),linear-gradient(140deg,#ffb44e,#ff795c 35%,#f45e98 67%,#8c6aff);box-shadow:0 25px 70px rgba(244,95,151,.15)}
.auth{display:grid;gap:9px}.auth button,.auth input{height:53px;border-radius:17px}.auth button{border:1px solid var(--line);background:#111722;color:white;font-weight:800}.auth button.primary{border:0;background:linear-gradient(110deg,var(--coral),var(--pink))}.auth input{border:1px solid var(--line);background:#111722;color:white;padding:0 13px}
@media(max-height:740px){.login-copy{margin-top:18px}.login-copy h1{font-size:39px}.login-copy p{font-size:12px}.orb{width:110px;height:110px;margin:6px auto}.auth button,.auth input{height:47px}}

/* Stimmung */
.mood-screen{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;padding:4px;background:#0e141d;border:1px solid var(--line);border-radius:15px}.tabs button{height:34px;border:0;border-radius:11px;background:transparent;color:#737d8c;font-size:8px;font-weight:850}.tabs button.active{background:#1a2230;color:white}
.mood-body{min-height:0;overflow:hidden;margin-top:9px}
.checkin{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:9px}
.feelings{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.feelings::-webkit-scrollbar{display:none}.feel-chip{flex:none;border:1px solid var(--line);border-radius:999px;background:#111722;color:#aab2bd;padding:8px 10px;font-size:8px;font-weight:750}.feel-chip.on{border-color:rgba(255,123,88,.55);background:rgba(255,115,86,.14);color:#fff}
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.rate{background:#111722;border:1px solid var(--line);border-radius:17px;padding:10px}.rate small{font-size:7px;color:#7f8998;display:block}.rate b{font-size:18px;display:block;margin:4px 0}.rate input{width:100%;accent-color:var(--coral)}
.freebox{min-height:0;display:grid;grid-template-rows:auto 1fr;background:#101722;border:1px solid var(--line);border-radius:18px;padding:10px}.freebox label{font-size:8px;color:#7f8998;font-weight:800;margin-bottom:5px}.freebox textarea{min-height:0;resize:none;border:0;background:transparent;color:white;outline:none;font-size:11px;line-height:1.4}
.save-check{height:45px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--pink));color:white;font-size:10px;font-weight:850}
.analysis{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:#111722;border:1px solid var(--line);border-radius:16px;padding:10px}.metric span{font-size:15px}.metric strong{display:block;font-size:20px;margin:3px 0}.metric small{font-size:7px;color:#7f8998}.metric i{display:block;height:4px;background:#252c37;border-radius:99px;margin-top:7px;overflow:hidden}.metric i b{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--pink))}.metric:nth-child(2) i b{background:linear-gradient(90deg,var(--blue),var(--purple))}.metric:nth-child(3) i b{background:linear-gradient(90deg,var(--gold),var(--coral))}
.chart-card{min-height:0;background:#0f151e;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column}.chart-head{display:flex;justify-content:space-between}.chart-head b{font-size:10px}.chart-head small{font-size:7px;color:#798493}.chart{flex:1;min-height:80px;margin-top:5px}
.insight{background:linear-gradient(135deg,rgba(255,116,86,.1),rgba(244,95,151,.05));border:1px solid rgba(255,120,85,.13);border-radius:17px;padding:10px}.insight small{font-size:7px;color:var(--orange);font-weight:850}.insight b{display:block;font-size:11px;margin:4px 0}.insight p{font-size:8px;line-height:1.35;color:#929baa;margin:0}
.test{height:100%;display:flex;flex-direction:column}.test-intro{background:#111722;border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:3px}.test-intro h3{font-size:17px;margin:0 0 6px}.test-intro p{font-size:9px;line-height:1.4;color:#8b95a4;margin:0}.test-start{height:45px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--pink));color:white;font-size:10px;font-weight:850;margin-top:10px}
.test-q{flex:1;display:flex;flex-direction:column;justify-content:center}.test-progress{font-size:8px;color:#798493;margin-bottom:12px}.test-q h2{font-size:27px;line-height:1.05;margin:0 0 20px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{height:50px;border:1px solid var(--line);border-radius:15px;background:#111722;color:white;font-size:19px}.test-result{background:#111722;border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:12px}.test-result strong{font-size:34px}.test-result h3{font-size:15px;margin:6px 0}.test-result p{font-size:9px;line-height:1.4;color:#8f99a7}

/* Matches */
.matches{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}.match-head{display:flex;justify-content:space-between;align-items:start}.saved-btn{height:34px;border:1px solid var(--line);border-radius:13px;background:#111722;color:#9aa4b2;padding:0 10px;font-size:8px;font-weight:800}
.deck{position:relative;min-height:0;margin-top:9px}.card{position:absolute;inset:0;border-radius:25px;overflow:hidden;background:#111722;border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.35);touch-action:pan-y;will-change:transform}.card.back{transform:translateY(8px) scale(.965);opacity:.72}.jobpic{height:56%;background-size:cover;background-position:center;position:relative}.jobpic:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,9,13,.9),rgba(7,9,13,.12) 60%,transparent)}.score{position:absolute;z-index:2;top:13px;left:13px;padding:8px 10px;border-radius:999px;background:rgba(8,12,17,.72);border:1px solid rgba(255,255,255,.12);font-size:9px;font-weight:850}.jobtitle{position:absolute;z-index:2;left:14px;right:14px;bottom:12px}.jobtitle h2{font-size:23px;line-height:1.02;margin:0 0 4px}.jobtitle p{font-size:9px;color:#d0d5dc;margin:0}.jobbody{height:44%;padding:10px 13px;display:flex;flex-direction:column}.facts{display:flex;gap:5px;flex-wrap:wrap}.facts span{padding:6px 8px;border-radius:999px;background:#171e29;color:#b4bcc7;font-size:7px}.why{display:grid;gap:4px;margin-top:8px;overflow:hidden}.why div{font-size:8px;color:#a4adb9}.why b{color:#ff916f;margin-right:6px}.more{margin-top:auto;height:35px;border:1px solid var(--line);border-radius:13px;background:#161d28;color:white;font-size:9px;font-weight:800}.swipebar{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:8px}.swipebar button{height:48px;border-radius:17px}.pass{border:1px solid var(--line);background:#111722;color:white}.like{border:0;background:linear-gradient(135deg,var(--coral),var(--pink));color:white}.swipebar span{text-align:center;font-size:7px;color:#677180}

/* Chat */
.chat-screen{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}.messages{min-height:0;overflow:auto;padding:10px 1px 8px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}.messages::-webkit-scrollbar{display:none}.msg{max-width:87%;padding:10px 11px;border-radius:16px;font-size:10px;line-height:1.4}.bot{align-self:flex-start;background:#111722;border:1px solid var(--line)}.user{align-self:flex-end;background:linear-gradient(135deg,var(--coral),var(--pink))}.suggest{display:flex;gap:5px;overflow:auto;margin-bottom:6px;scrollbar-width:none}.suggest button{flex:none;border:1px solid var(--line);background:#111722;color:#a3acb8;border-radius:999px;padding:7px 9px;font-size:7px}.compose{display:grid;grid-template-columns:1fr 42px;gap:7px;background:#101722;border:1px solid var(--line);border-radius:18px;padding:7px}.compose textarea{height:42px;resize:none;border:0;background:transparent;color:white;outline:none;padding:9px 4px;font-size:10px}.compose button{border:0;border-radius:13px;background:linear-gradient(135deg,var(--coral),var(--pink));color:white;font-size:18px}

/* Profile */
.profile{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0}.profhero{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}.profphoto{width:62px;height:62px;border-radius:20px;border:1px solid var(--line);background:#131a25;color:white;overflow:hidden}.profphoto img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}.profhero small{font-size:7px;color:#778291}.profhero h1{font-size:22px;margin:4px 0}.profhero p{font-size:8px;color:#87919f;margin:0}.ptabs{display:flex;gap:5px;overflow:auto;margin-top:12px;padding:4px;background:#0d131c;border:1px solid var(--line);border-radius:15px;scrollbar-width:none}.ptabs button{flex:none;height:32px;border:0;border-radius:11px;background:transparent;color:#737e8e;font-size:7px;font-weight:850;padding:0 10px}.ptabs button.active{background:#1a2230;color:white}.ppanel{min-height:0;overflow:auto;margin-top:9px;scrollbar-width:none}.pcard{background:#101722;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:8px}.pcard h3{font-size:12px;margin:0 0 4px}.pcard p{font-size:8px;color:#8b95a4;line-height:1.4;margin:0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{border:1px solid var(--line);border-radius:999px;background:#151d28;color:#c0c7d0;padding:8px 9px;font-size:7px}.chip.on{background:rgba(255,117,92,.12);border-color:rgba(255,117,92,.35);color:white}.addrow{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:9px}.addrow input{height:38px;border:1px solid var(--line);border-radius:13px;background:#151c27;color:white;padding:0 10px;font-size:8px}.addrow button{border:0;border-radius:13px;background:#202938;color:white;padding:0 11px;font-size:8px}.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}.prow span{font-size:8px;color:#7f8998}.prow b{font-size:9px}.range{width:100%;accent-color:var(--coral)}.toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.toggle-row button{border:1px solid var(--line);border-radius:12px;background:#151c27;color:#9ca5b1;padding:8px 9px;font-size:7px}.toggle-row button.on{background:#252f3d;color:white}.upload{margin-top:9px;border:1px dashed rgba(255,128,93,.32);border-radius:15px;padding:11px;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}.upload i{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--coral),var(--pink));font-style:normal}.upload b{font-size:9px}.upload small{display:block;font-size:7px;color:#7e8897}.upload button{border:0;border-radius:11px;background:#1a2230;color:white;padding:8px 9px;font-size:7px}.files{display:grid;gap:5px;margin-top:7px}.file{display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center;background:#141b25;border-radius:12px;padding:7px}.thumb{width:28px;height:28px;border-radius:8px;background-size:cover;background-position:center;display:grid;place-items:center;background-color:#202938}.file b{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file small{font-size:6px;color:#778291}.file button{border:0;background:none;color:#788291}.savedgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.sj{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#111722;text-align:left;color:white;padding:0}.sj .pic{height:68px;background-size:cover;background-position:center}.sj .txt{padding:7px}.sj b{font-size:8px}.sj small{display:block;font-size:6px;color:#7d8796;margin-top:2px}

/* Moment sheet */
.modal{position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end}.modal.hidden{display:none}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}.sheet{position:relative;width:100%;border-radius:28px 28px 0 0;background:#0d121a;border:1px solid var(--line);padding:11px 15px calc(15px + var(--safe));box-shadow:0 -28px 70px rgba(0,0,0,.45)}.grab{width:38px;height:4px;border-radius:99px;background:#303744;margin:0 auto 11px}.sheet h2{font-size:23px;margin:0 0 5px}.sheet p{font-size:8px;color:#87919f;margin:0}.momentcats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.momentcats button{height:62px;border:1px solid var(--line);border-radius:16px;background:#111722;color:white;font-size:9px}.momentcats button.on{border-color:rgba(255,121,88,.5);background:rgba(255,117,92,.12)}.momentfeel{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.momentfeel button{height:42px;border:1px solid var(--line);border-radius:13px;background:#111722;color:white}.momentfeel button.on{background:#232d3b}.momentnote{width:100%;height:62px;margin-top:9px;resize:none;border:1px solid var(--line);border-radius:14px;background:#111722;color:white;padding:9px;outline:none;font-size:9px}.moment-save{width:100%;height:44px;margin-top:9px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--coral),var(--pink));color:white;font-size:9px;font-weight:850}
.toast{position:absolute;z-index:150;left:50%;bottom:94px;transform:translate(-50%,15px);opacity:0;background:#1b2330;border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:8px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">

</div>

function latest(){return s.checks.at(-1)||{satisfaction:3,stress:3,energy:3}}
function metric(k){let a=s.checks.slice(-7).map(x=>+x[k]).filter(Number.isFinite);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*20):60}
function chart(){let a=s.checks.slice(-7);if(!a.length)a=[{satisfaction:3,energy:3},{satisfaction:3,energy:3}];let w=320,h=100,p=8;let path=k=>a.map((x,i)=>{let xx=p+i*(w-p*2)/Math.max(1,a.length-1),yy=h-p-((+x[k]-1)/4)*(h-p*2);return (i?"L":"M")+xx.toFixed(1)+" "+yy.toFixed(1)}).join(" ");return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none"><defs><linearGradient id="a"><stop stop-color="#ff8a62"/><stop offset="1" stop-color="#f45f97"/></linearGradient><linearGradient id="b"><stop stop-color="#6488ff"/><stop offset="1" stop-color="#a26cff"/></linearGradient></defs><path d="${path("satisfaction")}" fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round"/><path d="${path("energy")}" fill="none" stroke="url(#b)" stroke-width="2.2" opacity=".8" stroke-linecap="round"/></svg>`}
function insight(){let st=metric("stress"),sa=metric("satisfaction"),en=metric("energy");let neg=s.moments.slice(-5).filter(x=>x.feel==="bad").length;if(st>=70)return ["Dein Stress fällt gerade auf.",neg>=2?"Auch deine letzten gespeicherten Momente waren eher belastend. Das sieht nach einem Muster aus.":"Schau weniger darauf, alles zu schaffen – und mehr darauf, was gerade wirklich zu viel ist."];if(sa<50)return ["Du wirkst eher unzufrieden als nur gestresst.","Das ist wichtig: Vielleicht geht es nicht um weniger Arbeit, sondern um andere Arbeit oder bessere Bedingungen."];if(en<50)return ["Deine Energie ist gerade der auffälligste Punkt.","Achte darauf, welche Situationen dich leerziehen. Genau dafür ist der Moment-Button da."];return ["Im Moment wirkt vieles stabil.","YVIA muss dir keinen Wechsel einreden. Gute Tage sind genauso wichtig für dein Profil."]}

function mood(m){let L=latest(),ins=insight();m.innerHTML=`<section class="screen mood-screen"><div><div class="kicker">Stimmung</div><h1 class="title">Wie geht's dir<br>gerade im Job?</h1><p class="sub">Mehrere Gefühle sind okay. Schreib dazu, was gerade wirklich los ist.</p></div><div class="tabs"><button data-mt="check" class="${s.moodTab==="check"?"active":""}">Check-in</button><button data-mt="analysis" class="${s.moodTab==="analysis"?"active":""}">Auswertung</button><button data-mt="test" class="${s.moodTab==="test"?"active":""}">Selbsttest</button></div><div class="mood-body">${s.moodTab==="check"?`<div class="checkin"><div class="feelings">${feelings.map(f=>`<button class="feel-chip ${s.feelings.includes(f)?"on":""}" data-feel="${f}">${f}</button>`).join("")}</div><div class="triple">${[["satisfaction","Zufriedenheit","☺"],["stress","Stress","⚡"],["energy","Energie","◒"]].map(([k,l,ic])=>`<div class="rate"><small>${l}</small><b>${ic} ${s.draft[k]}/5</b><input type="range" min="1" max="5" value="${s.draft[k]}" data-rate="${k}"></div>`).join("")}</div><div class="freebox"><label>Wie fühlst du dich gerade?</label><textarea id="moodNote" placeholder="Zum Beispiel: Eigentlich mag ich meinen Job, aber heute hat mich mein Chef komplett fertiggemacht …">${esc(s.draft.note)}</textarea></div><button class="save-check" id="saveCheck">Check-in speichern</button></div>`:s.moodTab==="analysis"?`<div class="analysis"><div class="metrics"><div class="metric"><span>☺</span><strong>${metric("satisfaction")}%</strong><small>Zufriedenheit</small><i><b style="width:${metric("satisfaction")}%"></b></i></div><div class="metric"><span>⚡</span><strong>${metric("stress")}%</strong><small>Stress</small><i><b style="width:${metric("stress")}%"></b></i></div><div class="metric"><span>◒</span><strong>${metric("energy")}%</strong><small>Energie</small><i><b style="width:${metric("energy")}%"></b></i></div></div><div class="chart-card"><div class="chart-head"><b>Deine Entwicklung</b><small>${s.moments.length} Momente gespeichert</small></div><div class="chart">${chart()}</div></div><div class="insight"><small>YVIA ERKENNT</small><b>${esc(ins[0])}</b><p>${esc(ins[1])}</p></div></div>`:testHTML()}</div></section>`;$$("[data-mt]").forEach(b=>b.onclick=()=>{s.moodTab=b.dataset.mt;save();render()});$$("[data-feel]").forEach(b=>b.onclick=()=>{let f=b.dataset.feel;s.feelings=s.feelings.includes(f)?s.feelings.filter(x=>x!==f):[...s.feelings,f];save();render()});$$("[data-rate]").forEach(i=>i.oninput=()=>{s.draft[i.dataset.rate]=+i.value;i.closest(".rate").querySelector("b").innerHTML=(i.dataset.rate==="stress"?"⚡":i.dataset.rate==="energy"?"◒":"☺")+" "+i.value+"/5";save()});$("#moodNote")?.addEventListener("input",e=>{s.draft.note=e.target.value;save()});$("#saveCheck")?.addEventListener("click",()=>{s.checks.push({ts:Date.now(),feelings:[...s.feelings],...s.draft});s.checks=s.checks.slice(-30);s.feelings=[];s.draft={satisfaction:3,stress:3,energy:3,note:""};save();toast("Check-in gespeichert");render()});testBind()}
function testHTML(){if(s.test.result)return `<div class="test"><div class="test-result"><small style="color:var(--orange);font-size:7px">DEIN LETZTER SELBSTTEST</small><strong>${s.test.result}%</strong><h3>${s.test.result>=70?"Vieles passt gerade.":s.test.result>=50?"Da ist Luft nach oben.":"Deine Arbeit kostet dich gerade viel."}</h3><p>Der Test ist kein Urteil. Er hilft YVIA nur dabei, besser zu verstehen, ob eher Belastung, Passung oder Entwicklung dein Thema ist.</p><button class="test-start" id="restartTest">Nochmal testen</button></div></div>`;if(!s.test.active)return `<div class="test"><div class="test-intro"><h3>2-Minuten Job-Check</h3><p>6 kurze Fragen. Keine Persönlichkeitsschublade. Am Ende bekommst du einen einfachen Hinweis, wie gut dein aktueller Job gerade zu dir passt.</p><button class="test-start" id="startTest">Selbsttest starten</button></div></div>`;let i=s.test.index;return `<div class="test"><div class="test-q"><div class="test-progress">Frage ${i+1} von ${questions.length}</div><h2>${esc(questions[i])}</h2><div class="scale">${[1,2,3,4,5].map(v=>`<button data-test="${v}">${["😣","😕","😐","🙂","😊"][v-1]}</button>`).join("")}</div></div></div>`}

function avail(){return jobs.filter(j=>!s.liked.includes(j.id)&&!s.passed.includes(j.id))}function liked(){return s.liked.map(id=>jobs.find(j=>j.id===id)).filter(Boolean)}
function matches(m){let a=avail(),j=a[0],n=a[1];m.innerHTML=`<section class="screen matches"><div class="match-head"><div><div class="kicker">Matches</div><h1 class="title" style="font-size:32px">Jobs, die wirklich<br>zu dir passen.</h1><p class="sub">Links weiter. Rechts merken.</p></div><button class="saved-btn" id="showSaved">${s.liked.length} gemerkt</button></div>${j?`<div class="deck">${n?card(n,true):""}${card(j,false)}</div><div class="swipebar"><button class="pass" id="pass">✕</button><span>swipen oder tippen</span><button class="like" id="like">♥</button></div>`:`<div style="display:grid;place-items:center;text-align:center;color:#7f8998"><div>Alles gesehen ✨<br><button class="saved-btn" id="resetJobs" style="margin-top:10px">Zurücksetzen</button></div></div>`}</section>`;$("#pass")?.addEventListener("click",()=>{s.passed.push(j.id);save();render()});$("#like")?.addEventListener("click",()=>{s.liked.push(j.id);save();toast("Job gemerkt");render()});$("#resetJobs")?.addEventListener("click",()=>{s.passed=[];s.liked=[];save();render()});$("#showSaved").onclick=()=>{s.profileTab="saved";route("profile")};if(j)swipe($("#front"),j.id)}
function card(j,back){return `<article class="card ${back?"back":""}" ${back?"":"id='front'"}><div class="jobpic" style="background-image:url('${j.image}')"><span class="score">✦ ${j.score}% Match</span><div class="jobtitle"><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p></div></div><div class="jobbody"><div class="facts"><span>${j.model}</span><span>${j.type}</span><span>ab ${euro(j.salary)}</span></div><div class="why">${j.reasons.map(x=>`<div><b>✓</b>${esc(x)}</div>`).join("")}</div><button class="more">Mehr erfahren</button></div></article>`}
function swipe(c,id){let sx=0,sy=0,cx=0,cy=0,drag=false,pid;function paint(){c.style.transform=`translate3d(${cx}px,${cy*.1}px,0) rotate(${Math.max(-7,Math.min(7,cx/30))}deg)`}c.onpointerdown=e=>{pid=e.pointerId;c.setPointerCapture?.(pid);sx=e.clientX;sy=e.clientY;drag=true;c.style.transition="none"};c.onpointermove=e=>{if(!drag||e.pointerId!==pid)return;cx=e.clientX-sx;cy=e.clientY-sy;paint()};c.onpointerup=e=>{if(!drag)return;drag=false;if(Math.abs(cx)>90){let d=cx>0?1:-1;c.style.transition=".3s";c.style.transform=`translate3d(${d*window.innerWidth*1.3}px,0,0) rotate(${d*10}deg)`;setTimeout(()=>{if(d>0)s.liked.push(id);else s.passed.push(id);save();render()},260)}else{c.style.transition=".42s cubic-bezier(.2,.85,.2,1)";c.style.transform="translate3d(0,0,0)"}}}

function friendReply(t){t=t.toLowerCase();let name=s.name?`${s.name}, `:"";if(/chef|chefin|leitung|kontroll/.test(t))return `${name}uff 😕 das würde mich auch nerven. Sag mir kurz, was genau passiert ist – dann überlegen wir einen Satz, den du morgen wirklich sagen kannst.`;if(/überforder|ueberforder|zu viel|stress/.test(t))return `${name}das klingt gerade echt viel. Du musst nicht alles retten. Frag morgen ganz konkret: „Was hat heute wirklich Priorität – und was darf warten?“`;if(/künd|kuend|weg|wechsel/.test(t))return `${name}ich würde heute noch nicht kündigen. Erst rausfinden: Willst du wirklich aus dem Beruf raus – oder nur aus dieser Situation?`;if(/geld|gehalt|lohn|verdien/.test(t))return `${name}ja, das kann richtig frustrieren. Nimm drei Dinge, die du heute zusätzlich leistest – genau damit würde ich ins Gehaltsgespräch gehen.`;if(/kolleg|team|streit/.test(t))return `${name}boah, sowas hängt einem nach 😕. War das ein einmaliger blöder Moment oder passiert das öfter?`;if(/motivation|kein bock|keine lust/.test(t))return `${name}ich glaub, du musst dich gerade nicht „mehr motivieren“. Schau morgen nur: Welche Aufgabe zieht dir Energie – und welche fühlt sich okay an?`;if(/match|job|stelle/.test(t)){let j=avail()[0]||liked()[0];return j?`${name}ehrlich? ${j.title} sieht interessant aus – aber nur, wenn es wirklich etwas löst, das dich heute nervt. Der Score allein ist mir zu wenig.`:`${name}lass uns deine gemerkten Jobs anschauen. Ich würde nicht nach dem höchsten Score gehen, sondern danach, was deinen Alltag wirklich besser macht.`}return `${name}erzähl mir den einen Moment, der dir gerade im Kopf hängt. Ich hör zu ❤️`;}
function chat(m){m.innerHTML=`<section class="screen chat-screen"><div><div class="kicker">Chat</div><h1 class="title" style="font-size:33px">Sag's mir einfach.</h1><p class="sub">Wie bei jemandem, dem du vertraust. Kurz, ehrlich, ohne Coach-Gelaber.</p></div><div class="messages" id="msgs">${s.chat.map(x=>`<div class="msg ${x.role}">${esc(x.text)}</div>`).join("")}</div><div><div class="suggest">${["Mein Chef nervt mich","Ich kann gerade nicht mehr","Soll ich wechseln?","Passt der Job wirklich?"].map(x=>`<button data-s="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="compose"><textarea id="ci" placeholder="Was ist los?"></textarea><button id="send">↑</button></div></div></section>`;let box=$("#msgs");requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);function send(){let i=$("#ci"),t=i.value.trim();if(!t)return;s.chat.push({role:"user",text:t},{role:"bot",text:friendReply(t)});s.chat=s.chat.slice(-30);save();render()}$("#send").onclick=send;$("#ci").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$$("[data-s]").forEach(b=>b.onclick=()=>{$("#ci").value=b.dataset.s;send()})}

function profile(m){let p=s.profileTab;let panel=p==="strengths"?`<div class="pcard"><h3>Deine Stärken</h3><p>Tippe an, was zu dir passt. Du kannst auch eigene ergänzen.</p><div class="chips">${strengthPool.map(x=>`<button class="chip ${s.skills.includes(x)?"on":""}" data-skill="${x}">${x}</button>`).join("")}</div><div class="addrow"><input id="newSkill" placeholder="Eigene Stärke"><button id="addSkill">Hinzufügen</button></div></div>`:p==="frame"?`<div class="pcard"><h3>Dein Rahmen</h3><div class="prow"><span>Mindestens Gehalt</span><b id="sal">${euro(s.salary)}</b></div><input class="range" id="salary" type="range" min="1800" max="7000" step="100" value="${s.salary}"><div class="prow"><span>Max. Entfernung</span><b id="dist">${s.distance} km</b></div><input class="range" id="distance" type="range" min="5" max="100" step="5" value="${s.distance}"><div class="toggle-row">${["Vor Ort","Hybrid","Homeoffice"].map(x=>`<button class="${s.models.includes(x)?"on":""}" data-model="${x}">${x}</button>`).join("")}</div><div class="toggle-row"><button class="${s.night?"on":""}" id="night">Nachtschicht okay</button><button class="${s.weekend?"on":""}" id="weekend">Wochenende okay</button></div></div>`:p==="docs"?docsHTML():p==="saved"?`<div class="pcard"><h3>Gemerkt</h3><div class="savedgrid">${liked().length?liked().map(j=>`<button class="sj"><div class="pic" style="background-image:url('${j.image}')"></div><div class="txt"><b>${esc(j.title)}</b><small>${j.company} · ${j.score}%</small></div></button>`).join(""):`<p>Noch keine Jobs gemerkt.</p>`}</div></div>`:`<div class="pcard"><h3>Das bist du bei YVIA</h3><p>${s.skills.slice(0,3).join(" · ")}</p><div class="chips">${s.feelings.slice(0,4).map(x=>`<span class="chip on">${x}</span>`).join("")}</div></div><div class="pcard"><h3>Dein letzter Stand</h3><div class="prow"><span>Zufriedenheit</span><b>${metric("satisfaction")}%</b></div><div class="prow"><span>Stress</span><b>${metric("stress")}%</b></div><div class="prow"><span>Energie</span><b>${metric("energy")}%</b></div></div>`;m.innerHTML=`<section class="screen profile"><div class="profhero"><button class="profphoto" id="photoBtn">${s.photo?`<img src="${s.photo}">`:"👤"}</button><div><small>DEIN YVIA PROFIL</small><h1>${esc(s.name)}</h1><p>Stärken, Rahmen, Unterlagen und gemerkte Jobs.</p></div><input type="file" id="photoInput" accept="image/*"></div><div class="ptabs">${[["me","Ich"],["strengths","Stärken"],["frame","Rahmen"],["docs","Unterlagen"],["saved","Gemerkt"]].map(([k,l])=>`<button class="${p===k?"active":""}" data-pt="${k}">${l}</button>`).join("")}</div><div class="ppanel">${panel}</div></section>`;$$("[data-pt]").forEach(b=>b.onclick=()=>{s.profileTab=b.dataset.pt;save();render()});$("#photoBtn").onclick=()=>$("#photoInput").click();$("#photoInput").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{s.photo=await profileImage(f);save();toast("Profilbild gespeichert");render()}catch(err){toast("Bild konnte nicht geladen werden")}};$$("[data-skill]").forEach(b=>b.onclick=()=>{let x=b.dataset.skill;s.skills=s.skills.includes(x)?s.skills.filter(v=>v!==x):[...s.skills,x];save();render()});$("#addSkill")?.addEventListener("click",()=>{let v=$("#newSkill").value.trim();if(v&&!s.skills.includes(v))s.skills.push(v);save();render()});$("#salary")?.addEventListener("input",e=>{s.salary=+e.target.value;$("#sal").textContent=euro(s.salary);save()});$("#distance")?.addEventListener("input",e=>{s.distance=+e.target.value;$("#dist").textContent=s.distance+" km";save()});$$("[data-model]").forEach(b=>b.onclick=()=>{let x=b.dataset.model;s.models=s.models.includes(x)?s.models.filter(v=>v!==x):[...s.models,x];save();render()});$("#night")?.addEventListener("click",()=>{s.night=!s.night;save();render()});$("#weekend")?.addEventListener("click",()=>{s.weekend=!s.weekend;save();render()});docBind()}
function docsHTML(){return `<div class="pcard"><h3>Unterlagen</h3><p>Lebenslauf, Zeugnisse und Bilder. In dieser Demo werden Dateien nur lokal vorgemerkt.</p><div class="upload"><i>↥</i><div><b>Lebenslauf</b><small>PDF, DOC, DOCX</small></div><button id="cvBtn">Auswählen</button></div><div class="upload"><i>＋</i><div><b>Zeugnisse & Bilder</b><small>PDF, Bilder, Dokumente</small></div><button id="docsBtn">Hinzufügen</button></div><input type="file" id="cvInput" accept=".pdf,.doc,.docx,application/pdf"><input type="file" id="docsInput" multiple accept="image/*,.pdf,.doc,.docx,application/pdf"><div class="files">${s.docs.map((d,i)=>`<div class="file"><div class="thumb" ${d.thumb?`style="background-image:url('${d.thumb}')"`:""}>${d.thumb?"":"📎"}</div><div><b>${esc(d.name)}</b><small>${esc(d.kind)}</small></div><button data-del="${i}">×</button></div>`).join("")}</div></div>`}
async function makeThumb(file){if(!file.type.startsWith("image/"))return "";try{let u=URL.createObjectURL(file),img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=u});let c=document.createElement("canvas"),side=Math.min(img.naturalWidth,img.naturalHeight);c.width=c.height=100;c.getContext("2d").drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,100,100);URL.revokeObjectURL(u);return c.toDataURL("image/jpeg",.65)}catch(e){return ""}}
function docBind(){$("#cvBtn")?.addEventListener("click",()=>$("#cvInput").click());$("#docsBtn")?.addEventListener("click",()=>$("#docsInput").click());$("#cvInput")?.addEventListener("change",async e=>addFiles([...e.target.files],"Lebenslauf"));$("#docsInput")?.addEventListener("change",async e=>addFiles([...e.target.files],"Dokument"));$$("[data-del]").forEach(b=>b.onclick=()=>{s.docs.splice(+b.dataset.del,1);save();render()})}
async function addFiles(fs,kind){for(let f of fs)s.docs.push({name:f.name,kind,thumb:await makeThumb(f)});s.docs=s.docs.slice(-20);save();toast("Datei hinzugefügt");render()}

render();
</script>
</body>
</html>
