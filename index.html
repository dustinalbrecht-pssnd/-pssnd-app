<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>eUpdate</title>
    <link rel="stylesheet" href="assets/eupdate.css" />
    <script>
      const routes = {
        feed: 'ranking',
        builder: 'Bauen',
        attachments: 'Aufsaetze',
        settings: 'Einstellungen',
        events: 'News',
        detail: 'Loadout',
      };
      const hash = location.hash.slice(1);
      const params = new URLSearchParams(location.search);
      if (document.referrer) {
        const referrer = new URL(document.referrer);
        params.set('quelle', referrer.origin === location.origin ? 'internal' : referrer.hostname);
      }
      if (['creators', 'creator', 'streamer'].includes(hash)) params.set('streamer', '1');
      const view = hash === 'detail' && !params.has('id') ? 'feed' : hash;
      const destination = Object.hasOwn(routes, view) ? routes[view] : routes.feed;
      location.replace(destination + '/' + (params.size ? '?' + params : ''));
    </script>
  </head>
  <body>
    <main><a href="ranking/">Zum Ranking</a></main>
  </body>
</html>
