<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>YVIA V1.1.1</title>
<style>
:root{
  --bg:#07090d;
  --bg2:#0b0f15;
  --surface:#10151d;
  --surface2:#151b25;
  --line:rgba(255,255,255,.075);
  --text:#f7f7f8;
  --muted:#8f98a6;
  --orange:#ff8a62;
  --coral:#ff6e5a;
  --pink:#f45f96;
  --gold:#f4b244;
  --green:#68d8a6;
  --blue:#6587ff;
  --purple:#a16cff;
  --shadow:0 24px 70px rgba(0,0,0,.42);
  --radius:26px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05070a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at 110% -6%,rgba(255,112,80,.16),transparent 28%),
    radial-gradient(circle at -15% 40%,rgba(98,118,255,.06),transparent 27%),
    var(--bg);
  overscroll-behavior:none;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(255,128,91,.65);outline-offset:2px}
.hidden{display:none!important}

#app{
  width:min(100%,480px);
  margin:0 auto;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 100% 7%,rgba(255,119,79,.09),transparent 23%),
    linear-gradient(180deg,#090c11 0%,#07090d 100%);
}

/* Header */
.topbar{
  height:70px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  position:relative;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:31px;height:31px;position:relative}
.brand-mark:before,.brand-mark:after{
  content:"";position:absolute;width:19px;height:27px;border-radius:18px 18px 14px 14px;
  transform-origin:bottom center;
  bottom:1px;
}
.brand-mark:before{left:2px;transform:rotate(-37deg);background:linear-gradient(180deg,#ffb55d,#ff7258)}
.brand-mark:after{right:2px;transform:rotate(37deg);background:linear-gradient(180deg,#ffd07b,#f35b93)}
.brand-name{font-size:19px;font-weight:900;letter-spacing:.08em}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:39px;height:39px;border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,.045);color:#fff;display:grid;place-items:center
}
.avatar-btn{padding:0;overflow:hidden}
.avatar-btn img{width:100%;height:100%;object-fit:cover}

/* Layout */
main{
  height:calc(100dvh - 70px);
  padding:6px 16px calc(88px + var(--safe-bottom));
  overflow:hidden;
}
.screen{height:100%;min-height:0;animation:screenIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:10px;font-weight:850;letter-spacing:.11em;color:var(--orange);text-transform:uppercase}
.title{font-size:38px;line-height:.98;letter-spacing:-.055em;margin:7px 0 8px;font-weight:820}
.subtitle{font-size:12px;color:var(--muted);line-height:1.45;margin:0}

/* Bottom nav */
.nav{
  position:absolute;z-index:50;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));
  height:68px;padding:6px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:rgba(13,17,24,.92);border:1px solid var(--line);border-radius:24px;
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
  box-shadow:0 20px 50px rgba(0,0,0,.35)
}
.nav button{
  border:0;border-radius:18px;background:transparent;color:#77808e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.nav button span{font-size:18px;line-height:1}
.nav button small{font-size:9px;font-weight:750}
.nav button.active{background:rgba(255,255,255,.065);color:#fff}
.nav button.active span{color:var(--orange)}

/* Login */
.login-screen{display:flex;flex-direction:column;justify-content:space-between;padding:5vh 4px 0}
.login-brand{display:flex;align-items:center;gap:12px}
.login-brand .brand-mark{width:46px;height:46px}
.login-brand .brand-mark:before,.login-brand .brand-mark:after{width:28px;height:41px}
.login-brand .brand-name{font-size:29px}
.login-copy{margin-top:7vh}
.login-copy h1{font-size:50px;line-height:.94;letter-spacing:-.07em;margin:0 0 17px;max-width:380px}
.login-copy p{font-size:15px;color:#929ba8;line-height:1.5;max-width:360px}
.login-orb{
  width:225px;height:225px;border-radius:50%;margin:20px auto 12px;
  background:
    radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 20%),
    linear-gradient(140deg,#ffb24d 0%,#ff7a5d 35%,#f55c98 67%,#8c6aff 100%);
  filter:saturate(.95);
  box-shadow:0 30px 80px rgba(244,95,150,.16);
  position:relative;opacity:.95
}
.login-orb:before{
  content:"";position:absolute;inset:25px;border-radius:50%;
  background:linear-gradient(145deg,rgba(5,7,10,.05),rgba(5,7,10,.35));
  transform:rotate(28deg) scale(.84);
}
.auth-stack{display:grid;gap:10px;margin-bottom:12px}
.auth-btn{
  min-height:56px;border-radius:19px;border:1px solid var(--line);
  color:#fff;font-weight:800;background:#111722
}
.auth-btn.primary{border:0;background:linear-gradient(110deg,var(--coral),var(--pink));box-shadow:0 15px 36px rgba(244,95,150,.2)}
.auth-mini{text-align:center;color:#747e8d;font-size:10px}
.auth-mini button{border:0;background:none;color:#ff826c;font-size:10px;font-weight:800}
.email-panel{display:grid;gap:9px;margin-bottom:10px}
.email-panel input{height:52px;border-radius:17px;border:1px solid var(--line);background:#111722;color:#fff;padding:0 14px}
.email-panel .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* STIMMUNG */
.mood-screen{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
.mood-head{padding-top:3px}
.mood-grid{
  min-height:0;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px
}
.mood-card{
  border:1px solid var(--line);border-radius:20px;background:#111722;color:#fff;padding:12px;
  text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:0;
  transition:transform .15s ease,border-color .15s ease,background .15s ease
}
.mood-card:active{transform:scale(.97)}
.mood-card.selected{
  border-color:rgba(255,124,88,.7);
  background:linear-gradient(145deg,rgba(255,111,84,.25),rgba(244,95,150,.13));
  box-shadow:0 0 0 1px rgba(255,115,83,.12),0 14px 34px rgba(0,0,0,.18)
}
.mood-icon{font-size:23px}
.mood-card b{font-size:12px;line-height:1.18}
.mood-card small{font-size:8px;color:#8b95a4}
.mood-card.selected small{color:#d9bbc0}
.mood-summary{
  margin-top:10px;border-radius:18px;border:1px solid rgba(255,123,87,.16);
  background:linear-gradient(135deg,rgba(255,116,86,.11),rgba(244,95,150,.06));
  padding:12px;display:grid;grid-template-columns:32px 1fr 24px;gap:9px;align-items:center
}
.mood-summary .spark{width:32px;height:32px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--coral));color:#16100b}
.mood-summary b{display:block;font-size:11px}
.mood-summary p{margin:2px 0 0;font-size:9px;line-height:1.35;color:#9da6b4}
.mood-summary button{border:0;background:none;color:#cc8e7c;font-size:16px}
.mood-tabs{
  margin-top:9px;display:grid;grid-template-columns:1fr 1fr;background:#0e141e;border:1px solid var(--line);border-radius:15px;padding:4px
}
.mood-tabs button{height:34px;border:0;border-radius:11px;background:transparent;color:#737d8d;font-size:9px;font-weight:800}
.mood-tabs button.active{background:#1a2230;color:#fff}
.analysis-panel{min-height:0;overflow:hidden;margin-top:10px}
.analysis-overview{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:9px}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{
  background:#111722;border:1px solid var(--line);border-radius:16px;padding:10px
}
.metric span{font-size:14px}.metric strong{display:block;font-size:20px;margin:3px 0 0}.metric small{font-size:8px;color:#828c9b}
.metric i{display:block;height:4px;border-radius:99px;background:#242b36;margin-top:8px;overflow:hidden}
.metric i b{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--coral),var(--pink))}
.metric:nth-child(2) i b{background:linear-gradient(90deg,var(--blue),var(--purple))}
.metric:nth-child(3) i b{background:linear-gradient(90deg,var(--gold),var(--coral))}
.chart-card{
  min-height:0;background:#0f151e;border:1px solid var(--line);border-radius:18px;padding:11px;display:flex;flex-direction:column
}
.chart-head{display:flex;justify-content:space-between;align-items:center}
.chart-head b{font-size:11px}.chart-head small{font-size:8px;color:#7f8998}
.chart-wrap{flex:1;min-height:80px;margin-top:6px}
.insight-card{background:#101722;border:1px solid var(--line);border-radius:17px;padding:11px}
.insight-card small{font-size:8px;color:var(--orange);font-weight:850;letter-spacing:.08em}
.insight-card b{display:block;font-size:12px;margin-top:4px}
.insight-card p{font-size:9px;color:#9099a7;margin:4px 0 0;line-height:1.35}

/* MATCHES */
.matches-screen{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}
.match-topline{display:flex;justify-content:space-between;align-items:flex-start}
.match-actions-head{display:flex;gap:7px}
.pill-btn{height:34px;padding:0 11px;border:1px solid var(--line);border-radius:13px;background:#111722;color:#a0a9b6;font-size:9px;font-weight:800}
.pill-btn.active{background:#1a2230;color:#fff}
.deck{
  position:relative;min-height:0;margin-top:12px
}
.deck-card{
  position:absolute;inset:0;border-radius:27px;overflow:hidden;background:#111722;border:1px solid var(--line);box-shadow:var(--shadow);
  touch-action:pan-y;user-select:none;will-change:transform,opacity;transform:translate3d(0,0,0)
}
.deck-card.back{transform:translateY(9px) scale(.965);opacity:.72;background:#0f141c}
.job-image{height:55%;min-height:210px;background-size:cover;background-position:center;position:relative}
.job-image:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,9,13,.88) 0%,rgba(7,9,13,.18) 55%,transparent 100%)}
.job-score{
  position:absolute;z-index:3;left:14px;top:14px;padding:8px 10px;border-radius:999px;
  background:rgba(9,13,18,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);
  font-size:10px;font-weight:850;color:#ffe0b8
}
.job-heart{
  position:absolute;z-index:3;right:14px;top:14px;width:39px;height:39px;border-radius:14px;border:1px solid rgba(255,255,255,.12);
  background:rgba(9,13,18,.7);color:#fff;display:grid;place-items:center;font-size:17px
}
.job-image-title{position:absolute;z-index:3;left:15px;right:15px;bottom:14px}
.job-image-title h2{font-size:24px;line-height:1.02;margin:0 0 4px;letter-spacing:-.04em}
.job-image-title p{font-size:10px;color:#d4d8de;margin:0}
.job-body{height:45%;padding:12px 14px 13px;display:flex;flex-direction:column}
.job-facts{display:flex;gap:6px;flex-wrap:wrap}
.job-facts span{font-size:8px;padding:7px 9px;border-radius:999px;background:#171e29;color:#b7bec8}
.job-reasons{margin-top:10px;display:grid;gap:6px;overflow:hidden}
.job-reasons div{display:flex;gap:7px;font-size:9px;color:#a7afba;line-height:1.3}
.job-reasons b{color:#ff936f}
.job-more{
  margin-top:auto;height:38px;border:1px solid var(--line);border-radius:14px;background:#151b25;color:#dce0e6;font-size:10px;font-weight:800
}
.swipe-footer{display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center;margin-top:10px}
.swipe-footer button{height:54px;border-radius:18px}
.swipe-no,.swipe-like{border:1px solid var(--line);background:#111722;color:#fff;font-size:19px}
.swipe-like{border:0;background:linear-gradient(145deg,var(--coral),var(--pink));box-shadow:0 12px 28px rgba(244,95,150,.2)}
.swipe-hint{text-align:center;font-size:8px;color:#697383}
.saved-strip{display:flex;gap:8px;overflow:auto;padding:1px 0 2px;scrollbar-width:none}
.saved-strip::-webkit-scrollbar{display:none}
.saved-mini{flex:0 0 112px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#111722}
.saved-mini .pic{height:54px;background-size:cover;background-position:center}
.saved-mini div:last-child{padding:7px}
.saved-mini b{font-size:9px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-mini small{font-size:7px;color:#7d8796}

/* CHAT */
.chat-screen{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.chat-header-copy{padding-top:3px}
.chat-list{min-height:0;overflow:auto;padding:12px 1px 8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.chat-list::-webkit-scrollbar{display:none}
.msg{max-width:87%;padding:10px 12px;border-radius:17px;font-size:11px;line-height:1.45}
.msg.bot{align-self:flex-start;background:#111722;border:1px solid var(--line);color:#e8ebef}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff}
.chat-suggestions{display:flex;gap:6px;overflow:auto;margin-bottom:7px;scrollbar-width:none}
.chat-suggestions::-webkit-scrollbar{display:none}
.chat-suggestions button{flex:none;border:1px solid var(--line);border-radius:999px;background:#111722;color:#a8b0bb;padding:8px 10px;font-size:8px;font-weight:700}
.chat-input{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:end;background:#101722;border:1px solid var(--line);border-radius:19px;padding:7px}
.chat-input button{width:42px;height:42px;border:0;border-radius:14px;background:#171e29;color:#fff}
.chat-input button.send{background:linear-gradient(135deg,var(--coral),var(--pink))}
.chat-input textarea{height:42px;max-height:90px;resize:none;border:0;background:transparent;color:#fff;padding:10px 4px;outline:none;font-size:11px}

/* PROFILE */
.profile-screen{display:grid;grid-template-rows:auto auto 1fr;min-height:0}
.profile-hero{display:grid;grid-template-columns:66px 1fr 36px;gap:11px;align-items:center}
.profile-photo{width:66px;height:66px;border:1px solid var(--line);border-radius:22px;background:#121924;overflow:hidden;color:white;font-size:25px}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-hero small{font-size:8px;color:#778292;letter-spacing:.08em;font-weight:800}
.profile-hero h1{font-size:24px;line-height:1;margin:5px 0 4px}
.profile-hero p{font-size:9px;color:#87919f;margin:0}
.profile-tabs{
  margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:#0d131c;border:1px solid var(--line);border-radius:15px
}
.profile-tabs button{height:34px;border:0;border-radius:11px;background:transparent;color:#747f8f;font-size:8px;font-weight:800}
.profile-tabs button.active{background:#1a2230;color:#fff}
.profile-panel{min-height:0;overflow:auto;margin-top:10px;scrollbar-width:none}
.profile-panel::-webkit-scrollbar{display:none}
.panel-card{background:#101722;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px}
.panel-card h3{font-size:13px;margin:0 0 4px}
.panel-card p{font-size:9px;color:#8f99a7;line-height:1.4;margin:0}
.upload-box{
  margin-top:10px;border:1px dashed rgba(255,133,96,.35);border-radius:16px;padding:13px;
  display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center;background:linear-gradient(135deg,rgba(255,119,83,.08),rgba(244,95,150,.04))
}
.upload-icon{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff}
.upload-box b{font-size:10px;display:block}.upload-box small{font-size:8px;color:#7f8998}
.upload-box button{border:0;background:#1a2230;color:#fff;border-radius:11px;padding:8px 10px;font-size:8px;font-weight:800}
.file-list{display:grid;gap:6px;margin-top:8px}
.file-item{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px 9px;border-radius:13px;background:#141b25}
.file-item span{font-size:14px}.file-item b{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-item small{font-size:7px;color:#76808f}
.file-item button{border:0;background:none;color:#8d96a4}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{padding:8px 10px;border-radius:999px;background:#151d28;color:#c2c8d0;font-size:8px;font-weight:700}
.profile-jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.profile-job{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#111722}
.profile-job .pic{height:72px;background-size:cover;background-position:center}
.profile-job .txt{padding:8px}.profile-job b{font-size:9px}.profile-job small{display:block;font-size:7px;color:#7f8998;margin-top:2px}
.profile-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.profile-row:last-child{border-bottom:0}.profile-row span{font-size:9px;color:#7f8998}.profile-row b{font-size:10px}

/* DETAIL MODAL */
.modal{position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end}
.modal.hidden{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-height:84%;overflow:auto;border-radius:29px 29px 0 0;background:#0d121a;border:1px solid var(--line);box-shadow:0 -30px 80px rgba(0,0,0,.45);padding:12px 16px calc(16px + var(--safe-bottom))}
.grabber{width:38px;height:4px;border-radius:99px;background:#303744;margin:0 auto 11px}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{font-size:28px;line-height:1;margin:4px 0}
.sheet p{font-size:10px;color:#8c96a4;line-height:1.45}
.close{width:36px;height:36px;border-radius:13px;border:1px solid var(--line);background:#151c27;color:#fff}
.detail-img{height:190px;border-radius:20px;background-size:cover;background-position:center;margin:12px 0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.detail-grid div{background:#141b25;border-radius:14px;padding:10px}.detail-grid small{font-size:7px;color:#778291}.detail-grid b{display:block;font-size:10px;margin-top:2px}
.detail-why{margin-top:10px;background:#111722;border:1px solid var(--line);border-radius:16px;padding:11px}
.detail-why b{font-size:10px}.detail-why p{margin:5px 0 0}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.detail-actions button{height:48px;border-radius:16px;font-weight:800}
.detail-actions .secondary{background:#151c27;border:1px solid var(--line);color:#fff}
.detail-actions .primary{border:0;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff}

/* Utilities */
.toast{position:absolute;z-index:150;left:50%;bottom:94px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1b2330;color:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:13px;font-size:9px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
input[type=file]{display:none}
@media(max-width:365px){
  .title{font-size:34px}.login-copy h1{font-size:45px}.mood-card{padding:10px}.job-image{min-height:185px}
}

/* ===== YVIA V1.1.1 Startscreen fix ===== */
.login-screen{
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 30px);
  height:auto!important;
  overflow:visible!important;
}
.login-screen>div:first-child{flex:0 0 auto}
.login-screen>div:last-child{flex:0 0 auto;padding-bottom:4px}
#main{
  scrollbar-width:none;
}
#main::-webkit-scrollbar{display:none}

/* Short iPhones / browser chrome visible */
@media (max-height:780px){
  .login-screen{padding-top:1vh}
  .login-copy{margin-top:3vh}
  .login-copy h1{font-size:43px;margin-bottom:12px}
  .login-copy p{font-size:13px;line-height:1.4}
  .login-orb{
    width:155px;
    height:155px;

<script>

const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);

const jobs=[

const defaultState={
  onboarded:false,
  route:"login",
  mood:"okay",
  moodTab:"today",
  moodHistory:[
    {d:"Mo",mood:3,stress:3,energy:3},
    {d:"Di",mood:2,stress:4,energy:2},
    {d:"Mi",mood:3,stress:3,energy:3},

function loadState(){
  try{
    const raw=localStorage.getItem("yvia_v11");
    if(!raw)return structuredClone(defaultState);
    return Object.assign(structuredClone(defaultState),JSON.parse(raw));
  }catch(e){return structuredClone(defaultState)}
}
let state=loadState();
function save(){localStorage.setItem("yvia_v11",JSON.stringify(state))}
function toast(t){
  const el=$("#toast");el.textContent=t;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1800)
}
function route(r){

}

function render(){
  const logged=state.onboarded;

}

/* MOOD + ANALYSE */
const moodOptions=[
  ["great","😊","Richtig gut","Ich bin heute zufrieden",5],
  ["okay","🙂","Ganz okay","Nichts Besonderes",4],
  ["meh","😐","Geht so","Irgendwas fehlt",3],
  ["stress","😵","Gestresst","Es ist gerade viel",2],
  ["down","😞","Unzufrieden","So soll es nicht bleiben",2],
  ["leave","🔥","Ich will raus","Ich habe echt genug",1]
];
function moodNumbers(){
  const h=state.moodHistory||[];
  const avg=k=>{
    const a=h.map(x=>Number(x[k])).filter(Number.isFinite);
    return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*20):60
  };
  return {mood:avg("mood"),stress:avg("stress"),energy:avg("energy")}
}
function moodInsight(){
  const n=moodNumbers();
  if(n.stress>=70&&n.mood>=60)return ["Du magst vieles – aber es kostet gerade zu viel.","Hoher Stress bei trotzdem ordentlicher Stimmung spricht eher für Belastung als für den falschen Beruf."];
  if(n.stress>=70&&n.mood<60)return ["Das ist mehr als nur ein anstrengender Tag.","Stress und Stimmung ziehen gleichzeitig nach unten. YVIA würde jetzt vor allem auf wiederkehrende Auslöser schauen."];
  if(n.mood<50)return ["Deine Stimmung ist zuletzt eher niedrig.","Das heißt nicht automatisch Jobwechsel. Entscheidend ist, ob Aufgabe, Umfeld oder Bedingungen dahinterstecken."];
  return ["Im Moment ist vieles stabil.","YVIA muss dir keinen Wechsel einreden. Gute Phasen sind genauso wichtig wie schlechte."]
}
function chartSVG(){
  const h=state.moodHistory?.slice(-7)||[];
  if(!h.length)return "";
  const w=320,hgt=105,pad=8;
  const pts=(key,invert=false)=>h.map((x,i)=>{
    let v=Number(x[key]??3);if(invert)v=6-v;
    const xx=pad+i*(w-pad*2)/Math.max(1,h.length-1);
    const yy=hgt-pad-((v-1)/4)*(hgt-pad*2);
    return [xx,yy]
  });
  const path=a=>a.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${hgt}" width="100%" height="100%" preserveAspectRatio="none">
    <defs>
      <linearGradient id="ga" x1="0" x2="1"><stop stop-color="#ff8a62"/><stop offset="1" stop-color="#f45f96"/></linearGradient>
      <linearGradient id="gb" x1="0" x2="1"><stop stop-color="#6587ff"/><stop offset="1" stop-color="#a16cff"/></linearGradient>
    </defs>
    <path d="${path(pts("mood"))}" fill="none" stroke="url(#ga)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path(pts("energy"))}" fill="none" stroke="url(#gb)" stroke-width="2.2" opacity=".75" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`
}
function renderMood(m){
  const n=moodNumbers(),ins=moodInsight();
  m.innerHTML=`<section class="screen mood-screen">
    <div class="mood-head">
      <div class="kicker">Stimmung</div>
      <h1 class="title">Wie geht's dir<br>gerade im Job?</h1>
      <p class="subtitle">Ein Tap reicht. Es gibt kein richtig oder falsch.</p>
    </div>

    <div class="mood-tabs">
      <button class="${state.moodTab==="today"?"active":""}" data-mood-tab="today">Heute</button>
      <button class="${state.moodTab==="analysis"?"active":""}" data-mood-tab="analysis">Auswertung</button>
    </div>

    <div class="analysis-panel">
      ${state.moodTab==="today"?`
        <div class="mood-grid">
          ${moodOptions.map(([id,icon,title,sub,val])=>`<button class="mood-card ${state.mood===id?"selected":""}" data-mood="${id}" data-val="${val}">
            <span class="mood-icon">${icon}</span><div><b>${title}</b><small>${sub}</small></div>
          </button>`).join("")}
        </div>
      `:`
        <div class="analysis-overview">
          <div class="metric-row">
            <div class="metric"><span>☺</span><strong>${n.mood}%</strong><small>Zufriedenheit</small><i><b style="width:${n.mood}%"></b></i></div>
            <div class="metric"><span>⚡</span><strong>${n.stress}%</strong><small>Stress</small><i><b style="width:${n.stress}%"></b></i></div>
            <div class="metric"><span>◒</span><strong>${n.energy}%</strong><small>Energie</small><i><b style="width:${n.energy}%"></b></i></div>
          </div>
          <div class="chart-card">
            <div class="chart-head"><b>Deine letzten Tage</b><small>Stimmung & Energie</small></div>
            <div class="chart-wrap">${chartSVG()}</div>
          </div>
          <div class="insight-card"><small>YVIA ERKENNT</small><b>${esc(ins[0])}</b><p>${esc(ins[1])}</p></div>
        </div>
      `}
    </div>

    ${state.moodTab==="today"?`<div class="mood-summary"><div class="spark">✦</div><div><b>Deine Auswertung entsteht automatisch.</b><p>Keine Extra-Fragen. YVIA erkennt mit der Zeit Muster aus deinen Stimmungen.</p></div><button id="toAnalysis">→</button></div>`:""}
  </section>`;

  $$("[data-mood-tab]").forEach(b=>b.onclick=()=>{state.moodTab=b.dataset.moodTab;save();render()});
  $$("[data-mood]").forEach(b=>b.onclick=()=>{
    state.mood=b.dataset.mood;
    const val=+b.dataset.val;
    state.moodHistory=state.moodHistory||[];
    state.moodHistory.push({d:new Date().toLocaleDateString("de-DE",{weekday:"short"}),mood:val,stress:6-val,energy:val});
    state.moodHistory=state.moodHistory.slice(-14);
    save();toast("Stimmung gespeichert");render()
  });
  $("#toAnalysis")?.addEventListener("click",()=>{state.moodTab="analysis";save();render()})
}

/* MATCHES */
function availableJobs(){return jobs.filter(j=>!state.passed.includes(j.id)&&!state.liked.includes(j.id))}
function currentJob(){const a=availableJobs();return a[0]||null}
function likedJobs(){return state.liked.map(id=>jobs.find(j=>j.id===id)).filter(Boolean)}
function renderMatches(m){
  const list=availableJobs(),job=list[0],next=list[1];
  m.innerHTML=`<section class="screen matches-screen">
    <div class="match-topline">
      <div><div class="kicker">Matches</div><h1 class="title" style="font-size:34px">Jobs, die wirklich<br>zu dir passen.</h1><p class="subtitle">Links weiter. Rechts merken. Mehr musst du nicht tun.</p></div>
      <div class="match-actions-head"><button class="pill-btn ${state.matchView==="saved"?"active":""}" id="savedView">${state.liked.length} gespeichert</button></div>
    </div>

    ${state.matchView==="saved"?`
      <div style="min-height:0;overflow:auto;margin-top:12px">
        <div class="saved-strip" style="display:grid;grid-template-columns:1fr 1fr;overflow:visible">
          ${likedJobs().length?likedJobs().map(j=>savedMini(j,true)).join(""):`<div style="grid-column:1/-1;padding:30px 10px;text-align:center;color:#7d8796;font-size:11px">Noch keine gespeicherten Matches.</div>`}
        </div>
      </div>
      <button class="job-more" id="backToDeck" style="margin-top:10px">Zurück zum Swipe-Deck</button>
    `:`
      ${job?`
        <div class="deck">
          ${next?jobCard(next,true):""}
          ${jobCard(job,false)}
        </div>
        <div class="swipe-footer">
          <button class="swipe-no" id="passBtn">✕</button>
          <div class="swipe-hint">swipen oder tippen</div>
          <button class="swipe-like" id="likeBtn">♥</button>
        </div>
      `:`<div style="display:grid;place-items:center;text-align:center;color:#8b95a4;font-size:11px;min-height:0"><div><div style="font-size:34px">✨</div><b style="color:white;display:block;margin:10px 0 5px">Für jetzt alles gesehen.</b><span>Du kannst die Demo-Matches jederzeit zurücksetzen.</span><br><button class="pill-btn" id="resetMatches" style="margin-top:14px">Zurücksetzen</button></div></div>`}
      ${state.liked.length?`<div class="saved-strip">${likedJobs().slice(-4).map(j=>savedMini(j,false)).join("")}</div>`:""}
    `}
  </section>`;

  $("#savedView")?.addEventListener("click",()=>{state.matchView=state.matchView==="saved"?"deck":"saved";save();render()});
  $("#backToDeck")?.addEventListener("click",()=>{state.matchView="deck";save();render()});
  $("#resetMatches")?.addEventListener("click",()=>{state.passed=[];state.liked=[];save();render()});
  if(job&&state.matchView!=="saved"){
    $("#passBtn").onclick=()=>passJob(job.id);
    $("#likeBtn").onclick=()=>likeJob(job.id);
    setupSwipe($("#frontCard"),job.id)
  }
  $$("[data-job-open]").forEach(b=>b.onclick=()=>openJob(b.dataset.jobOpen))
}
function savedMini(j,big=false){
  return `<button class="saved-mini" data-job-open="${j.id}" style="${big?"flex-basis:auto;text-align:left;border:0;padding:0":""}">
    <div class="pic" style="background-image:url('${j.image}')"></div>
    <div><b>${esc(j.title)}</b><small>${j.score}% Match · ${esc(j.city)}</small></div>
  </button>`
}
function jobCard(j,back){
  return `<article class="deck-card ${back?"back":""}" ${back?"":"id='frontCard'"} data-id="${j.id}">
    <div class="job-image" style="background-image:url('${j.image}')">
      <span class="job-score">✦ ${j.score}% Match</span>
      <button class="job-heart" type="button" data-job-heart="${j.id}">♡</button>
      <div class="job-image-title"><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p></div>
    </div>
    <div class="job-body">
      <div class="job-facts"><span>${esc(j.model)}</span><span>${esc(j.type)}</span><span>ab ${money(j.salary)}</span></div>
      <div class="job-reasons">${j.reasons.slice(0,3).map(x=>`<div><b>✓</b><span>${esc(x)}</span></div>`).join("")}</div>
      <button class="job-more" type="button" data-job-open="${j.id}">Mehr erfahren</button>
    </div>
  </article>`
}
function passJob(id){
  if(!state.passed.includes(id))state.passed.push(id);
  save();render()
}
function likeJob(id){
  if(!state.liked.includes(id))state.liked.push(id);
  save();toast("Match gespeichert");render()
}
function setupSwipe(card,id){
  if(!card)return;
  let pid=null,sx=0,sy=0,cx=0,cy=0,lx=0,lt=0,vx=0,drag=false,raf=0;
  const paint=()=>{
    raf=0;
    const rot=clamp(cx/32,-7,7);
    card.style.transform=`translate3d(${cx}px,${cy*.12}px,0) rotate(${rot}deg)`;
    card.style.opacity=String(1-Math.min(.18,Math.abs(cx)/800));
    const back=card.parentElement?.querySelector(".deck-card.back");
    if(back){
      const p=Math.min(1,Math.abs(cx)/140);
      back.style.transform=`translateY(${9-7*p}px) scale(${.965+.03*p})`;
      back.style.opacity=String(.72+.25*p)
    }
  };
  card.onpointerdown=e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    pid=e.pointerId;card.setPointerCapture?.(pid);drag=true;sx=e.clientX;sy=e.clientY;lx=e.clientX;lt=performance.now();cx=cy=vx=0;card.style.transition="none"
  };
  card.onpointermove=e=>{
    if(!drag||e.pointerId!==pid)return;
    const now=performance.now();cx=e.clientX-sx;cy=e.clientY-sy;vx=(e.clientX-lx)/Math.max(8,now-lt);lx=e.clientX;lt=now;
    if(!raf)raf=requestAnimationFrame(paint)
  };
  const end=e=>{
    if(!drag)return;drag=false;
    try{card.releasePointerCapture?.(pid)}catch(_){}
    const go=Math.abs(cx)>95||(Math.abs(vx)>.55&&Math.abs(cx)>30);
    if(!go){
      card.style.transition="transform .46s cubic-bezier(.2,.86,.2,1),opacity .3s ease";
      card.style.transform="translate3d(0,0,0) rotate(0deg)";card.style.opacity="1";
      const back=card.parentElement?.querySelector(".deck-card.back");
      if(back){back.style.transition="transform .46s cubic-bezier(.2,.86,.2,1),opacity .3s";back.style.transform="translateY(9px) scale(.965)";back.style.opacity=".72"}
      return
    }
    const dir=cx>=0?1:-1;
    card.style.transition="transform .30s cubic-bezier(.18,.78,.23,1),opacity .24s ease";
    card.style.transform=`translate3d(${dir*window.innerWidth*1.25}px,${cy*.15}px,0) rotate(${dir*10}deg)`;
    card.style.opacity="0";
    setTimeout(()=>dir>0?likeJob(id):passJob(id),270)
  };
  card.onpointerup=end;card.onpointercancel=end
}

/* CHAT */
function chatReply(text){
  const t=text.toLowerCase();
  if(/chef|vorgesetz|leitung|kontroll/.test(t)){
    if(/kontroll/.test(t))return "Wenn du deinen Job kannst und trotzdem jeder Schritt kommentiert wird, würde mich das auch nerven. Ich würde aber nicht mit „Du kontrollierst mich ständig“ starten. Sag lieber: „Lass uns Ergebnis und Termin festlegen. Den Weg dahin würde ich gern selbst organisieren.“ Damit holst du dir Freiheit, ohne einen Machtkampf aufzumachen.";
    return "Erzähl mir kurz den konkreten Moment: Was hat dein Chef gesagt oder gemacht? Dann kann ich dir sagen, wie ich es an deiner Stelle ansprechen würde.";
  }
  if(/überforder|ueberforder|zu viel|stress/.test(t))return "Wenn wirklich zu viel auf dem Tisch liegt, ist „besser organisieren“ kein guter Tipp. Ich würde die Prioritätsentscheidung zurückgeben: „Ich schaffe A und B sauber. Wenn C heute auch fertig sein muss: Was davon soll dafür warten?“ So wird sichtbar, dass nicht alles gleichzeitig geht.";
  if(/gehalt|geld|verdien|lohn/.test(t))return "Beim Gehalt würde ich nicht mit „alles ist teurer geworden“ argumentieren. Dein stärkster Punkt ist dein Wert. Schreib dir drei Aufgaben auf, die du heute übernimmst und früher nicht gemacht hast. Dann hast du einen sauberen Einstieg ins Gespräch.";
  if(/kolleg|team|streit|konflikt/.test(t))return "Bei Teamstress hilft mir immer eine Frage: Geht es um einen konkreten Moment oder um ein Muster? Wenn es konkret war, klär genau den Moment früh. Wenn es ständig passiert, reden wir über Grenzen und Rollen – nicht nur über Harmonie.";
  if(/künd|kuend|weg|wechsel/.test(t))return "Ich würde heute nicht sofort kündigen. Erst trennen: Willst du wirklich aus dem Beruf raus – oder nur weg von Führung, Arbeitszeit oder diesem Arbeitgeber? Schau auf das, was du trotz allem noch magst. Das ist oft der schnellste Weg zur richtigen Entscheidung.";
  if(/motivation|kein bock|keine lust/.test(t))return "Wenn du ein paar Tage keine Motivation hast, würde ich noch keine große Karrierefrage daraus machen. Aber merk dir morgen zwei Momente: Was zieht dir Energie und was geht überraschend leicht? Genau da steckt meistens mehr Wahrheit drin als in „ich bin unmotiviert“.";
  if(/match|stelle|job/.test(t)){
    const j=currentJob()||likedJobs()[0];
    return j?`Dein stärkstes aktuelles Match ist ${j.title} bei ${j.company}. Der spannende Punkt ist nicht nur der Score: ${j.reasons[0]}. Wenn du willst, können wir gemeinsam prüfen, ob das wirklich besser zu dir passt oder nur auf dem Papier gut aussieht.`:"Du hast gerade keine offenen Demo-Matches mehr. Deine gespeicherten Jobs findest du unter Matches oder im Profil.";
  }
  return "Sag mir den konkreten Moment. Nicht die ganze Geschichte: Was ist passiert, wer war beteiligt und was hat dich daran am meisten genervt? Dann versuche ich dir etwas zu sagen, das du morgen tatsächlich benutzen kannst.";
}
function renderChat(m){
  m.innerHTML=`<section class="screen chat-screen">
    <div class="chat-header-copy"><div class="kicker">Chat</div><h1 class="title" style="font-size:35px">Dein persönlicher<br>Karriere-Guide.</h1><p class="subtitle">Frag alles. YVIA darf dir auch widersprechen.</p></div>
    <div class="chat-list" id="chatList">${state.chat.map(x=>`<div class="msg ${x.role}">${esc(x.text)}</div>`).join("")}</div>
    <div>
      <div class="chat-suggestions">
        ${["Mein Chef nervt","Ich bin überfordert","Soll ich wechseln?","Was hältst du von meinem Match?"].map(x=>`<button data-suggest="${esc(x)}">${esc(x)}</button>`).join("")}
      </div>
      <div class="chat-input">
        <button id="chatPlus">＋</button>
        <textarea id="chatInput" rows="1" placeholder="Schreib mir etwas …"></textarea>
        <button class="send" id="chatSend">↑</button>
      </div>
    </div>
  </section>`;
  const list=$("#chatList");requestAnimationFrame(()=>list.scrollTop=list.scrollHeight);
  const send=()=>{
    const i=$("#chatInput"),txt=i.value.trim();if(!txt)return;
    state.chat.push({role:"user",text:txt},{role:"bot",text:chatReply(txt)});
    state.chat=state.chat.slice(-30);save();render()
  };
  $("#chatSend").onclick=send;
  $("#chatInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
  $$("[data-suggest]").forEach(b=>b.onclick=()=>{$("#chatInput").value=b.dataset.suggest;send()});
  $("#chatPlus").onclick=()=>toast("Dateien im Chat kommen später mit dem Backend.")
}

/* PROFILE */
function renderProfile(m){
  const docs=state.documents||[];
  const liked=likedJobs();
  const panel=state.profileTab==="documents"?`
    <div class="panel-card">
      <h3>Deine Unterlagen</h3><p>Lade Lebenslauf, Zeugnisse und Zertifikate hoch. In dieser Demo werden Dateiname und Typ lokal gespeichert.</p>
      <div class="upload-box"><div class="upload-icon">↥</div><div><b>Lebenslauf hochladen</b><small>PDF, DOC oder DOCX</small></div><button id="cvUploadBtn">Auswählen</button></div>
      <div class="upload-box"><div class="upload-icon">＋</div><div><b>Zeugnisse & weitere Dokumente</b><small>Arbeitszeugnisse, Zertifikate, Nachweise</small></div><button id="docUploadBtn">Hinzufügen</button></div>
      <input id="cvInput" type="file" accept=".pdf,.doc,.docx,application/pdf">
      <input id="docInput" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,image/*">
      <div class="file-list">${docs.length?docs.map((d,i)=>`<div class="file-item"><span>${d.kind==="Lebenslauf"?"📄":"📎"}</span><div><b>${esc(d.name)}</b><small>${esc(d.kind)} · ${esc(d.size)}</small></div><button data-del-doc="${i}">×</button></div>`).join(""):`<div style="font-size:8px;color:#717c8b;padding:8px 2px">Noch keine Dokumente hinterlegt.</div>`}</div>
    </div>
  `:state.profileTab==="strengths"?`
    <div class="panel-card"><h3>Deine Stärken</h3><p>Kein perfekter Lebenslauf nötig. YVIA nutzt diese Punkte fürs Matching.</p><div class="tag-wrap">${state.skills.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div>
    <div class="panel-card"><h3>Deine Werte</h3><div class="tag-wrap">${state.values.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div>
  `:state.profileTab==="saved"?`
    <div class="panel-card"><h3>Gespeicherte Matches</h3><p>${liked.length} Job${liked.length===1?"":"s"} gemerkt.</p><div class="profile-jobs">${liked.length?liked.map(j=>`<button class="profile-job" data-job-open="${j.id}"><div class="pic" style="background-image:url('${j.image}')"></div><div class="txt"><b>${esc(j.title)}</b><small>${esc(j.company)} · ${j.score}%</small></div></button>`).join(""):`<div style="grid-column:1/-1;color:#74808f;font-size:9px;padding:16px 0">Noch nichts gespeichert.</div>`}</div></div>
  `:`
    <div class="panel-card"><h3>Dein Rahmen</h3>
      <div class="profile-row"><span>Gehalt</span><b>ab ${money(state.salary)}</b></div>
      <div class="profile-row"><span>Entfernung</span><b>max. ${state.distance} km</b></div>
      <div class="profile-row"><span>Profilstatus</span><b>${docs.length?"Unterlagen vorhanden":"Unterlagen fehlen"}</b></div>
      <div class="profile-row"><span>Gespeicherte Matches</span><b>${liked.length}</b></div>
    </div>
    <div class="panel-card"><button class="job-more" id="resetDemo">Demo-Daten zurücksetzen</button></div>
  `;

  m.innerHTML=`<section class="screen profile-screen">
    <div class="profile-hero">
      <button class="profile-photo" id="profilePhotoBtn">${state.profilePhoto?`<img src="${state.profilePhoto}" alt="">`:"👤"}</button>
      <div><small>DEIN YVIA PROFIL</small><h1>${esc(state.profileName||"Alex")}</h1><p>Dein Weg. Deine Stärken. Deine Möglichkeiten.</p></div>
      <button class="icon-btn" id="profileNameBtn">···</button>
      <input id="photoInput" type="file" accept="image/*">
    </div>
    <div class="profile-tabs">
      <button class="${state.profileTab==="documents"?"active":""}" data-pt="documents">Unterlagen</button>
      <button class="${state.profileTab==="strengths"?"active":""}" data-pt="strengths">Stärken</button>
      <button class="${state.profileTab==="saved"?"active":""}" data-pt="saved">Gemerkt</button>
      <button class="${state.profileTab==="settings"?"active":""}" data-pt="settings">Rahmen</button>
    </div>
    <div class="profile-panel">${panel}</div>
  </section>`;

  $$("[data-pt]").forEach(b=>b.onclick=()=>{state.profileTab=b.dataset.pt;save();render()});
  $("#profilePhotoBtn").onclick=()=>$("#photoInput").click();
  $("#photoInput").onchange=e=>{
    const f=e.target.files?.[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{state.profilePhoto=r.result;save();render()};r.readAsDataURL(f)
  };
  $("#profileNameBtn").onclick=()=>{
    const n=prompt("Wie soll YVIA dich nennen?",state.profileName||"");
    if(n!==null){state.profileName=n.trim()||state.profileName;save();render()}
  };
  $("#cvUploadBtn")?.addEventListener("click",()=>$("#cvInput").click());
  $("#docUploadBtn")?.addEventListener("click",()=>$("#docInput").click());
  $("#cvInput")?.addEventListener("change",e=>addDocs([...e.target.files],"Lebenslauf"));
  $("#docInput")?.addEventListener("change",e=>addDocs([...e.target.files],"Dokument"));
  $$("[data-del-doc]").forEach(b=>b.onclick=()=>{state.documents.splice(+b.dataset.delDoc,1);save();render()});
  $$("[data-job-open]").forEach(b=>b.onclick=()=>openJob(b.dataset.jobOpen));
  $("#resetDemo")?.addEventListener("click",()=>{localStorage.removeItem("yvia_v11");state=structuredClone(defaultState);render()})
}
function addDocs(files,kind){
  files.forEach(f=>state.documents.push({name:f.name,kind,size:f.size>1e6?(f.size/1e6).toFixed(1)+" MB":Math.max(1,Math.round(f.size/1024))+" KB"}));
  state.documents=state.documents.slice(-20);save();toast(kind==="Lebenslauf"?"Lebenslauf hinzugefügt":"Dokumente hinzugefügt");render()
}

/* JOB DETAIL */
function openJob(id){
  const j=jobs.find(x=>x.id===id);if(!j)return;
  const liked=state.liked.includes(id);
  $("#detailSheet").innerHTML=`<div class="grabber"></div>
    <div class="sheet-head"><div><div class="kicker">${j.score}% Match</div><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p></div><button class="close" id="closeModal">×</button></div>
    <div class="detail-img" style="background-image:url('${j.image}')"></div>
    <div class="detail-grid"><div><small>GEHALT</small><b>ab ${money(j.salary)}</b></div><div><small>MODELL</small><b>${esc(j.model)}</b></div><div><small>ORT</small><b>${esc(j.city)}</b></div><div><small>ARBEITSZEIT</small><b>${esc(j.type)}</b></div></div>
    <div class="detail-why"><b>Warum YVIA das passend findet</b><p>${j.reasons.map(x=>"• "+x).join("<br>")}</p></div>
    <div class="detail-why"><b>Worum es geht</b><p>${esc(j.about)}</p></div>
    <div class="detail-actions"><button class="secondary" id="detailClose">Zurück</button><button class="primary" id="detailLike">${liked?"Gespeichert ✓":"♥ Speichern"}</button></div>`;
  $("#detailModal").classList.remove("hidden");
  const close=()=>$("#detailModal").classList.add("hidden");
  $("#closeModal").onclick=close;$("#detailClose").onclick=close;$("#modalBackdrop").onclick=close;
  $("#detailLike").onclick=()=>{if(!state.liked.includes(id))state.liked.push(id);save();close();toast("Match gespeichert");render()}
}

render();
</script>
</body>
</html>
