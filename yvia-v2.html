<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>YVIA V2</title>
<style>
:root{
 --bg:#080b10;--bg2:#0b0f15;--card:#11161e;--card2:#151b24;--line:rgba(255,255,255,.08);
 --text:#f8f7f4;--muted:#9ba3ae;--orange:#ff9a62;--coral:#ff735b;--pink:#f65f92;
 --gold:#f5b24e;--blue:#6c8dff;--purple:#a16cff;--green:#6cd0a1;
 --safe:env(safe-area-inset-bottom,0px);--top:env(safe-area-inset-top,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05070a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{min-height:100dvh}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{width:min(100%,480px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:
 radial-gradient(circle at 105% 0%,rgba(255,118,80,.12),transparent 24%),
 linear-gradient(180deg,#090d12 0%,#07090d 100%)}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(circle at 12% 42%,rgba(255,139,80,.05),transparent 20%),
 radial-gradient(circle at 82% 75%,rgba(244,95,146,.04),transparent 24%)}

/* header */
.header{height:76px;padding:calc(14px + var(--top)) 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:9px}
.logo-mark{width:33px;height:33px;position:relative}
.logo-mark:before,.logo-mark:after{content:"";position:absolute;bottom:2px;width:20px;height:28px;border-radius:18px 18px 14px 14px;transform-origin:bottom}
.logo-mark:before{left:2px;transform:rotate(-42deg);background:linear-gradient(180deg,#ffba65,#ff765b)}
.logo-mark:after{right:2px;transform:rotate(42deg);background:linear-gradient(180deg,#ffd17b,#f55f92)}
.logo strong{font-size:20px;letter-spacing:.06em}
.header-actions{display:flex;align-items:center;gap:8px}
.capture{height:39px;border:1px solid rgba(255,137,93,.23);border-radius:14px;padding:0 12px;background:linear-gradient(135deg,rgba(255,117,91,.18),rgba(246,95,146,.10));color:#ff9c78;font-size:10px;font-weight:850}
.avatar{width:39px;height:39px;border-radius:14px;border:1px solid var(--line);background:#161b24;color:#fff;overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}

/* screen */
main{height:calc(100dvh - 76px);padding:0 16px calc(91px + var(--safe));position:relative;z-index:2}
.screen{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:4px 1px 24px}
.screen::-webkit-scrollbar{display:none}
.eyebrow{font-size:11px;color:#ff936d;font-weight:850;letter-spacing:.10em;text-transform:uppercase}
.hero-title{font-size:39px;line-height:.98;letter-spacing:-.055em;margin:8px 0 8px;max-width:390px}
.hero-sub{font-size:13px;line-height:1.45;color:var(--muted);margin:0 0 16px}

/* nav */
.nav{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(10px + var(--safe));height:70px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(13,17,24,.94);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(22px);box-shadow:0 20px 50px rgba(0,0,0,.38)}
.nav button{border:0;border-radius:18px;background:transparent;color:#767f8d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav span{font-size:19px}.nav small{font-size:10px;font-weight:800}
.nav button.active{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.04));color:#fff}
.nav button.active span{color:#ff8e6c}

/* mood */
.mood-top{position:relative;padding-top:4px}
.mood-orb{position:absolute;right:2px;top:10px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd487 0,#ff9165 42%,#ef5d8a 78%,#7f67e9 100%);box-shadow:0 0 50px rgba(255,113,91,.18)}
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.mood{height:92px;border:1px solid var(--line);border-radius:21px;background:#111722;color:#fff;padding:8px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.mood span{font-size:29px}.mood small{font-size:9px;color:#9aa3ae;font-weight:800;text-align:center}
.mood.active{border-color:rgba(255,128,94,.64);background:radial-gradient(circle at 50% 0%,rgba(255,171,95,.18),transparent 55%),linear-gradient(145deg,rgba(255,117,91,.28),rgba(246,95,146,.16));box-shadow:0 14px 36px rgba(244,95,146,.13)}
.note-card{margin-top:12px;padding:14px;border-radius:22px;background:#111722;border:1px solid var(--line)}
.note-card label{display:block;font-size:11px;color:#a0a8b3;font-weight:800;margin-bottom:7px}
.note-card textarea{width:100%;min-height:74px;resize:none;border:0;background:transparent;color:#fff;outline:none;font-size:13px;line-height:1.45}
.action-row{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:11px}
.secondary{height:48px;border:1px solid var(--line);border-radius:16px;background:#111722;color:#aeb5bf;padding:0 14px;font-size:11px;font-weight:800}
.primary{height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;padding:0 17px;font-size:11px;font-weight:850;box-shadow:0 14px 30px rgba(244,95,146,.18)}
.friend-card{margin-top:14px;border-radius:24px;background:
 radial-gradient(circle at 10% 100%,rgba(255,145,82,.24),transparent 35%),
 linear-gradient(145deg,#121820,#0d1219);border:1px solid rgba(255,136,91,.12);padding:14px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.friend-face{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#ffe6b8,#ff9b66 50%,#f66090);box-shadow:0 0 38px rgba(255,120,86,.20)}
.friend-card b{font-size:13px}.friend-card p{font-size:10px;color:#a0a8b3;line-height:1.4;margin:4px 0 0}

/* analysis */
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:16px;background:#0d131b;margin:12px 0}
.segment button{height:36px;border:0;border-radius:12px;background:transparent;color:#707a88;font-size:9px;font-weight:800}
.segment button.active{background:linear-gradient(135deg,rgba(255,117,91,.22),rgba(246,95,146,.12));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,137,93,.28)}
.metric-card{border-radius:22px;background:#111722;border:1px solid var(--line);padding:15px;margin-bottom:10px;overflow:hidden;position:relative}
.metric-card:after{content:"";position:absolute;width:100px;height:100px;right:-28px;top:-28px;border-radius:50%;filter:blur(6px);opacity:.18}
.metric-card.stress:after{background:#f45f92}.metric-card.sat:after{background:#f5b24e}.metric-card.energy:after{background:#6c8dff}
.metric-head{display:flex;align-items:center;justify-content:space-between}
.metric-head div{display:flex;align-items:center;gap:8px}.metric-head span{font-size:20px}.metric-head b{font-size:13px}.metric-head strong{font-size:20px}
.spark{height:62px;margin-top:5px}.spark svg{width:100%;height:100%}
.metric-foot{font-size:9px;color:#8e98a6;margin-top:4px}
.insight-card{margin-top:10px;border-radius:22px;padding:15px;background:linear-gradient(135deg,rgba(255,117,91,.11),rgba(246,95,146,.05));border:1px solid rgba(255,123,89,.13)}
.insight-card small{font-size:8px;color:#ff9876;font-weight:900;letter-spacing:.08em}.insight-card h3{font-size:16px;line-height:1.15;margin:6px 0}.insight-card p{font-size:11px;color:#a0a8b3;line-height:1.45;margin:0}
.analysis-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.analysis-buttons button{min-height:78px;border:1px solid var(--line);border-radius:19px;background:#111722;color:#fff;padding:12px;text-align:left}
.analysis-buttons span{font-size:18px;color:#ff936f}.analysis-buttons b{display:block;font-size:11px;margin-top:6px}.analysis-buttons small{display:block;font-size:8px;color:#818b99;margin-top:3px}

/* matches */
.match-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.filterbtn{height:38px;border:1px solid var(--line);border-radius:13px;background:#111722;color:#aab2bd;padding:0 11px;font-size:10px;font-weight:800}
.deck{height:575px;position:relative}
.job-card{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#111722;border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 80px rgba(0,0,0,.45);touch-action:none;transform-origin:50% 92%;will-change:transform}
.job-card.back{transform:translateY(9px) scale(.965);opacity:.68}
.job-img{height:59%;background-size:cover;background-position:center;position:relative}
.job-img:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,9,13,.95) 0%,rgba(7,9,13,.10) 65%,transparent)}
.match-score{position:absolute;z-index:2;left:14px;top:14px;padding:8px 11px;border-radius:999px;background:rgba(9,13,18,.76);border:1px solid rgba(255,255,255,.13);font-size:10px;font-weight:900;color:#ffd4a6}
.job-title{position:absolute;z-index:2;left:16px;right:16px;bottom:14px}
.job-title h2{font-size:28px;line-height:1.02;margin:0;letter-spacing:-.04em}.job-title p{font-size:11px;color:#d2d6dc;margin:5px 0 0}
.job-body{height:41%;padding:14px 16px;display:flex;flex-direction:column}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{padding:7px 9px;border-radius:999px;background:#171e29;color:#b7bec8;font-size:8px}
.reasons{display:grid;gap:6px;margin-top:10px}.reasons div{font-size:10px;color:#aab2bc}.reasons b{color:#ff966f;margin-right:6px}
.more{height:41px;margin-top:auto;border:1px solid var(--line);border-radius:14px;background:#161d27;color:#fff;font-size:10px;font-weight:800}
.swipe-actions{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;align-items:center;margin-top:14px}
.swipe-actions button{height:58px;border-radius:20px;font-size:20px}
.nope{border:1px solid var(--line);background:#111722;color:#fff}.yes{border:0;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;box-shadow:0 14px 32px rgba(244,95,146,.22)}
.swipe-actions span{text-align:center;font-size:9px;color:#717c8a}

/* chat */
.chat-head{padding-top:3px}
.chat-list{display:flex;flex-direction:column;gap:9px;margin:14px 0 12px;min-height:360px}
.msg{max-width:86%;padding:12px 14px;border-radius:19px;font-size:12px;line-height:1.45}
.msg.bot{align-self:flex-start;background:#111722;border:1px solid var(--line)}.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--coral),var(--pink))}
.suggestions{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-bottom:8px}.suggestions::-webkit-scrollbar{display:none}
.suggestions button{flex:none;border:1px solid var(--line);border-radius:999px;background:#111722;color:#a5adb8;padding:8px 10px;font-size:8px}
.composer{display:grid;grid-template-columns:1fr 45px;gap:7px;padding:7px;border:1px solid var(--line);border-radius:18px;background:#101722}
.composer textarea{height:45px;resize:none;border:0;background:transparent;color:#fff;outline:none;padding:10px 4px;font-size:11px}.composer button{border:0;border-radius:14px;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;font-size:17px}

/* profile */
.profile-hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:5px 2px 12px}
.profile-photo{width:92px;height:92px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,137,93,.28);background:#151b24;color:#fff;font-size:34px}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-hero small{font-size:9px;color:#ff936f;font-weight:850;letter-spacing:.06em}.profile-hero h1{font-size:30px;margin:4px 0}.profile-hero p{font-size:11px;color:#8f99a7;line-height:1.4;margin:0}
.profile-strength{border-radius:23px;padding:15px;background:radial-gradient(circle at 100% 0%,rgba(255,117,91,.12),transparent 40%),#111722;border:1px solid var(--line);display:grid;grid-template-columns:82px 1fr;gap:13px;align-items:center}
.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff8b68 78%,#242c37 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#111722}.ring b{z-index:1;font-size:16px}
.profile-strength small{font-size:8px;color:#7f8998;font-weight:900}.profile-strength h3{font-size:14px;margin:4px 0}.profile-strength p{font-size:9px;color:#8f99a7;line-height:1.35;margin:0}
.profile-list{display:grid;gap:8px;margin-top:10px}
.profile-item{width:100%;border:1px solid var(--line);border-radius:18px;background:#111722;color:#fff;padding:12px;display:grid;grid-template-columns:40px 1fr 18px;gap:10px;align-items:center;text-align:left}
.profile-item>span{width:40px;height:40px;border-radius:13px;background:#1a222d;display:grid;place-items:center;color:#ff9673;font-size:17px}.profile-item b{font-size:12px}.profile-item p{font-size:9px;color:#838d9a;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-item em{font-style:normal;color:#687382;font-size:18px}
.cv-card{margin-top:10px;border-radius:22px;padding:14px;background:linear-gradient(135deg,rgba(255,137,83,.12),rgba(244,95,146,.05));border:1px solid rgba(255,126,89,.14)}
.cv-card small{font-size:8px;color:#ff936f;font-weight:900}.cv-card h3{font-size:15px;margin:5px 0}.cv-card p{font-size:10px;line-height:1.4;color:#909aa8;margin:0}.cv-card button{margin-top:10px;height:40px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;padding:0 12px;font-size:9px;font-weight:800}

/* modal */
.modal{position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end}.modal.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}.sheet{position:relative;width:100%;max-height:88%;overflow:auto;border-radius:30px 30px 0 0;background:#0d1219;border:1px solid var(--line);padding:13px 17px calc(20px + var(--safe));box-shadow:0 -30px 80px rgba(0,0,0,.48)}
.grab{width:38px;height:4px;border-radius:99px;background:#303745;margin:0 auto 11px}.sheet h2{font-size:25px;margin:0 0 6px}.sheet p{font-size:10px;color:#8993a1;line-height:1.45}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.option-grid button{height:48px;border:1px solid var(--line);border-radius:14px;background:#111722;color:#a3acb8;font-size:9px}.option-grid button.active{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;border-color:transparent}
.range-row{margin-top:12px}.range-row label{display:flex;justify-content:space-between;font-size:9px;color:#8f99a7}.range-row input{width:100%;accent-color:var(--coral)}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:5vh 2px 8px}
.login h1{font-size:48px;line-height:.94;letter-spacing:-.07em;margin:6vh 0 14px}.login p{font-size:13px;color:#9099a7;line-height:1.48}
.login-orb{width:180px;height:180px;margin:16px auto;border-radius:50%;background:radial-gradient(circle at 30% 28%,#ffe3b3 0,#ff9a65 36%,#f45f91 68%,#8b68ef 100%);box-shadow:0 28px 70px rgba(244,95,146,.15)}
.auth{display:grid;gap:8px}.auth input{height:49px;border:1px solid var(--line);border-radius:16px;background:#111722;color:#fff;padding:0 12px;font-size:11px}.auth button{height:49px;border-radius:16px;font-size:11px;font-weight:800}
.consent{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#101722;color:#929ca9;font-size:8px;line-height:1.4}.consent input{width:17px;height:17px;accent-color:var(--coral)}.consent button{height:auto;border:0;background:none;color:#ff9272;padding:0;text-decoration:underline;font-size:inherit}

@media(max-width:380px){
 .hero-title{font-size:35px}.moodfaces-v14 .moodface{height:84px!important}
}
</style>
</head>
<body>
<div id="app">
 <header class="header hidden" id="header">
   <div class="logo"><div class="logo-mark"></div><strong>YVIA</strong></div>
   <div class="header-actions"><button class="capture" id="captureBtn">⚡ Situation</button><button class="avatar" id="avatarBtn">👤</button></div>
 </header>
 <main id="main"></main>
 <nav class="nav hidden" id="nav">
  <button data-route="mood"><span>⌂</span><small>Stimmung</small></button>
  <button data-route="matches"><span>♡</span><small>Matches</small></button>
  <button data-route="chat"><span>◌</span><small>Chat</small></button>
  <button data-route="profile"><span>♙</span><small>Profil</small></button>
 </nav>
 <div class="modal hidden" id="modal"><div class="backdrop" id="backdrop"></div><section class="sheet" id="sheet"></section></div>
</div>
<script>
const VERSION="2.0", $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const euro=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);

function sparkSVG(type){const vals=state.entries.slice(-8).map(x=>+x[type]);const a=vals.length>1?vals:[3,3,3,3];const w=320,h=60,p=4,pts=a.map((v,i)=>[p+i*(w-p*2)/(a.length-1),h-p-(v-1)/4*(h-p*2)]);let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){let p1=pts[i],p2=pts[i+1],mx=(p1[0]+p2[0])/2;d+=` C ${mx} ${p1[1]}, ${mx} ${p2[1]}, ${p2[0]} ${p2[1]}`}return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${type==="stress"?"#f45f92":type==="energy"?"#7b8cff":"#f5b24e"}" stroke-width="3" stroke-linecap="round"/></svg>`}
function analysisHTML(){const sc=totalScore();return `<div class="segment"><button class="active">7 Tage</button><button>4 Wochen</button><button>3 Monate</button></div>

function currentJobs(){return jobs.filter(j=>!state.passed.includes(j.id)&&!state.liked.includes(j.id))}
function renderMatches(){const a=currentJobs(),j=a[0],n=a[1];$("#main").innerHTML=`<section class="screen"><div class="match-header"><div><div class="eyebrow">Matches</div><h1 class="hero-title">Jobs, die zu dir passen</h1><p class="hero-sub">Keine endlose Suche. Nur echte Matches.</p></div><button class="filterbtn" id="filterBtn">Filter</button></div>${j?`<div class="deck">${n?jobCard(n,true):""}${jobCard(j,false)}</div><div class="swipe-actions"><button class="nope" id="nope">✕</button><span>swipen oder tippen</span><button class="yes" id="yes">♥</button></div>`:'<div class="insight-card"><h3>Für jetzt alles gesehen ✨</h3><p>Du kannst die Demo-Jobs jederzeit zurücksetzen.</p><button class="primary" id="resetJobs">Zurücksetzen</button></div>'}</section>`;$("#filterBtn").onclick=openFilters;if(j){$("#nope").onclick=()=>pass(j.id);$("#yes").onclick=()=>like(j.id);setupSwipe($("#frontCard"),j.id)}$("#resetJobs")?.addEventListener("click",()=>{state.passed=[];state.liked=[];save();render()});$$("[data-more]").forEach(b=>b.onclick=e=>{e.stopPropagation();openJob(b.dataset.more)})}
function jobCard(j,back){return `<article class="job-card ${back?"back":""}" ${back?"":"id='frontCard'"}><div class="job-img" style="background-image:url('${j.image}')"><div class="match-score">✦ ${j.score}% Match</div><div class="job-title"><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p></div></div><div class="job-body"><div class="tags"><span>${j.model}</span><span>${j.hours}</span><span>ab ${euro(j.salary)}</span></div><div class="reasons">${j.reasons.map(x=>`<div><b>✓</b>${esc(x)}</div>`).join("")}</div><button class="more" data-more="${j.id}">Mehr erfahren</button></div></article>`}
function like(id){if(!state.liked.includes(id))state.liked.push(id);save();render()}function pass(id){if(!state.passed.includes(id))state.passed.push(id);save();render()}
function setupSwipe(card,id){let sx=0,sy=0,cx=0,cy=0,drag=false,pid=null,back=card?.parentElement?.querySelector(".back");if(!card)return;card.onpointerdown=e=>{if(e.target.closest("button"))return;drag=true;pid=e.pointerId;card.setPointerCapture?.(pid);sx=e.clientX;sy=e.clientY;card.style.transition="none"};card.onpointermove=e=>{if(!drag)return;cx=e.clientX-sx;cy=e.clientY-sy;let p=Math.min(1,Math.abs(cx)/140);card.style.transform=`translate3d(${cx}px,${cy*.06}px,0) rotate(${cx/35}deg) scale(${1-p*.015})`;if(back)back.style.transform=`translateY(${9-8*p}px) scale(${.965+.034*p})`};card.onpointerup=()=>{if(!drag)return;drag=false;let go=Math.abs(cx)>90;if(!go){card.style.transition=".5s cubic-bezier(.18,.88,.2,1)";card.style.transform="none";if(back)back.style.transform="translateY(9px) scale(.965)";return}let d=cx>0?1:-1;card.style.transition=".28s cubic-bezier(.16,.78,.2,1)";card.style.transform=`translate3d(${d*650}px,0,0) rotate(${d*10}deg)`;setTimeout(()=>d>0?like(id):pass(id),260)}}
function openFilters(){openModal(`<h2>Filter</h2><p>Nur das, was für dich wirklich passt.</p><div class="option-grid">${["Hybrid","Vor Ort","Homeoffice","Vollzeit","Teilzeit"].map(x=>`<button>${x}</button>`).join("")}</div><div class="range-row"><label><span>Max. Entfernung</span><b>${state.distance} km</b></label><input id="dist" type="range" min="5" max="100" value="${state.distance}"></div><button class="primary" id="applyF" style="width:100%;margin-top:12px">Anwenden</button>`);$("#dist").oninput=e=>state.distance=+e.target.value;$("#applyF").onclick=()=>{save();closeModal()}}
function openJob(id){const j=jobs.find(x=>x.id===id);openModal(`<h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.city)}</p><div style="height:180px;border-radius:18px;background-image:url('${j.image}');background-size:cover;background-position:center;margin:10px 0"></div><div class="insight-card"><small>WARUM YVIA DAS PASSEND FINDET</small><h3>${j.score}% Match</h3><p>${j.reasons.join(" · ")}</p></div><button class="primary" id="saveJob" style="width:100%;margin-top:10px">♥ Merken</button>`);$("#saveJob").onclick=()=>{like(id);closeModal()}}

function friendReply(t){const x=t.toLowerCase();if(/chef|leitung|führung/.test(x))return "Uff 😕 das würde mich auch nerven. Was genau hat dein Chef gemacht? Ein Satz reicht – dann überlegen wir etwas, das du morgen wirklich sagen kannst.";if(/stress|überforder|zu viel/.test(x))return "Das klingt gerade echt viel. Du musst nicht alles retten. Morgen würde ich nur klären: Was hat wirklich Priorität – und was darf warten? ❤️";if(/wechsel|künd|weg/.test(x))return "Ich würde heute nichts überstürzen. Erst trennen: Willst du aus dem Beruf raus – oder nur aus dieser Situation?";if(/geld|gehalt/.test(x))return "Ja, das kann richtig frustrieren 😕. Schreib dir drei Dinge auf, die du heute zusätzlich leistest. Genau damit würde ich ins Gespräch gehen.";return "Ich hör dich ❤️. Erzähl mir nur den einen Moment, der dir gerade am meisten im Kopf hängt."}
function renderChat(){$("#main").innerHTML=`<section class="screen"><div class="chat-head"><div class="eyebrow">YVIA Chat</div><h1 class="hero-title">Sag's mir einfach.</h1><p class="hero-sub">Wie bei jemandem, dem du wirklich vertraust.</p></div><div class="chat-list" id="chatList">${state.chat.map(x=>`<div class="msg ${x.role}">${esc(x.text)}</div>`).join("")}</div><div class="suggestions">${["Mein Chef nervt","Ich kann gerade nicht mehr","Soll ich wechseln?","Passt der Job wirklich?"].map(x=>`<button data-sug="${x}">${x}</button>`).join("")}</div><div class="composer"><textarea id="chatInput" placeholder="Was ist los?"></textarea><button id="send">↑</button></div></section>`;const list=$("#chatList");list.scrollTop=list.scrollHeight;const send=()=>{let t=$("#chatInput").value.trim();if(!t)return;state.chat.push({role:"user",text:t},{role:"bot",text:friendReply(t)});save();render()};$("#send").onclick=send;$$("[data-sug]").forEach(b=>b.onclick=()=>{$("#chatInput").value=b.dataset.sug;send()})}

function renderProfile(){const likedJobs=state.liked.map(id=>jobs.find(j=>j.id===id)).filter(Boolean);$("#main").innerHTML=`<section class="screen"><div class="profile-hero"><button class="profile-photo" id="photoBtn">${state.photo?`<img src="${state.photo}">`:"👤"}</button><div><small>DEIN YVIA PROFIL</small><h1>${esc(state.name)}</h1><p>Auf der Suche nach Arbeit, die wirklich zu dir passt.</p></div><input type="file" id="photoInput" accept="image/*" hidden></div><div class="profile-strength"><div class="ring"><b>78%</b></div><div><small>PROFILSTÄRKE</small><h3>Schon ziemlich gut.</h3><p>Je klarer du bist, desto besser werden deine Matches.</p></div></div><div class="profile-list">${profileItem("★","Stärken",state.skills.join(", "))}${profileItem("♥","Werte",state.values.join(", "))}${profileItem("◎","Ziele","Arbeit, die besser zu mir passt.")}${profileItem("⌖","Mein Rahmen",`${euro(state.salary)} · ${state.distance} km`)}${profileItem("♡","Gemerkt",`${likedJobs.length} gespeicherte Matches`)}</div><div class="cv-card"><small>DEINE UNTERLAGEN</small><h3>Lebenslauf nicht perfekt? Egal.</h3><p>YVIA soll das ganze Bild sehen – Persönlichkeit, Potenziale und deine Geschichte.</p><button id="docsBtn">Unterlagen hinzufügen →</button></div></section>`;$("#photoBtn").onclick=()=>$("#photoInput").click();$("#photoInput").onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.photo=r.result;save();render()};r.readAsDataURL(f)};$$("[data-prof]").forEach(b=>b.onclick=()=>openProfilePart(b.dataset.prof));$("#docsBtn").onclick=()=>openModal(`<h2>Unterlagen</h2><p>Lebenslauf, Zeugnisse und Zertifikate können in einer späteren Backend-Version dauerhaft gespeichert werden.</p>`)}
function profileItem(icon,title,text){return `<button class="profile-item" data-prof="${title}"><span>${icon}</span><div><b>${title}</b><p>${esc(text)}</p></div><em>›</em></button>`}
function openProfilePart(part){if(part==="Stärken")openModal(`<h2>Deine Stärken</h2><p>Wähle aus oder ergänze eigene.</p><div class="option-grid">${["Organisation","Überblick","Kommunikation","Verlässlich","Kreativ","Empathisch"].map(x=>`<button class="${state.skills.includes(x)?"active":""}">${x}</button>`).join("")}</div>`);else openModal(`<h2>${part}</h2><p>Dieser Bereich wird im nächsten Feinschliff vollständig editierbar.</p>`)}

function openSituation(){openModal(`<h2>Was ist gerade passiert?</h2><p>Ein Tap reicht. YVIA ordnet die Situation später automatisch deinem Stimmungsbild zu.</p><div class="option-grid">${["👤 Führung","👥 Team","⚡ Zu viel","★ Erfolg","◷ Arbeitszeit","… Sonstiges"].map(x=>`<button data-sit="${x}">${x}</button>`).join("")}</div><textarea id="sitNote" style="width:100%;height:70px;margin-top:9px;border:1px solid var(--line);border-radius:14px;background:#111722;color:white;padding:9px" placeholder="Optional: ein Satz dazu"></textarea>`);$$("[data-sit]").forEach(b=>b.onclick=()=>{state.moments.push({ts:Date.now(),type:b.dataset.sit,note:$("#sitNote").value});save();closeModal()})}

render();
</script>
</body>
</html>
